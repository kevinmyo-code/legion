  securitySchemes:
    deviceTokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'One token per device, never per user - revoking a lost phone does
        not sign out any other device. Send as `Authorization: Token <key>`, the literal
        word `Token` followed by a space then the raw key returned by `POST /api/auth/login`.'
