  /api/changes:
    get:
      operationId: api_changes_retrieve
      parameters:
      - in: query
        name: aspects
        schema:
          type: string
        description: 'Comma-separated aspect names, e.g. `events,checklists`. Missing
          or blank means every known aspect: events, checklists, body, memory, places,
          voice_notes.'
      - in: query
        name: since
        schema:
          type: string
        description: ISO-8601 watermark. Rows with updated_at >= since are returned.
          Missing or unparsable means fetch everything, never fetch nothing.
      tags:
      - api
      security:
      - deviceTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangesResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: ''
  /api/checklists/:
    get:
      operationId: api_checklists_list
      description: '`GET /api/checklists?since=<iso>` and `POST /api/checklists`.'
      parameters:
      - in: query
        name: since
        schema:
          type: string
        description: ISO-8601 watermark. Rows with updated_at >= since are returned.
          Missing or unparsable means fetch everything, never fetch nothing.
      tags:
