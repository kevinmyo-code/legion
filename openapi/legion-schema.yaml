      description: '`GET /api/checklists?since=<iso>` and `POST /api/checklists`.'
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Checklist'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Checklist'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Checklist'
        required: true
      security:
      - deviceTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checklist'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checklist'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: ''
  /api/checklists/{checklist_id}:
    get:
      operationId: api_checklists_retrieve
      description: '`GET`/`PATCH`/`DELETE /api/checklists/<checklist_id>`.'
      parameters:
      - in: path
        name: checklist_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - deviceTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checklist'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: ''
    patch:
      operationId: api_checklists_partial_update
      description: '`GET`/`PATCH`/`DELETE /api/checklists/<checklist_id>`.'
      parameters:
      - in: path
        name: checklist_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
