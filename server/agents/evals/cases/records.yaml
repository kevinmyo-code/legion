# records: engine-brain ticket 15's tools on the invented household (agents/evals/fixture.py,
# `_seed_records`: a "Guitar practice" tracker, record type "Session", fields piece / minutes /
# date / focus, two sessions; and a "Lifting" tracker with one entry, named next to the body
# aspect's workouts on purpose). FAKE utterances and rows only: this file is public.
#
# Phone -> engine: list_aspects, describe_aspect, create_aspect, update_aspect keep their names;
# query_records -> query_aspect_records, create_record -> create_aspect_record, update_record ->
# update_aspect_record, delete_record -> delete_aspect_record (the registry's delete_record is a
# different tool). aspect_clerk has no twin. Matchers as in voice21.yaml.
#
# The first live run (ship stage2b, 2026-11-17) tracked "Workouts": the model rightly reached for
# the body aspect's workout tools, a case-design collision. The tracker moved to guitar practice.
suite: records
bar: 0.85
runs: 3
cases:
  - id: trackers_list
    turns:
      - say: "what trackers have I set up?"
        expect:
          calls: ["list_aspects"]
          not_calls: ["read_records", "list_tables"]
          answer_has: ["guitar"]
  - id: tracker_read
    turns:
      - say: "what have I practised on guitar lately?"
        expect:
          calls: ["query_aspect_records"]
          not_calls: ["create_aspect_record", "delete_aspect_record", "read_records"]
          answer_has: ["blackbird", "scale"]
  - id: tracker_log
    critical: true
    turns:
      - say: "log guitar practice: Wonderwall, 20 minutes today, chords"
        expect:
          calls: ["create_aspect_record"]
          succeeded: ["create_aspect_record"]
          not_calls: ["write_record"]
          args: {create_aspect_record: {aspect_name: {re: "(?i)guitar"}}}
          result_has: ["(?i)wonderwall", "20"]
  - id: tracker_update
    critical: true
    turns:
      - say: "change my Blackbird guitar session to 45 minutes"
        expect:
          calls: ["update_aspect_record"]
          succeeded: ["update_aspect_record"]
          not_calls: ["write_record"]
          result_has: ["45"]
  - id: tracker_delete_one
    critical: true
    turns:
      - say: "delete the major scales session from my guitar practice"
        expect:
          calls: ["delete_aspect_record"]
          succeeded: ["delete_aspect_record"]
          not_calls: ["delete_record"]
          result_has: ["(?i)scales"]
  - id: tracker_describe
    turns:
      - say: "what can I log in my guitar practice tracker?"
        expect:
          calls: ["describe_aspect"]
          not_calls: ["create_aspect", "update_aspect"]
          answer_has: ["piece|minutes|focus"]
  - id: tracker_create_drafts_first
    critical: true
    turns:
      - say: "start tracking my reading: book title, pages, and the date I finished"
        expect:
          calls: ["create_aspect"]
          args: {create_aspect: {aspect_name: {re: "(?i)read"}}}
          answer_has: ["(?i)book|title"]
          result_has: ["NOT created"]
  - id: tracker_add_field_drafts_first
    turns:
      - say: "add a notes field to my guitar practice sessions"
        expect:
          calls: ["update_aspect"]
          args: {update_aspect: {change: {re: "add_field"}}}
          result_has: ["NOT applied"]
  - id: tracker_near_a_builtin_domain
    turns:
      - say: "what's in my lifting tracker?"
        expect:
          calls: ["query_aspect_records|describe_aspect"]
          not_calls: ["get_todays_workout", "start_workout"]
          answer_has: ["deadlift"]
