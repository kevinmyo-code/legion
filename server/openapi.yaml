        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        make:
          type: string
        model:
          type: string
        year:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        trim:
          type: string
          nullable: true
        engine:
          type: string
          nullable: true
        confirmed:
          type: boolean
          default: false
        odometer_baseline:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          description: 'An odometer reading, paired with `odometer_baseline_at`. Both
            or neither: a baseline without its timestamp cannot be projected forward,
            so it is worse than none - it looks like knowledge and is not (`vehicles_odometer_baseline_paired`).'
