      - in: path
        name: identity
        schema:
          type: string
          format: uuid
        description: The row's `id`.
        required: true
      tags:
      - ingest
      security:
      - deviceToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestedFile'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: No such row. Nothing was changed.
  /api/ingest/receipt:
    post:
      operationId: api_ingest_receipt_create
      description: |-
        `public.commit_receipt(payload jsonb)`, moved into Django.

        The request body IS that RPC's `payload`, unchanged, and is a free-form JSON object on purpose (see this module's source for why it is not a serializer). Keys read: `content_sha256` (required), `provenance` (defaults to `LLM_RECONCILED`), `items` (array of `{name, quantity?, unit_price_cents?, total_price_cents, estimated_calories_kcal?, estimated_protein_g?, estimated_carbs_g?, estimated_fat_g?}`), the anchors `total_cents` / `subtotal_cents?` / `tax_cents?` / `other_charges_cents?`, `store`, `purchase_date`, `currency`, `photo_object_path?`, and the file facts `source_file_id?` / `display_name?` / `size_bytes?`. Money is an integer number of cents. **The four `estimated_*` fields are estimates and are excluded from the reconciliation arithmetic** (CLAUDE.md section 4 rule 5).
      tags:
      - ingest
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - deviceToken: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptCommitted'
          description: The gate passed and line items were written.
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestOutcome'
          description: Nothing was written, and that is a normal answer. Either this
            exact receipt was already committed, or the gate refused it and the refusal
            is now on record with its reason.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: 'The gate could not RUN - a missing `content_sha256`, a money
            field that is not an integer number of cents, a bad date, an `UNRECONCILED`
            provenance (there is no provisional path here), or a database constraint
            the payload tripped. Nothing was written, and no quarantine row was recorded
            either, because this is not a verdict about a document: it is a payload
            nothing could evaluate. Distinct from a quarantine, which is a 200.'
  /api/ingest/statement:
    post:
      operationId: api_ingest_statement_create
      description: |-
        `public.commit_statement(payload jsonb)`, moved into Django.

        The request body IS that RPC's `payload`, unchanged, and is a free-form JSON object on purpose (see this module's source for why it is not a serializer). Keys read: `content_sha256` (required), `provenance` (required, and never `UNRECONCILED` - there is no provisional path here), `lines` (array of `{txn_date, description, amount_cents, balance_cents?, line_ref?, category?}`), the three anchors `stated_total_cents?` / `opening_balance_cents` / `closing_balance_cents`, `account_last4`, `account_nickname`, `currency`, `period_start?`, `period_end?`, and the file facts `source_file_id?` / `display_name?` / `size_bytes?`. Money is an integer number of cents, never a decimal.
      tags:
      - ingest
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - deviceToken: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementCommitted'
          description: The gate passed and rows were written.
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestOutcome'
          description: Nothing was written, and that is a normal answer. Either this
            exact file was already committed, or the gate refused it and the refusal
            is now on record with its reason.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: 'The gate could not RUN - a missing `content_sha256`, a money
            field that is not an integer number of cents, a bad date, an `UNRECONCILED`
            provenance (there is no provisional path here), or a database constraint
            the payload tripped. Nothing was written, and no quarantine row was recorded
