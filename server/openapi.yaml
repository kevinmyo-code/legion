    Statement:
      type: object
      description: |-
        One `public.statements` row: a bank statement's header and, crucially,
        the three anchors the gate checked it against (section 4 rule 8).

        `ingested_file_id` rather than DRF's default `ingested_file` because that
        is the column's real name, and the name every existing client already
        reads - these rows reached the phone through PostgREST, which renders the
        physical column. Renaming it here would have been a gratuitous break for
        a tidier-looking field.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        ingested_file_id:
          type: string
          format: uuid
          readOnly: true
        account_last4:
          type: string
          readOnly: true
        account_nickname:
          type: string
          readOnly: true
        currency:
          type: string
          readOnly: true
        period_start:
          type: string
          format: date
          readOnly: true
        period_end:
          type: string
          format: date
          readOnly: true
        stated_total_cents:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          readOnly: true
          nullable: true
          description: The total the statement itself printed, in cents. NULL means
            the document printed none, which `statements_total_only_null_if_deterministic`
            permits only for a deterministically parsed statement. Never synthesised
            from the sum of the lines - that would make the check an identity (CLAUDE.md
            section 4 rule 6).
        opening_balance_cents:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          readOnly: true
          description: An anchor the gate checked against, in cents (section 4 rule
            8).
        closing_balance_cents:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          readOnly: true
          description: An anchor the gate checked against, in cents (section 4 rule
            8).
        provenance:
          allOf:
          - $ref: '#/components/schemas/ProvenanceEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - account_last4
      - account_nickname
      - closing_balance_cents
      - created_at
      - currency
      - id
      - ingested_file_id
      - opening_balance_cents
      - period_end
      - period_start
      - provenance
      - stated_total_cents
    StatementAnchors:
      type: object
      description: |-
        CLAUDE.md section 4 rule 8, echoed. The AUTHORITY is the stored row on
        `public.statements`; this copy is so a caller just told COMMITTED can see the
        three figures that earned it without a second round trip.
      properties:
        stated_total_cents:
          type: integer
          nullable: true
          description: Null means the bank printed none. **Never derived from sum(lines)**
            - that would make the check an identity.
        opening_balance_cents:
          type: integer
        closing_balance_cents:
          type: integer
        note:
          type: string
      required:
      - closing_balance_cents
      - note
      - opening_balance_cents
      - stated_total_cents
    StatementCommitted:
      type: object
      description: 'The 201 body: rows were written.'
      properties:
        outcome:
          type: string
          description: Always `COMMITTED` on a 201.
        statement_id:
          type: string
          format: uuid
        inserted:
          type: integer
          description: Ledger transactions written.
        duplicates_skipped:
          type: integer
        restatements_skipped:
          type: integer
        provisional_superseded:
          type: integer
          description: Rule 7 provisional rows deleted because this verified file
            covers the same card and window.
        anchors:
          $ref: '#/components/schemas/StatementAnchors'
      required:
      - anchors
      - duplicates_skipped
      - inserted
      - outcome
      - provisional_superseded
      - restatements_skipped
      - statement_id
    TickRequest:
      type: object
      description: |-
        `POST /api/checklists/<id>/items/<item>/tick` body - `{day, value?,
        source?}`. Deliberately a plain `Serializer`, not a `ModelSerializer`
        over `ChecklistTick`: the measured-item refusal (`validate`) needs the
        ITEM's own `measure_unit`, which is not a field on this request body at
        all (the item is named in the URL, not the payload) - so the check is
        written by hand rather than leaning on a field-level `validate_<name>`
        that has no access to a sibling object.
      properties:
        day:
          type: integer
        value:
          type: number
          format: double
          nullable: true
        source:
          type: string
          default: USER_REPORTED
      required:
      - day
    Vehicle:
      type: object
      description: |-
        Field-for-field `RemoteVehicle` / `VehicleUpload` (`FleetBackend.kt`).

        `confirmed` and `archived` default to False when omitted, matching their own
        column defaults. **That is a statement about the whole row, not a merge**:
        PUT here means "the row should be in this state", so a flag left out of the
        body reads as false rather than as "leave whatever is there". The same is
        true of every optional field on every table in this API; it is called out
        on this one because `archived` is USER state a person set deliberately
        (ticket 27, 2026-08-29) and silently clearing it would be worse than
        silently clearing a spec sheet's blank string.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        make:
          type: string
        model:
          type: string
        year:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        trim:
          type: string
          nullable: true
        engine:
          type: string
          nullable: true
        confirmed:
          type: boolean
          default: false
        odometer_baseline:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          description: 'An odometer reading, paired with `odometer_baseline_at`. Both
            or neither: a baseline without its timestamp cannot be projected forward,
            so it is worse than none - it looks like knowledge and is not (`vehicles_odometer_baseline_paired`).'
        odometer_baseline_at:
          type: string
          format: date-time
          nullable: true
        provenance:
          allOf:
          - $ref: '#/components/schemas/ProvenanceEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        origin_guid:
          type: string
          nullable: true
        archived:
          type: boolean
          default: false
        last_obd_mac:
          type: string
          nullable: true
          description: 'The MAC of the OBD dongle this car was last seen on. A best-effort
            rebuild HINT, never an identity: a car that changed dongles carries its
            old value here until the next sync, and nothing may be assigned on the
            strength of it alone.'
      required:
      - created_at
      - deleted_at
      - id
      - make
      - model
      - name
      - provenance
      - updated_at
      - year
    VehicleSpec:
      type: object
      description: |-
        Field-for-field `RemoteVehicleSpec` / `VehicleSpecUpload`: the factory
        build details for one car, mostly NHTSA vPIC VIN-decode output.

        DETERMINISTIC despite the three manually-typed columns (`paint_color`,
        `paint_code`, `build_notes`) that vPIC cannot supply - the column default
        says so and this matches it. `decoded_at` is null, not 0, for "never
        decoded": the phone stores 0L for that and carrying it forward would read
        as an actual moment in 1970.
      properties:
        vehicle_id:
          type: string
          format: uuid
        vin:
          type: string
          default: ''
        engine_cylinders:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        displacement_l:
          type: number
          format: double
          nullable: true
        engine_hp:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        engine_config:
          type: string
          default: ''
        fuel_type:
          type: string
          default: ''
        transmission_style:
          type: string
          default: ''
        transmission_speeds:
          type: string
          default: ''
        drive_type:
          type: string
          default: ''
        body_class:
          type: string
          default: ''
        doors:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        series:
          type: string
          default: ''
        vehicle_type:
          type: string
          default: ''
        manufacturer:
          type: string
          default: ''
        plant_city:
          type: string
          default: ''
        plant_country:
          type: string
          default: ''
        paint_color:
          type: string
          default: ''
        paint_code:
          type: string
          default: ''
        build_notes:
          type: string
          default: ''
        decoded_at:
          type: string
          format: date-time
          nullable: true
          description: Null means never decoded. Never 0 or an epoch timestamp - the
            phone stores 0L for this and it would read as an actual moment in 1970.
        provenance:
          allOf:
          - $ref: '#/components/schemas/ProvenanceEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - provenance
      - updated_at
      - vehicle_id
    VoiceNote:
      type: object
      description: |-
        Field-for-field `RemoteVoiceNote`. See this module's doc comment for
        the audio column that is absent from both.
      properties:
        id:
          type: string
