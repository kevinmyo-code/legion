    ObdBatchResult:
      type: object
      description: |-
        What `POST .../batch/` answers with.

        Four numbers rather than one, because a batch upload can partly no-op for
        two completely different reasons and a client that cannot tell them apart
        cannot tell a healthy retry from a bug. `FleetBackend.uploadObdSampleBatch`
        itself only reads success or failure - its own doc explains that decoding
        500 rows back to count them would spend the request-size budget the
        batching exists to protect - and these four cost one integer each.
      properties:
        received:
          type: integer
          description: How many samples were in the request body.
        inserted:
          type: integer
          description: How many rows this call actually wrote. Zero on a full re-post.
        already_present:
          type: integer
          description: How many were already stored under the same natural key `(vehicle_id,
            pid, recorded_at)` and were therefore skipped. A re-post of a batch that
            already landed reports every row here, which is what makes an unacknowledged
            upload safe to retry.
        duplicates_in_batch:
          type: integer
          description: How many rows in THIS body shared a natural key with an earlier
            row in the same body and were folded into it. Normally 0. Non-zero means
            the client sent two readings claiming the same car, PID and instant -
            which the table cannot store separately and which are indistinguishable
            to it - so the first was kept. Reported rather than silently dropped.
      required:
      - already_present
      - duplicates_in_batch
      - inserted
      - received
    ObdSample:
      type: object
      description: |-
        One `public.obd_samples` row as the windowed feed returns it.

        Not a `SyncedSerializer`: that base's `create`/`update` exist to write rows
        through the four generic routes, and this table has no such route. Reads
        only.

        **No `id` on the wire, and that is deliberate rather than an oversight.**
        `RemoteObdSample`'s own doc comment: "no `serverId`/`syncId` at all - the
        table's own natural key is `(vehicle_id, pid, recorded_at)`, which
        `FleetSync`'s pull-side dedup matches against directly rather than needing a
        separate identity column". There is no detail route to address a sample by
        its uuid, so publishing one would hand clients an identity that addresses
        nothing and invite them to key a cache on it.
      properties:
        vehicle_id:
          type: string
          format: uuid
          readOnly: true
        pid:
          type: string
        value:
          type: number
          format: double
        unit:
          type: string
        recorded_at:
          type: string
          format: date-time
          description: When the reading was taken from the car. Part of the natural
            key `(vehicle_id, pid, recorded_at)`, and the column this feed's `?since=`
            and `next` cursor are keyed on.
        lat:
          type: number
          format: double
          nullable: true
        lng:
          type: number
          format: double
          nullable: true
        created_at:
          type: string
          format: date-time
          description: 'When this server stored the sample - NOT when it was read.
            The two can be far apart: the phone batches uploads and resumes them across
            sessions.'
      required:
      - created_at
      - pid
      - recorded_at
      - unit
      - value
      - vehicle_id
    ObdSampleCount:
      type: object
      properties:
        count:
          type: integer
          description: How many `obd_samples` rows exist, for the whole table or for
            one vehicle.
      required:
      - count
    ObdSampleUpload:
      type: object
      description: |-
        One sample in a `POST .../batch/` body.

        A plain `Serializer`, not a `ModelSerializer`, because nothing here goes
        through the ORM: the insert is one statement with an explicit
        `on conflict (vehicle_id, pid, recorded_at) do nothing` (see
        `ObdSampleBatchView`), and a model serializer would suggest a per-row
        `.save()` that does not happen.

        `vehicle_id` is a bare `UUIDField` rather than a `PrimaryKeyRelatedField`
        for a measured reason: the related field issues one SELECT per row to prove
        the vehicle exists, which for a 500-row batch is 500 round trips against a
        remote Postgres. The view checks each DISTINCT vehicle once instead, which
        is the same guarantee at 1/500th the cost.
      properties:
        vehicle_id:
          type: string
          format: uuid
        pid:
          type: string
        value:
          type: number
          format: double
        unit:
          type: string
        recorded_at:
          type: string
          format: date-time
        lat:
          type: number
          format: double
          nullable: true
        lng:
          type: number
          format: double
          nullable: true
      required:
      - pid
      - recorded_at
      - unit
      - value
      - vehicle_id
