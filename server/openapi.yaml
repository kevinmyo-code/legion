    ReceiptEstimates:
      type: object
      description: |-
        Section 4 rule 5 as a response a caller cannot miss: anything the
        document does not state is an estimate and is labelled one.
      properties:
        fields:
          type: array
          items:
            type: string
        items_carrying_an_estimate:
          type: integer
        note:
          type: string
      required:
      - fields
      - items_carrying_an_estimate
      - note
    ReceiptLineItem:
      type: object
      description: |-
        One `public.receipt_line_items` row: what the receipt printed, plus four
        macro estimates it did not. See this module's doc comment on rule 5, and on
        why `quantity` and the estimates render as strings rather than numbers.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        receipt_id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
          readOnly: true
        unit_price_cents:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          readOnly: true
          nullable: true
        total_price_cents:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          readOnly: true
          description: In cents. Summed across a receipt's lines, this is what the
            gate checked against the printed total (CLAUDE.md section 4 rule 2).
        estimated_calories_kcal:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
          readOnly: true
          nullable: true
          description: 'An estimate, not a measurement: the model''s guess from the
            product name. A receipt never prints this. Excluded from every reconciliation
            check and never a gated figure (CLAUDE.md section 4 rule 5); any surface
            showing it must say it is an estimate.'
        estimated_protein_g:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
          readOnly: true
          nullable: true
          description: 'An estimate, not a measurement: the model''s guess from the
            product name. A receipt never prints this. Excluded from every reconciliation
            check and never a gated figure (CLAUDE.md section 4 rule 5); any surface
            showing it must say it is an estimate.'
        estimated_carbs_g:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
          readOnly: true
          nullable: true
          description: 'An estimate, not a measurement: the model''s guess from the
            product name. A receipt never prints this. Excluded from every reconciliation
            check and never a gated figure (CLAUDE.md section 4 rule 5); any surface
            showing it must say it is an estimate.'
        estimated_fat_g:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
          readOnly: true
          nullable: true
          description: 'An estimate, not a measurement: the model''s guess from the
            product name. A receipt never prints this. Excluded from every reconciliation
            check and never a gated figure (CLAUDE.md section 4 rule 5); any surface
            showing it must say it is an estimate.'
        reversal_of:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        provenance:
          allOf:
          - $ref: '#/components/schemas/ProvenanceEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        origin_guid:
          type: string
          readOnly: true
          nullable: true
      required:
      - created_at
      - estimated_calories_kcal
      - estimated_carbs_g
      - estimated_fat_g
      - estimated_protein_g
      - id
      - name
      - origin_guid
      - provenance
      - quantity
      - receipt_id
      - reversal_of
      - total_price_cents
      - unit_price_cents
