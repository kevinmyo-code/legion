    CodeClearEvent:
      type: object
      description: |-
        Field-for-field `RemoteCodeClearEvent` / `CodeClearEventUpload`: the
        outcome of one Mode 04 clear-codes send.

        A row exists only for CLEARED, RETURNED or UNVERIFIED. The two no-op
        outcomes (`NOTHING_TO_CLEAR`, `REFUSED`) never send anything and never
        reach this table, which is why they are not in the allowed set.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        sync_id:
          type: string
        vehicle_id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
        mileage:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        codes_before: {}
        freeze_frame:
          nullable: true
        codes_after:
          nullable: true
          description: THREE-way, not two. Null means the post-send re-read never
            completed (UNVERIFIED). An empty array means it ran and found nothing
            (CLEARED). A non-empty array names the codes that survived (RETURNED).
            Do not collapse null and the empty array.
        outcome:
          type: string
        ack_raw:
          type: string
          default: ''
          description: 'The adapter''s raw acknowledgement. DIAGNOSTIC ONLY: a failed
            send returns an empty string and a quiet link answers exactly like a real
            ack, so `outcome` is never asserted off this field.'
        provenance:
          allOf:
