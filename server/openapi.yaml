              schema:
                $ref: '#/components/schemas/Invite'
          description: A new invite. `join_url` is the whole thing to send someone
            - it carries the code and points at the SPA's /join screen on this same
            host.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: 'Nothing was changed: this route is owner-only. `owner` is
            the ONLY role there is and it governs membership alone - an owner and
            a member see exactly the same data (ADR 0045).'
  /api/households/me/invites/{code}:
    delete:
      operationId: api_households_me_invites_destroy
      description: |-
        `DELETE /api/households/me/invites/<code>`. Revokes a code this
        household minted, so nobody else can sign up with it.

        Revoke rather than delete: `revoked_at` is why
        `Invite.unavailable_reason` can tell someone holding the link "that was
        revoked by the person who made it" instead of "no such code", which is
        the difference between a person who knows to ask again and a person who
        thinks they mistyped it.
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - households
      security:
      - deviceToken: []
      - cookieAuth: []
      responses:
        '204':
          description: 'That code is revoked and can no longer be signed up with.
            Revoking an already-revoked code is the same answer: the outcome asked
            for holds.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: 'Nothing was changed: this route is owner-only. `owner` is
            the ONLY role there is and it governs membership alone - an owner and
            a member see exactly the same data (ADR 0045).'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: This household minted no invite with that code. Nothing was
            revoked.
  /api/households/me/members/{user_id}:
    delete:
      operationId: api_households_me_members_destroy
      description: |-
        `DELETE /api/households/me/members/<user_id>`. Removes a person from
        this household.

        **Three things happen together, and the second and third are the point.**
        The membership row goes, every live device token that person holds is
        revoked, and every invite they minted is revoked. Without the token
        revocation a removed person keeps a working phone; without the invite
        revocation they keep a working back door, which is the same failure one
        step removed. A Django session they hold survives as a cookie, but it now
        authenticates a user who is in no household, so `IsHouseholdMember`
        refuses every request it makes.

        **And a fourth, since ADR 0052:** the events and checklists that were
        private to them are tombstoned in the same transaction
        (`tombstone_private_rows`). What they shared stays shared.

        **The `User` row itself is NOT deleted**, deliberately: their rows in the
        household's data carry `household_id`, not a user id that would dangle,
        and deleting an account is a different decision from removing it from a
        family. They keep an account that belongs to no household until someone
        invites them into one.

        **The last owner cannot be removed, including by themself.** A household
        with no owner has nobody who can invite or remove anyone ever again, and
        there is no admin above it to fix that - ADR 0045 has no roles above
        `owner` and no approval workflow to appeal to.
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - households
      security:
      - deviceToken: []
      - cookieAuth: []
      responses:
        '204':
          description: Removed. Their device tokens are revoked, the invites they
            minted are revoked, and the events and checklists that were private to
            them are deleted. What they shared stays. Their account still exists and
            belongs to no household.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: 'Nobody was removed: they are the last owner of this household.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: 'Nothing was changed: this route is owner-only. `owner` is
            the ONLY role there is and it governs membership alone - an owner and
            a member see exactly the same data (ADR 0045).'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Nobody with that user id is in this household. Nobody was removed.
  /api/ingest/files/:
    get:
      operationId: api_ingest_files_list
