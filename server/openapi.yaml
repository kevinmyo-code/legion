  /api/households/me:
    get:
      operationId: api_households_me_retrieve
      description: |-
        `GET`/`PATCH /api/households/me` - the caller's household.

        GET is open to any member: the roster is not owner-only information, and
        a member who could not see who else is in their household would have no
        way to check they joined the right one. The same goes for the timezone:
        every member reads it. PATCH (rename, set the timezone) is owner-only,
        which is why `get_permissions` splits by method rather than the class
        carrying one permission for both.

        **The timezone lives here rather than at a separate settings route**
        (Kevin, 2026-10-05). It is a property of the household, read by every
        member and written by the owner - exactly this endpoint's existing split -
        and a second resource would be a second place the same row is described.
      tags:
      - households
      security:
      - deviceToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
          description: The caller's household and everyone in it, oldest member first.
            `id` is the household's own id - this is the household resource, and the
            one place on this API a household uuid appears.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: The credential is live but its user is in no household.
    patch:
      operationId: api_households_me_partial_update
      description: |-
        `GET`/`PATCH /api/households/me` - the caller's household.

        GET is open to any member: the roster is not owner-only information, and
        a member who could not see who else is in their household would have no
        way to check they joined the right one. The same goes for the timezone:
        every member reads it. PATCH (rename, set the timezone) is owner-only,
        which is why `get_permissions` splits by method rather than the class
        carrying one permission for both.

        **The timezone lives here rather than at a separate settings route**
        (Kevin, 2026-10-05). It is a property of the household, read by every
        member and written by the owner - exactly this endpoint's existing split -
        and a second resource would be a second place the same row is described.
      tags:
      - households
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedHouseholdPatchRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedHouseholdPatchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedHouseholdPatchRequest'
      security:
      - deviceToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
          description: Saved. The body is the household as stored.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: 'Nothing was changed: no field was sent, or `timezone` is not
            an IANA name this server knows.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: 'Nothing was changed: this route is owner-only. `owner` is
            the ONLY role there is and it governs membership alone - an owner and
            a member see exactly the same data (ADR 0045).'
  /api/households/me/invites:
    get:
      operationId: api_households_me_invites_list
      description: |-
        `GET`/`POST /api/households/me/invites`. Owner-only, both.

        **The code comes back in full exactly once, from POST.** GET lists it
        again for LIVE invites only, which is a deliberate and narrow
        re-exposure: an owner who minted a code and lost the message has to be
        able to read it back, and a live code is one that is going to be typed
        into a signup form anyway. A spent, expired or revoked code is not listed
        at all, so its value never appears again.
      tags:
      - households
      security:
      - deviceToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invite'
          description: Live invites minted by this household, newest first, code included.
            Revoked, expired and fully-used invites are not listed.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: 'Nothing was changed: this route is owner-only. `owner` is
            the ONLY role there is and it governs membership alone - an owner and
            a member see exactly the same data (ADR 0045).'
    post:
      operationId: api_households_me_invites_create
      description: |-
        `GET`/`POST /api/households/me/invites`. Owner-only, both.

        **The code comes back in full exactly once, from POST.** GET lists it
        again for LIVE invites only, which is a deliberate and narrow
        re-exposure: an owner who minted a code and lost the message has to be
        able to read it back, and a live code is one that is going to be typed
        into a signup form anyway. A spent, expired or revoked code is not listed
        at all, so its value never appears again.
