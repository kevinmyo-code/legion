  /api/fleet/obd_samples/:
    get:
      operationId: api_fleet_obd_samples_list
      description: |-
        `GET /api/fleet/obd_samples/?vehicle=<uuid>&since=<iso>` - the windowed,
        per-vehicle pull `FleetBackend.fetchObdSamplesSince` calls.

        No `?active=1`: this table has no `deleted_at`, so every row that exists is
        live and the unnarrowed feed already IS the active set. The parameter is
        absent from the schema rather than advertised and ignored, which is the
        same choice `api/synced.SyncedModelViewSet.has_tombstones` makes for the
        gated tables.

        Paged with the same 500-row `next` cursor every other feed uses, keyed on
        `recorded_at`. The known limit `api/synced.py` states for its own cursor
        applies here too and is MORE reachable: the cursor is an inclusive
        timestamp and cannot express "after this row", so a full page of samples
        sharing one `recorded_at` would re-serve itself forever. It needs 500
        samples at one instant for one car and one PID set; the natural key makes
        exact duplicates impossible, so the 500 would have to be 500 distinct PIDs
        read in the same millisecond.
      parameters:
      - in: query
        name: after_id
        schema:
          type: string
          format: uuid
        description: 'Only with `received_after`: the row id of the last sample already
          received at that exact `created_at`. A batch insert gives every row the
          same `created_at`, so the id is what lets a page boundary fall inside one
          batch without dropping or repeating rows. Taken from the previous page''s
          `next_after`; an id is never published on a row. Not a uuid is a 400.'
      - in: query
        name: received_after
        schema:
          type: string
          format: date-time
        description: 'ISO-8601 UTC ARRIVAL watermark, matched against `created_at`
          - when this server STORED the sample, not when it was read from the car.
          Switches the feed to arrival order, keyed on `(created_at, id)`: a head
          unit that uploads a drive hours late is still returned, because its rows
          arrive after the watermark whatever their `recorded_at`. Without `after_id`
          the match is inclusive (`>=`); with it, strictly after that position. `since`
          is ignored in this mode. The response''s `next` and `next_after` are the
          keyset to hand back as `received_after` and `after_id`.'
      - in: query
        name: since
        schema:
          type: string
          format: date-time
        description: ISO-8601 UTC watermark, matched against `recorded_at` - the instant
          the sample was READ FROM THE CAR, not the instant it reached this server.
          That is the column `FleetBackend.fetchObdSamplesSince` filters on, and the
          only one that means anything to a client rebuilding a window of telemetry.
          Omitted means this vehicle's whole history, paged; the phone's first-run
          backfill passes the last 365 days (Kevin's 2026-10-17 ruling, which superseded
          the 2026-09-03 ~30-day bound), and that window is the CLIENT's choice, never
          a narrowing this server applies on its behalf. Ignored when `received_after`
          is sent.
      - in: query
        name: vehicle
        schema:
          type: string
          format: uuid
        description: 'REQUIRED. The `vehicles.id` whose samples to return. This is
          the one list route in the API with a mandatory filter: `obd_samples` held
          20,796 rows on 2026-09-07 and an unbounded feed over it is a download, not
          a feed. Absent is a 400 naming this parameter; a uuid naming no vehicle
          is a 404, never an empty page - an empty page would read as ''this car has
          no telemetry'' when the truth is ''there is no such car''.'
        required: true
      tags:
      - fleet
      security:
      - deviceToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedObdSample'
          description: One page of one vehicle's samples, oldest first. No tombstones,
            because this table has no tombstone column - telemetry is append-only
            and is corrected by a newer observation, never by editing an old one.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: '`vehicle` was missing or was not a uuid. Nothing was returned.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: '`vehicle` named no vehicle this server knows.'
  /api/fleet/obd_samples/batch/:
    post:
      operationId: api_fleet_obd_samples_batch_create
      description: |-
        `POST /api/fleet/obd_samples/batch/` - `FleetBackend.uploadObdSampleBatch`.

        The body is a JSON ARRAY of samples, matching ticket 04's own exceptions
        table (`POST /api/fleet/obd_samples/batch/ [..]`) and what
        `SupabaseFleetBackend` already sends.

        **Idempotent on the natural key, by construction rather than by checking.**
        `obd_samples_natural_key_idx` is unique on `(vehicle_id, pid, recorded_at)`
        and the insert names it as the `on conflict` target, so a re-post of a
        batch that already landed writes nothing and answers 200 with
        `inserted: 0`. That is not a nicety: `ObdSampleReconcile` resumes an
        interrupted upload from a cursor it may have failed to advance, so re-posts
        are the normal case and not the exceptional one. A sample IS its car, its
        PID and its instant - the key is content-derived, so a re-post is genuinely
        the same sample and not merely one that looks like it.

        **Nothing is corrected here and nothing can be.** There is no PUT, no
        PATCH and no DELETE anywhere on this table. A telemetry observation is
        superseded by a newer observation, never by editing an old one, which is
        why `obd_samples` carries no `forbid_mutation_of_facts` trigger either -
        the immutability trigger exists for gated aspects where a row asserts a
        VERIFIED fact, and this row asserts an observation.
      tags:
      - fleet
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ObdSampleUpload'
          application/x-www-form-urlencoded:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ObdSampleUpload'
          multipart/form-data:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ObdSampleUpload'
        required: true
      security:
      - deviceToken: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObdBatchResult'
          description: At least one sample was written.
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObdBatchResult'
          description: 'Nothing was written, and that is a normal answer: every sample
            in the batch was already stored under the same natural key, or the batch
            was empty. Not an error, and not something to retry differently.'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Nothing was written. The body was not a JSON array, a sample
            was malformed, the batch was over the size cap, or a `vehicle_id` named
            no vehicle. Field-level errors come back keyed by index.
  /api/fleet/obd_samples/count/:
    get:
      operationId: api_fleet_obd_samples_count
      description: |-
        `GET /api/fleet/obd_samples/count/` - `FleetBackend.countObdSamples`.

        A number and nothing else. `ObdSampleReconcile`'s own class doc explains at
        length why a full-row fetch here "would defeat the entire batching effort
        for a report line"; against PostgREST that was a `HEAD` with
        `Prefer: count=exact`, and here it is a `COUNT(*)`, which is the same
        bargain - one integer, no rows.

        `?vehicle=` is OPTIONAL here, unlike on the feed, and the asymmetry is not
        an inconsistency: a count of the whole table is one aggregate whatever its
        size, so the reason the feed refuses an unbounded request simply does not
        apply.
      parameters:
      - in: query
        name: vehicle
        schema:
          type: string
          format: uuid
        description: Optional. Narrows the count to one vehicle. Omitted counts the
          whole table, which is what `FleetBackend.countObdSamples` asks for.
      tags:
      - fleet
      security:
      - deviceToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObdSampleCount'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: '`vehicle` was not a uuid.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: '`vehicle` named no vehicle this server knows.'
