          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - created_at
      - deleted_at
      - from_at
      - id
      - new_vehicle_id
      - provenance
      - sync_id
      - to_at
      - updated_at
      - vehicle_id
