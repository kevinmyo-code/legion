    delete:
      operationId: api_checklists_items_tick_destroy
      description: |-
        `DELETE /api/checklists/<checklist_id>/items/<item_id>/tick/<day>` -
        soft-deletes the tick for that day, matching `ChecklistController.untick`.
        Idempotent: no tick on that day is still a 204, not a 404 - "already
        untouched" and "just unticked" read the same to a caller that does not
        care which happened.
      parameters:
      - in: path
        name: checklist_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: day
        schema:
          type: integer
        required: true
      - in: path
        name: item_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: today
        schema:
          type: integer
        description: 'The caller''s own local epoch day. On the Groceries list a tick
          is a purchase (ADR 0055): an untick on the tick''s own day removes the bought
          entry the tick made, an untick on a later day leaves it. Which day is ''today'':
          the household''s timezone when its owner has set one (this parameter is
          then ignored), else this parameter, else today''s UTC date, which west of
          UTC can keep an entry a late-evening untick meant to remove. Send it anyway:
          it is the fallback for a household with no timezone.'
      tags:
      - checklists
      security:
      - deviceToken: []
      - cookieAuth: []
      responses:
        '204':
          description: 'Done. Idempotent: no tick on that day is still a 204, not
            a 404 - ''already untouched'' and ''just unticked'' read the same to a
            caller that does not care which happened.'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: 'Nothing was unticked: `today` is not a whole number of days.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: No such row. Nothing was changed.
