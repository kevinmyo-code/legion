          type: number
          format: double
        gallons:
          type: number
          format: double
          nullable: true
          description: Null, never 0.0, when the mass-airflow sensor was silent for
            the whole drive. Unknown fuel and no fuel are different facts and must
            not collapse - an MPG figure computed over a null here is not a low MPG,
            it is no MPG.
        end_reason:
          type: string
          description: '''ENGINE_OFF'' or ''LINK_LOST'' today. Deliberately unconstrained
            text on the live schema, so widening it needs no migration and this API
            refuses no value.'
        provenance:
          allOf:
          - $ref: '#/components/schemas/ProvenanceEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
