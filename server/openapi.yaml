    MaintenanceSchedule:
      type: object
      description: |-
        Field-for-field `RemoteMaintenanceSchedule` / `MaintenanceScheduleUpload`.

        Deliberately carries NO `last_done_mileage` or `last_done_date`, matching
        the engine's own decision: when a service was last done is a fact about
        SERVICE HISTORY, and duplicating it here is how the two drift into
        disagreeing. "Is this due" is computed by reading the latest matching
        `service_history` row against these intervals.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        vehicle_id:
          type: string
          format: uuid
        service_name:
          type: string
        interval_miles:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        interval_months:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        interval_source:
          type: string
          description: Free text rather than a constrained set - the engine left this
            open, and values like 'SEEDED' and a manual entry both occur.
        never_done:
          type: boolean
          default: false
        provenance:
          allOf:
          - $ref: '#/components/schemas/ProvenanceEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - created_at
      - deleted_at
      - id
      - interval_source
      - provenance
      - service_name
      - updated_at
      - vehicle_id
    Match:
