      type: object
      description: |-
        The 200 body. `db` is the only key, and it is only ever `"ok"` -
        anything else took the 503 branch below.
      properties:
        db:
          type: string
          description: Always "ok" on a 200.
      required:
      - db
    HealthError:
      type: object
      description: |-
        The 503 body. `detail` is psycopg's own message, verbatim - the
        check says what it actually found rather than a generic failure.
      properties:
        db:
          type: string
          description: Always "error" on a 503.
        detail:
          type: string
      required:
      - db
      - detail
    IngestOutcome:
      type: object
      description: |-
        The 200 body, and it covers BOTH no-write outcomes because they are one
        status code and a client branches on `outcome`, not on the shape.

        `ALREADY_COMMITTED` carries `content_sha256` and `note`; `QUARANTINED`
        carries `reason`. `inserted` is 0 in both - nothing was written either way.
        A quarantine is a VERDICT, not a transport failure (see this module's own
        doc comment for why it is not a 4xx), so it must never be surfaced as
        "something went wrong" or retried blindly.
      properties:
        outcome:
          type: string
          description: '`ALREADY_COMMITTED` or `QUARANTINED`.'
        inserted:
          type: integer
          description: Always 0 here. Nothing was written.
        content_sha256:
          type: string
          description: '`ALREADY_COMMITTED` only.'
        note:
          type: string
          description: '`ALREADY_COMMITTED` only.'
        reason:
          type: string
          description: '`QUARANTINED` only: what the gate found, in words. Stored
            on `ingested_files.quarantine_reason` too, so the file is not re-offered
            with no memory of why it failed.'
      required:
      - inserted
      - outcome
    IngestStateEnum:
      enum:
      - NEW
      - INGESTED
      - QUARANTINED
      - UNREADABLE
      - DUPLICATE_CONTENT
      - NEEDS_LLM
      type: string
      description: |-
        * `NEW` - New
        * `INGESTED` - Ingested
        * `QUARANTINED` - Quarantined
        * `UNREADABLE` - Unreadable
        * `DUPLICATE_CONTENT` - Duplicate Content
        * `NEEDS_LLM` - Needs Llm
    IngestedFile:
      type: object
      description: |-
        One `public.ingested_files` row.

        `content_sha256` is the idempotency key the whole ingest path turns on: a
        second post of the same bytes is a no-op, which is what makes a lost
        acknowledgement retryable rather than ambiguous
        (`ingest.views._already_committed`'s own doc comment). `quarantine_reason`
        is the sentence the gate wrote when it refused, in the same words the
        caller was given at the time.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        content_sha256:
          type: string
          readOnly: true
        source_file_id:
          type: string
          readOnly: true
          nullable: true
        display_name:
          type: string
          readOnly: true
          nullable: true
        size_bytes:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          readOnly: true
          nullable: true
        state:
          allOf:
          - $ref: '#/components/schemas/IngestStateEnum'
          readOnly: true
          description: |-
            Where this document got to. INGESTED means the section 4 gate ran and committed it; QUARANTINED means the gate ran and REFUSED it, and `quarantine_reason` says why in words; UNREADABLE, DUPLICATE_CONTENT and NEEDS_LLM are the three ways it never reached the gate at all. A QUARANTINED file wrote no rows anywhere - that is the point of it.

            * `NEW` - New
            * `INGESTED` - Ingested
            * `QUARANTINED` - Quarantined
            * `UNREADABLE` - Unreadable
            * `DUPLICATE_CONTENT` - Duplicate Content
            * `NEEDS_LLM` - Needs Llm
        quarantine_reason:
          type: string
          readOnly: true
          nullable: true
          description: 'The gate''s own sentence, or null. Written to be shown to
            a person: it says which figures did not agree, not merely that something
            failed.'
        first_seen_at:
          type: string
          format: date-time
          readOnly: true
          description: The first time this content was posted. FIXED after the first
            insert - not a change watermark. Page this feed with `since` against `last_attempt_at`,
            which is what the `next` cursor carries.
        last_attempt_at:
          type: string
          format: date-time
          readOnly: true
          description: The last time this content was posted, rewritten on every commit
            and every retry. The column this feed's `?since=` and `next` are keyed
            on.
      required:
      - content_sha256
      - display_name
      - first_seen_at
      - id
      - last_attempt_at
      - quarantine_reason
      - size_bytes
      - source_file_id
      - state
    LedgerTransaction:
      type: object
      description: |-
        One `public.ledger_transactions` row.

        `provenance` is the load-bearing field on the wire, not decoration.
        `UNRECONCILED` means section 4 rule 7: the source stated no anchor, the
        row is provisional, it is transient, and **every surface that renders one
        must say so in words** - which for this API means a client cannot render
        this row without reading this field. `statement_id` is null on exactly
        those rows and non-null on every other, by
        `ledger_txn_header_matches_provenance`, so the two always agree.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        statement_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        account_last4:
          type: string
          readOnly: true
        account_nickname:
          type: string
          readOnly: true
        currency:
          type: string
          readOnly: true
        txn_date:
          type: string
          format: date
          readOnly: true
        description:
          type: string
          readOnly: true
        amount_cents:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          readOnly: true
        balance_cents:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          readOnly: true
          nullable: true
        line_ref:
          type: string
          readOnly: true
        category:
          type: string
          readOnly: true
          nullable: true
        category_pending:
          type: boolean
          readOnly: true
        pending_logged_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        reversal_of:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: The id of the row this one reverses, or null. A gated row is
            never edited; it is corrected by posting a reversal and a replacement.
        provenance:
          allOf:
          - $ref: '#/components/schemas/ProvenanceEnum'
          readOnly: true
          description: |-
            DETERMINISTIC / LLM_RECONCILED / UNRECONCILED / USER. **UNRECONCILED is provisional** (CLAUDE.md section 4 rule 7): the source stated no anchor, the figure is unverified, and any surface showing it - or any total containing it - must say so in words, never by colour or a glyph alone.

            * `DETERMINISTIC` - Deterministic
            * `LLM_RECONCILED` - Llm Reconciled
            * `UNRECONCILED` - Unreconciled
            * `USER` - User
        created_at:
          type: string
          format: date-time
          readOnly: true
        origin_guid:
          type: string
          readOnly: true
          nullable: true
      required:
      - account_last4
      - account_nickname
      - amount_cents
      - balance_cents
      - category
      - category_pending
      - created_at
      - currency
      - description
      - id
      - line_ref
      - origin_guid
      - pending_logged_at
      - provenance
      - reversal_of
      - statement_id
      - txn_date
