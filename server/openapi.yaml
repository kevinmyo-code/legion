components:
  schemas:
    BodyweightLog:
      type: object
      description: |-
        Base for every serializer this viewset drives.

        Two behaviours, both ticket 04's own text:

        1. **Unknown fields are refused, never dropped.** "A limb sending a
           column the server does not know is a version skew, and it says so
           with a 400 naming the field, never a silent drop." A phone one
           release ahead, writing a column this server has never heard of,
           must be told - a silent drop would look exactly like a successful
           write and lose the value.
        2. **The server facts are the server's.** `id`, `provenance`,
           `created_at`, `updated_at` and `deleted_at` are read-only on every
           subclass; `deleted_at` moves only via DELETE, `updated_at` only via
           the `touch_updated_at` trigger.

        Subclasses set `Meta.model` / `Meta.fields` and, where the table's
        `provenance` column is not the shared `USER` default,
        `default_provenance`.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        weight_value:
          type: number
          format: double
        weight_unit:
          type: string
        logged_at:
          type: string
          format: date-time
        trust_tier:
          type: string
        provenance:
          allOf:
          - $ref: '#/components/schemas/ProvenanceEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        origin_guid:
          type: string
      required:
      - created_at
      - deleted_at
      - id
      - logged_at
      - origin_guid
      - provenance
      - trust_tier
      - updated_at
      - weight_unit
      - weight_value
    BudgetTarget:
      type: object
      description: |-
        Field-for-field `RemoteBudgetTarget` / `BudgetTargetFields`.

        `amount_cents` is an integer. `effective_from_month` is a bare `date`, not
        a timestamp, matching `meal_targets.effective_from_date`'s precedent - the
        phone's `effectiveFromMonthEpoch` is always a UTC month-start instant by
        convention, so a date round-trips it with no timezone ambiguity.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        category:
          type: string
        currency:
          type: string
        amount_cents:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        effective_from_month:
          type: string
          format: date
        provenance:
          allOf:
          - $ref: '#/components/schemas/ProvenanceEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        origin_guid:
          type: string
      required:
      - amount_cents
      - category
      - created_at
      - currency
      - deleted_at
      - effective_from_month
      - id
      - origin_guid
      - provenance
      - updated_at
    BuildEntry:
      type: object
      description: |-
        Field-for-field `RemoteBuildEntry` / `BuildEntryUpload`: one
        driver-authored logbook line (a mod, part, repair, consumable, or general
        spend entry).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        sync_id:
          type: string
        vehicle_id:
          type: string
          format: uuid
        entry_type:
          type: string
          description: '''mod'', ''part'', ''repair'', ''consumable'' or ''other''
            on the phone, and unconstrained text on the live schema - the list is
            open-ended, so this API refuses no value.'
        title:
          type: string
        vendor:
          type: string
          default: ''
        part_number:
          type: string
          default: ''
        cost_cents:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
          description: In cents (CLAUDE.md section 4 rule 3). Null means the driver
            logged what was done with no dollar figure; never 0, which would assert
            it was free.
        logged_at:
          type: string
          format: date-time
        mileage:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        notes:
          type: string
          default: ''
        provenance:
          allOf:
          - $ref: '#/components/schemas/ProvenanceEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - created_at
      - deleted_at
      - entry_type
      - id
      - logged_at
      - provenance
      - sync_id
      - title
      - updated_at
      - vehicle_id
    Category:
      type: object
      description: Field-for-field `RemoteCategory` / `CategoryFields`.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        is_food_category:
          type: boolean
        provenance:
          allOf:
          - $ref: '#/components/schemas/ProvenanceEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        origin_guid:
          type: string
      required:
      - created_at
      - deleted_at
      - id
      - is_food_category
      - name
      - origin_guid
      - provenance
      - updated_at
    CategoryRule:
      type: object
      description: |-
        Field-for-field `RemoteCategoryRule` / `CategoryRuleFields`.

        `created_at_client` is writable and `created_at` is not, and the pair is
        deliberate rather than an oversight - the migration's own header explains
        it: `created_at` is Postgres's insert stamp, `created_at_client` is the
        instant the rule was written on the phone, and `LedgerController.applyCategoryRules`
        orders rules by the second one, oldest first, because the earliest rule
        written for a merchant is the one that governs it. Letting the server's
        clock stand in for the phone's would silently reorder every rule around
        whenever it happened to reach the server.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        category:
          type: string
        substring:
          type: string
        created_at_client:
          type: string
          format: date-time
        provenance:
          allOf:
          - $ref: '#/components/schemas/ProvenanceEnum'
          readOnly: true
        created_at:
          type: string
