          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Changes'
          description: 'One key per TABLE, named for the table, each holding every
            row changed at or after `since` with tombstones included, oldest first.
            **Not paged**: a large first pull should use the per-table `?since=` routes,
            which are.'
