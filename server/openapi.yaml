      description: |-
        Field-for-field `RemoteGroceryStaple` / `GroceryStapleFields`
        (`LastAspectsBackend.kt`).

        `grocery_staples` carries no CHECK constraints at all - CONSTRAINTS.md's
        own no-constraints list names it - only `grocery_staples_name_unique` and
        the `origin_guid` unique. The two refusals below are therefore this API's
        own, and each has a reason beyond tidiness: a blank `name` would take the
        unique name slot the real staple wants, and a `times_bought` below 1 would
        contradict the column's own `default 1`, which exists because a staple
        only becomes one by being bought at least once.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        display_name:
          type: string
        times_bought:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          default: 1
        last_bought_at:
          type: string
          format: date-time
        provenance:
          allOf:
          - $ref: '#/components/schemas/ProvenanceEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        origin_guid:
          type: string
      required:
      - created_at
      - deleted_at
      - display_name
      - id
      - last_bought_at
      - name
      - origin_guid
      - provenance
      - updated_at
