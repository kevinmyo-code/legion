      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: The database answered `SELECT 1`.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthError'
          description: The database did not answer. The body carries psycopg's own
            message.
components:
  schemas:
    Accept:
      type: object
      properties:
        accepted:
          type: boolean
        meal_target:
          $ref: '#/components/schemas/MealTarget'
        words:
          type: string
      required:
      - accepted
      - meal_target
      - words
    ActivityLevelEnum:
      enum:
      - sedentary
      - light
      - moderate
      - very
      type: string
      description: |-
        * `sedentary` - sedentary
        * `light` - light
        * `moderate` - moderate
        * `very` - very
    AppEnum:
      enum:
      - phone
      - headunit
      type: string
      description: |-
        * `phone` - phone
        * `headunit` - headunit
    AppRelease:
      type: object
      description: What a client sees. Never `object_name` (where it sits in the bucket)
        or who published.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        app:
          allOf:
          - $ref: '#/components/schemas/AppEnum'
          readOnly: true
        version_code:
          type: integer
          readOnly: true
        version_name:
          type: string
          readOnly: true
        sha256:
          type: string
          readOnly: true
        size_bytes:
          type: integer
          readOnly: true
        notes:
          type: string
          readOnly: true
        signer_sha256:
          type: string
          readOnly: true
        published_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - app
      - id
      - notes
      - published_at
      - sha256
      - signer_sha256
      - size_bytes
      - version_code
      - version_name
    AppReleaseDownload:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: A V4 signed GET URL for the APK.
        expires_at:
          type: string
          format: date-time
        sha256:
          type: string
          description: Verify the download against this.
        size_bytes:
          type: integer
        version_code:
          type: integer
      required:
      - expires_at
      - sha256
      - size_bytes
      - url
      - version_code
    AssistantCompanion:
      type: object
      properties:
        name:
          type: string
          description: What the companion is called.
        persona:
          type: string
          description: The built-in register it wears.
        voice_name:
          type: string
          description: The Gemini voice it speaks in.
        custom_register:
          type: boolean
          description: True when the household wrote its own register for it.
        stored:
          type: boolean
          description: False when no companion has been set for this member and this
            is the default the engine assigns.
      required:
      - custom_register
      - name
      - persona
      - stored
      - voice_name
    AssistantConversationStored:
      type: object
      properties:
        stored_lines:
          type: integer
        detail:
          type: string
      required:
      - detail
      - stored_lines
    AssistantPack:
      type: object
      properties:
        version:
          type: integer
          description: Bumped on every change to the wording.
        sha256:
          type: string
          description: Hash of this payload (version included); also the ETag.
        clauses:
          type: object
          additionalProperties:
            type: string
          description: Prompt clauses by the names in shared_clauses.txt, plus pack-only
            ones. Never the locked set (CRISIS, SAFETY_INSTRUCTIONS, CANNOT_CLAUSE,
            ASK_BEFORE, NO_PASSWORDS); the app ignores those if sent.
        tool_text:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AssistantPackToolText'
          description: Tool name to wording overrides.
        flags:
          type: object
          additionalProperties: {}
          description: Name to true/false or a whole number.
        extra_rules:
          type: array
          items:
            type: string
          description: Short rules appended to the prompt.
      required:
      - clauses
      - extra_rules
      - flags
      - sha256
      - tool_text
      - version
    AssistantPackToolText:
      type: object
      properties:
        description:
          type: string
        result_prefix:
          type: string
    AssistantSession:
      type: object
      properties:
        token:
          type: string
          description: The ephemeral token's full name (`auth_tokens/...`). Pass it
            as the `access_token` query parameter on `ws_url`. One conversation; the
            setup it carries is locked, so the browser's own `setup` message is ignored.
        model:
          type: string
        ws_url:
          type: string
          description: Append `?access_token=<token, URL-encoded>` and open a WebSocket.
        expires_at:
          type: string
          format: date-time
          description: 'The conversation cannot outlive this: about 30 minutes for
            a member, `LEGION_DEMO_MAX_SESSION_MINUTES` (5) for a recruiter''s demo
            visit.'
        connect_by:
          type: string
          format: date-time
          description: The WebSocket must be opened before this (about 60 seconds).
        companion_name:
          type: string
        voice_name:
          type: string
        input_audio_mime:
          type: string
          description: 'What `realtimeInput.audio.mimeType` must say: 16-bit PCM,
            16 kHz, mono.'
        output_audio_rate:
          type: integer
          description: Sample rate of the 16-bit PCM Gemini sends back.
        conversation_id:
          type: string
          format: uuid
          description: This conversation's record on the engine. Send it with every
            tool call and with `POST /api/assistant/conversation`. Conversations may
            be recorded to improve the assistant; no audio is kept.
      required:
      - companion_name
      - connect_by
      - conversation_id
      - expires_at
      - input_audio_mime
      - model
      - output_audio_rate
      - token
      - voice_name
      - ws_url
    AssistantSessionRequest:
      type: object
      properties:
        utc_offset_minutes:
          type: integer
          maximum: 840
          minimum: -720
          nullable: true
          description: 'Minutes EAST of UTC on the person''s own clock: `-new Date().getTimezoneOffset()`
            in a browser (Houston in summer is -300). Omit it and the engine uses
            the household''s timezone, as a current offset, when its owner has set
            one; otherwise the assistant is told the offset is unknown. Never an IANA
            zone id: the zone''s name never reaches the prompt.'
        client_now_ms:
          type: integer
          nullable: true
          description: The browser's clock, epoch milliseconds (`Date.now()`), so
            the conversation record can put the browser's lines on the engine's clock.
            Omit it and they are kept as sent.
    AssistantToolForward:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
      - message
      - success
    AssistantToolRefusal:
      type: object
      properties:
        response:
          $ref: '#/components/schemas/AssistantToolForward'
        detail:
          type: string
      required:
      - detail
      - response
    AssistantToolRequest:
      type: object
      properties:
        name:
          type: string
          description: '`functionCalls[].name`, as Gemini sent it.'
        args:
          type: object
          additionalProperties: {}
          description: '`functionCalls[].args`, as Gemini sent it. Omitted means `{}`.'
        conversation_id:
          type: string
          format: uuid
          nullable: true
          description: The mint's `conversation_id`. The engine writes this call,
            its arguments and its result into that conversation's record. One that
            is not the caller's is ignored.
        call_id:
          type: string
          default: ''
          description: '`functionCalls[].id`, as Gemini sent it, for the record.'
          maxLength: 200
      required:
      - name
    AssistantToolResult:
      type: object
      properties:
        response:
          $ref: '#/components/schemas/AssistantToolForward'
        name:
          type: string
        is_error:
          type: boolean
          description: True when the tool was refused or failed. `text` says what
            did not happen.
        outcome:
          $ref: '#/components/schemas/OutcomeEnum'
        text:
          type: string
          description: The result in words, for the model.
        card:
          nullable: true
          description: 'What the screen draws beside the transcript, built by the
            engine from the tool''s own rows (`engine_mcp/cards.py`): `card` is bars,
            timeline, car, steps, checklist or diagram. Absent when the tool has none.
            Never sent to Gemini: `response` is the whole of what the browser forwards.'
      required:
      - is_error
      - name
      - outcome
      - response
      - text
    AverageSpend:
      type: object
      properties:
        months:
          type: array
          items:
            type: string
        usd_cents:
          type: integer
        sgd_cents:
          type: integer
      required:
      - months
      - sgd_cents
      - usd_cents
    Band:
      type: object
      properties:
        low_pct:
          type: number
          format: double
        high_pct:
          type: number
          format: double
      required:
      - high_pct
      - low_pct
    BankAccount:
      type: object
      properties:
        name:
          type: string
          nullable: true
        mask:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
        subtype:
          type: string
          nullable: true
        balance_current_cents:
          type: integer
          nullable: true
          description: 'The bank''s balance in cents at `balance_as_of`. For a credit
            account, the amount owed (positive). Null: the bank has not stated one.'
        balance_available_cents:
          type: integer
          nullable: true
          description: 'What may be spent (for credit, the credit left), in cents.
            Null: not stated.'
        balance_currency:
          type: string
          nullable: true
        balance_as_of:
          type: string
          format: date-time
          nullable: true
          description: When the bank stated the balance. Show it beside the figure;
            it is not 'now'.
      required:
      - balance_as_of
      - balance_available_cents
      - balance_currency
      - balance_current_cents
      - mask
      - name
      - subtype
      - type
    BankStatus:
      type: object
      properties:
        configured:
          type: boolean
