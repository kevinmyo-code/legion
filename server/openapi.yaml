    ReceiptLineItem:
      type: object
      description: |-
        One `public.receipt_line_items` row: what the receipt printed, plus four
        macro estimates it did not. See this module's doc comment on rule 5, and on
        why `quantity` and the estimates render as strings rather than numbers.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        receipt_id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
          readOnly: true
        unit_price_cents:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          readOnly: true
          nullable: true
        total_price_cents:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          readOnly: true
