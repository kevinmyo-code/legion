    Statement:
      type: object
      description: |-
        One `public.statements` row: a bank statement's header and, crucially,
        the three anchors the gate checked it against (section 4 rule 8).

        `ingested_file_id` rather than DRF's default `ingested_file` because that
        is the column's real name, and the name every existing client already
        reads - these rows reached the phone through PostgREST, which renders the
        physical column. Renaming it here would have been a gratuitous break for
        a tidier-looking field.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        ingested_file_id:
          type: string
          format: uuid
          readOnly: true
        account_last4:
          type: string
          readOnly: true
        account_nickname:
          type: string
          readOnly: true
        currency:
          type: string
          readOnly: true
        period_start:
          type: string
          format: date
          readOnly: true
        period_end:
          type: string
          format: date
          readOnly: true
        stated_total_cents:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          readOnly: true
          nullable: true
          description: The total the statement itself printed, in cents. NULL means
            the document printed none, which `statements_total_only_null_if_deterministic`
            permits only for a deterministically parsed statement. Never synthesised
            from the sum of the lines - that would make the check an identity (CLAUDE.md
            section 4 rule 6).
        opening_balance_cents:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          readOnly: true
          description: An anchor the gate checked against, in cents (section 4 rule
            8).
        closing_balance_cents:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          readOnly: true
          description: An anchor the gate checked against, in cents (section 4 rule
            8).
        provenance:
          allOf:
          - $ref: '#/components/schemas/ProvenanceEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - account_last4
      - account_nickname
      - closing_balance_cents
      - created_at
      - currency
      - id
      - ingested_file_id
      - opening_balance_cents
      - period_end
      - period_start
      - provenance
      - stated_total_cents
    StatementAnchors:
      type: object
      description: |-
        CLAUDE.md section 4 rule 8, echoed. The AUTHORITY is the stored row on
        `public.statements`; this copy is so a caller just told COMMITTED can see the
        three figures that earned it without a second round trip.
      properties:
        stated_total_cents:
          type: integer
          nullable: true
          description: Null means the bank printed none. **Never derived from sum(lines)**
            - that would make the check an identity.
        opening_balance_cents:
          type: integer
        closing_balance_cents:
          type: integer
        note:
          type: string
      required:
      - closing_balance_cents
      - note
      - opening_balance_cents
      - stated_total_cents
    StatementCommitted:
      type: object
      description: 'The 201 body: rows were written.'
      properties:
        outcome:
          type: string
          description: Always `COMMITTED` on a 201.
        statement_id:
          type: string
          format: uuid
        inserted:
          type: integer
          description: Ledger transactions written.
        duplicates_skipped:
          type: integer
        restatements_skipped:
          type: integer
        provisional_superseded:
          type: integer
          description: Rule 7 provisional rows deleted because this verified file
            covers the same card and window.
        anchors:
          $ref: '#/components/schemas/StatementAnchors'
      required:
      - anchors
      - duplicates_skipped
      - inserted
      - outcome
      - provisional_superseded
      - restatements_skipped
      - statement_id
    TickRequest:
      type: object
      description: |-
        `POST /api/checklists/<id>/items/<item>/tick` body - `{day, value?,
        source?}`. Deliberately a plain `Serializer`, not a `ModelSerializer`
        over `ChecklistTick`: the measured-item refusal (`validate`) needs the
        ITEM's own `measure_unit`, which is not a field on this request body at
        all (the item is named in the URL, not the payload) - so the check is
        written by hand rather than leaning on a field-level `validate_<name>`
        that has no access to a sibling object.
      properties:
        day:
          type: integer
        value:
          type: number
          format: double
          nullable: true
        source:
          type: string
          default: USER_REPORTED
      required:
      - day
    VoiceNote:
      type: object
      description: |-
        Field-for-field `RemoteVoiceNote`. See this module's doc comment for
        the audio column that is absent from both.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
        title:
          type: string
          nullable: true
        summary:
          type: string
          nullable: true
        transcript:
          type: string
          nullable: true
        kind:
          type: string
        provenance:
          allOf:
          - $ref: '#/components/schemas/VoiceNoteProvenanceEnum'
          readOnly: true
        interrupted:
          type: boolean
          default: false
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - created_at
      - deleted_at
      - id
      - kind
      - provenance
      - started_at
      - updated_at
    VoiceNoteProvenanceEnum:
      enum:
      - LLM_DERIVED
      type: string
      description: '* `LLM_DERIVED` - LLM_DERIVED'
    WorkoutPlan:
      type: object
      description: |-
        Base for every serializer this viewset drives.

        Two behaviours, both ticket 04's own text:

        1. **Unknown fields are refused, never dropped.** "A limb sending a
           column the server does not know is a version skew, and it says so
           with a 400 naming the field, never a silent drop." A phone one
           release ahead, writing a column this server has never heard of,
           must be told - a silent drop would look exactly like a successful
           write and lose the value.
        2. **The server facts are the server's.** `id`, `provenance`,
           `created_at`, `updated_at` and `deleted_at` are read-only on every
           subclass; `deleted_at` moves only via DELETE, `updated_at` only via
           the `touch_updated_at` trigger.

        Subclasses set `Meta.model` / `Meta.fields` and, where the table's
        `provenance` column is not the shared `USER` default,
        `default_provenance`.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        sessions_per_week:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        effective_from_week:
          type: string
          format: date
        provenance:
          allOf:
          - $ref: '#/components/schemas/ProvenanceEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        origin_guid:
          type: string
      required:
      - created_at
      - deleted_at
      - effective_from_week
      - id
      - origin_guid
      - provenance
      - sessions_per_week
      - updated_at
