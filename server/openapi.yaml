  /api/events:
    get:
      operationId: api_events_list
      description: '`GET /api/events?since=<iso>` and `POST /api/events`.'
      parameters:
      - in: query
        name: since
        schema:
          type: string
          format: date-time
        description: ISO-8601 UTC watermark. Returns rows with `updated_at >= since`,
          tombstones included, oldest first. **Omitted or unparsable means EVERYTHING,
          never nothing** (api/sync.parse_since), so a fresh client's first pull is
          the whole table. Hand back the `next` cursor from the previous page, or
          `server_time` from GET /api/changes; both are already `Z`-suffixed so they
          need no extra encoding.
      tags:
      - events
      security:
      - deviceToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedEvent'
          description: 'Rows changed at or after `since`, tombstones included, oldest
            first, 500 to a page. This route does NOT accept `?active=1` - the synced
            routes do; here a client filters `deleted_at` itself. **A row private
            to another member arrives only as a redacted tombstone**: `id`, `deleted_at`
            and `updated_at` (both the instant it last changed) and `redacted: true`,
            and no other field (ADR 0052). Drop it like any other tombstone.'
    post:
      operationId: api_events_create
      description: '`GET /api/events?since=<iso>` and `POST /api/events`.'
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Event'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Event'
        required: true
      security:
      - deviceToken: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: Created. The body is the row as stored, server-minted `id`,
            `provenance` and timestamps included.
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: '**Not created - this `origin_guid` already exists**, and the
            body is the row that was already there, unchanged. A retried create is
            a no-op, which is what makes a lost acknowledgement safe to retry. A client
            tells the two apart by the status code, never by the body.'
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: 'The write was refused and NOTHING was written. Two body shapes
            occur and both are JSON objects: `{"detail": "..."}` for an unknown field,
            a database refusal or a hand-written check, and `{"<field>": ["..."]}`
            for a field-level validation error. Both carry text meant to be shown
            to a person.'
  /api/events/{id}:
    patch:
      operationId: api_events_partial_update
      description: '`PATCH`/`DELETE /api/events/<id>`.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEvent'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEvent'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEvent'
      security:
      - deviceToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: The row as stored. Every field is optional on the way in; only
            the ones sent are changed. Sending `done` without `done_at` derives `done_at`
            from the database clock (or clears it when `done` is false).
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: 'The write was refused and NOTHING was written. Two body shapes
            occur and both are JSON objects: `{"detail": "..."}` for an unknown field,
            a database refusal or a hand-written check, and `{"<field>": ["..."]}`
            for a field-level validation error. Both carry text meant to be shown
            to a person.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: 'Nothing was changed: this member may not make the event private.
            `detail` is the sentence to show: "Only the person who added this can
            make it private."'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: No such row. Nothing was changed.
    delete:
      operationId: api_events_destroy
      description: '`PATCH`/`DELETE /api/events/<id>`.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - events
      security:
      - deviceToken: []
      - cookieAuth: []
      responses:
        '204':
          description: Done. Soft-deleted (the tombstone row stays so an unsynced
            client learns of it).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: No such row. Nothing was changed.
