        id:
          type: string
          format: uuid
          readOnly: true
        description:
          type: string
        calories_kcal:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          description: 'An estimate, not a measurement: the model''s guess from the
            meal description. Never gated and never treated as a reconciled figure
            (CLAUDE.md section 4 rule 5).'
        protein_g:
          type: number
          format: double
          nullable: true
          description: 'An estimate, not a measurement: the model''s guess from the
            meal description. Never gated and never treated as a reconciled figure
            (CLAUDE.md section 4 rule 5).'
        carbs_g:
          type: number
          format: double
          nullable: true
          description: 'An estimate, not a measurement: the model''s guess from the
            meal description. Never gated and never treated as a reconciled figure
            (CLAUDE.md section 4 rule 5).'
        fat_g:
          type: number
          format: double
          nullable: true
          description: 'An estimate, not a measurement: the model''s guess from the
            meal description. Never gated and never treated as a reconciled figure
            (CLAUDE.md section 4 rule 5).'
        logged_at:
          type: string
          format: date-time
        source_image_path:
          type: string
          nullable: true
        trust_tier:
          type: string
        provenance:
          allOf:
          - $ref: '#/components/schemas/ProvenanceEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        origin_guid:
          type: string
      required:
      - created_at
      - deleted_at
      - description
      - id
      - logged_at
      - origin_guid
      - provenance
      - trust_tier
      - updated_at
