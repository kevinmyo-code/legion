          need no extra encoding.
      tags:
      - changes
      security:
      - deviceToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Changes'
          description: 'One key per TABLE, named for the table, each holding every
            row changed at or after `since` with tombstones included, oldest first.
            **Not paged**: a large first pull should use the per-table `?since=` routes,
            which are. In `events`, `event_skips`, `suggestion_pins`, `checklists`,
            `checklist_items` and `checklist_ticks`, a row private to another member
            (or under a parent that is) arrives only as a redacted tombstone: `id`,
            `deleted_at`, `updated_at` and `redacted: true`, nothing else (ADR 0052).'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: An aspect name this server does not know. `detail` names it
            and lists the ones that exist.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: A recruiter's demo visit asked by name for an aspect it may
            not read (body, memory, ingest). Nothing was read.
