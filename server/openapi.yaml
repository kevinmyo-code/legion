              schema:
                $ref: '#/components/schemas/Detail'
          description: No such row. Nothing was changed.
  /api/events/{id}/skips/{skip_date}:
    delete:
      operationId: api_events_skips_destroy
      description: '`DELETE /api/events/<id>/skips/<YYYY-MM-DD>`.'
