        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: The invite lapses here if not accepted.
        start_at:
          type: string
          format: date-time
          nullable: true
        ends_at:
          type: string
          format: date-time
          nullable: true
        server_now:
