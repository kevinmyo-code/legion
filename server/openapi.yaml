components:
  schemas:
    BodyweightLog:
      type: object
      description: |-
        Base for every serializer this viewset drives.

        Two behaviours, both ticket 04's own text:

        1. **Unknown fields are refused, never dropped.** "A limb sending a
           column the server does not know is a version skew, and it says so
           with a 400 naming the field, never a silent drop." A phone one
           release ahead, writing a column this server has never heard of,
           must be told - a silent drop would look exactly like a successful
           write and lose the value.
        2. **The server facts are the server's.** `id`, `provenance`,
           `created_at`, `updated_at` and `deleted_at` are read-only on every
           subclass; `deleted_at` moves only via DELETE, `updated_at` only via
           the `touch_updated_at` trigger.

        Subclasses set `Meta.model` / `Meta.fields` and, where the table's
        `provenance` column is not the shared `USER` default,
        `default_provenance`.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        weight_value:
          type: number
          format: double
        weight_unit:
          type: string
        logged_at:
          type: string
          format: date-time
        trust_tier:
          type: string
        provenance:
          allOf:
          - $ref: '#/components/schemas/ProvenanceEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        origin_guid:
          type: string
      required:
      - created_at
      - deleted_at
      - id
      - logged_at
      - origin_guid
      - provenance
      - trust_tier
      - updated_at
      - weight_unit
      - weight_value
    BudgetTarget:
      type: object
      description: |-
        Field-for-field `RemoteBudgetTarget` / `BudgetTargetFields`.

        `amount_cents` is an integer. `effective_from_month` is a bare `date`, not
        a timestamp, matching `meal_targets.effective_from_date`'s precedent - the
        phone's `effectiveFromMonthEpoch` is always a UTC month-start instant by
        convention, so a date round-trips it with no timezone ambiguity.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        category:
          type: string
        currency:
          type: string
        amount_cents:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        effective_from_month:
          type: string
          format: date
        provenance:
          allOf:
          - $ref: '#/components/schemas/ProvenanceEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        origin_guid:
          type: string
      required:
      - amount_cents
      - category
      - created_at
      - currency
      - deleted_at
      - effective_from_month
      - id
      - origin_guid
      - provenance
      - updated_at
    Category:
      type: object
      description: Field-for-field `RemoteCategory` / `CategoryFields`.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        is_food_category:
          type: boolean
        provenance:
          allOf:
          - $ref: '#/components/schemas/ProvenanceEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        origin_guid:
          type: string
      required:
      - created_at
      - deleted_at
      - id
      - is_food_category
      - name
      - origin_guid
      - provenance
      - updated_at
    CategoryRule:
      type: object
      description: |-
        Field-for-field `RemoteCategoryRule` / `CategoryRuleFields`.

        `created_at_client` is writable and `created_at` is not, and the pair is
        deliberate rather than an oversight - the migration's own header explains
        it: `created_at` is Postgres's insert stamp, `created_at_client` is the
        instant the rule was written on the phone, and `LedgerController.applyCategoryRules`
        orders rules by the second one, oldest first, because the earliest rule
        written for a merchant is the one that governs it. Letting the server's
        clock stand in for the phone's would silently reorder every rule around
        whenever it happened to reach the server.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        category:
          type: string
        substring:
          type: string
        created_at_client:
          type: string
          format: date-time
        provenance:
          allOf:
          - $ref: '#/components/schemas/ProvenanceEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        origin_guid:
          type: string
      required:
      - category
      - created_at
      - created_at_client
      - deleted_at
      - id
      - origin_guid
      - provenance
      - substring
      - updated_at
    Changes:
      type: object
      properties:
        server_time:
          type: string
          format: date-time
          description: Postgres's own clock, read before any row query. Store THIS
            as the next `since`, rather than a max(updated_at) computed from the rows
            returned.
        events:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        checklists:
          type: array
          items:
            $ref: '#/components/schemas/Checklist'
        checklist_items:
          type: array
          items:
            $ref: '#/components/schemas/ChecklistItem'
        checklist_ticks:
          type: array
          items:
            $ref: '#/components/schemas/ChecklistTick'
        places:
          type: array
          items:
            $ref: '#/components/schemas/Place'
        voice_notes:
          type: array
          items:
            $ref: '#/components/schemas/VoiceNote'
        bodyweight_logs:
          type: array
          items:
            $ref: '#/components/schemas/BodyweightLog'
        meal_logs:
          type: array
          items:
            $ref: '#/components/schemas/MealLog'
        meal_targets:
          type: array
          items:
            $ref: '#/components/schemas/MealTarget'
        sleep_logs:
          type: array
          items:
            $ref: '#/components/schemas/SleepLog'
        sleep_targets:
          type: array
          items:
            $ref: '#/components/schemas/SleepTarget'
        workout_plans:
          type: array
          items:
            $ref: '#/components/schemas/WorkoutPlan'
        workout_plan_items:
          type: array
          items:
            $ref: '#/components/schemas/WorkoutPlanItem'
        workout_set_logs:
          type: array
          items:
            $ref: '#/components/schemas/WorkoutSetLog'
        memories:
          type: array
          items:
            $ref: '#/components/schemas/Memory'
        companion_memories:
          type: array
          items:
            $ref: '#/components/schemas/CompanionMemory'
        memory_audit:
          type: array
          items:
            $ref: '#/components/schemas/MemoryAudit'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        category_rules:
          type: array
          items:
            $ref: '#/components/schemas/CategoryRule'
        budget_targets:
          type: array
          items:
            $ref: '#/components/schemas/BudgetTarget'
        statements:
          type: array
          items:
            $ref: '#/components/schemas/Statement'
        ledger_transactions:
          type: array
          items:
            $ref: '#/components/schemas/LedgerTransaction'
        grocery_staples:
          type: array
          items:
            $ref: '#/components/schemas/GroceryStaple'
        receipts:
          type: array
          items:
            $ref: '#/components/schemas/Receipt'
        receipt_line_items:
          type: array
          items:
            $ref: '#/components/schemas/ReceiptLineItem'
        ingested_files:
          type: array
          items:
            $ref: '#/components/schemas/IngestedFile'
      required:
      - server_time
    Checklist:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        schedule_kind:
          type: string
          nullable: true
        schedule_every:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        schedule_days_of_week:
          type: string
          nullable: true
        sort_order:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        archived:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        sync_id:
          type: string
          nullable: true
          maxLength: 64
      required:
      - created_at
      - deleted_at
      - id
      - name
      - updated_at
    ChecklistItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        checklist:
          type: string
          format: uuid
        text:
          type: string
        sort_order:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        sync_id:
          type: string
          nullable: true
          maxLength: 64
        measure_unit:
          type: string
          nullable: true
          maxLength: 64
        measure_target:
          type: number
          format: double
          nullable: true
        measure_direction:
          type: string
          nullable: true
          maxLength: 16
      required:
      - checklist
      - created_at
      - deleted_at
      - id
      - text
      - updated_at
    ChecklistTick:
      type: object
      description: |-
        Read/representation shape only - a tick is never created or edited
        through this serializer directly; `ChecklistItemTickView` builds
        `ChecklistTick` rows itself so it can apply the revive-on-retick
        semantics `ChecklistController.tick`/`ChecklistTickDao.retick` describe,
        which a plain `ModelSerializer.create()` cannot express (it does not
        know to look for a soft-deleted row occupying the same `(item, day)`
        slot first).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        item:
          type: string
          format: uuid
        day:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        ticked_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        sync_id:
          type: string
          nullable: true
          maxLength: 64
        value:
          type: number
          format: double
          nullable: true
        source:
          type: string
      required:
      - day
      - deleted_at
      - id
      - item
      - ticked_at
      - updated_at
    CompanionMemory:
      type: object
      description: |-
        Field-for-field `RemoteCompanionMemory`. See this module's own doc
        comment for the embedding columns that exist on neither side.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        vehicle_id:
          type: string
        text:
          type: string
        category:
          type: string
        source:
          type: string
