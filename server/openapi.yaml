    OilAnalysis:
      type: object
      description: |-
        Field-for-field `RemoteOilAnalysis` / `OilAnalysisUpload`: a used-oil lab
        report, voice-entered or typed by the driver.

        USER provenance, not DETERMINISTIC, and the distinction is the point: a
        person transcribed these numbers, code did not derive them. Every figure
        here is as trustworthy as the typing.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        sync_id:
          type: string
        vehicle_id:
          type: string
          format: uuid
        analyzed_at:
          type: string
          format: date-time
        mileage:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        oil_brand:
          type: string
          default: ''
        oil_grade:
          type: string
          default: ''
        drain_interval_miles:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        iron:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          description: Parts per million. Null means the lab did not report iron,
            never 0 - a report that omits an element is not the same fact as one that
            measured zero of it. The same is true of every metal and contaminant here.
        copper:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
