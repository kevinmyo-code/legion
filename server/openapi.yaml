  /api/memory/companion_memories/:
    get:
      operationId: api_memory_companion_memories_list
      description: |-
        `?since=<iso>` (tombstones included), `?active=1` (live rows
        only) and `?vehicle=<id>` (the recall rule: `car_anchored` memories
        only for that vehicle, `driver` and `relationship` always). All
        three compose.

        A missing `since` means EVERYTHING, and so does a missing
        `vehicle` - this route is the replication feed as well as the recall
        read, and a replica has to be whole. See the `vehicle` parameter's
        own description.
      parameters:
      - in: query
        name: active
        schema:
          type: string
          enum:
          - '1'
          - 'on'
          - 'true'
          - 'yes'
        description: Narrows the feed to live rows (`deleted_at is null`). Composes
          with `since`. Anything else, `0` and `false` included, means the narrowing
          was not asked for and tombstones stay in - a caller who cannot be understood
          sees too much, never silently nothing.
      - in: query
        name: since
        schema:
          type: string
          format: date-time
        description: ISO-8601 UTC watermark. Returns rows with `updated_at >= since`,
          tombstones included, oldest first. **Omitted or unparsable means EVERYTHING,
          never nothing** (api/sync.parse_since), so a fresh client's first pull is
          the whole table. Hand back the `next` cursor from the previous page, or
          `server_time` from GET /api/changes; both are already `Z`-suffixed so they
          need no extra encoding.
      - in: query
        name: vehicle
        schema:
          type: string
        description: 'The vehicle this device is currently in (the phone''s `ActiveVehicle.current()`
          - a dongle MAC or a `car:<uuid>`). Supplying it applies the recall rule:
          every `driver` and `relationship` memory comes back, and `car_anchored`
          memories come back ONLY for this vehicle. **Omitting it returns everything**,
          because this route is also the replication feed and a replica has to be
          whole - see `api/memory.py`''s own module doc. Send it whenever the rows
          are going into a prompt; omit it when they are going into a local cache.'
      tags:
      - memory
      security:
      - deviceToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedCompanionMemory'
          description: ''
  /api/memory/companion_memories/{identity}/:
    put:
      operationId: api_memory_companion_memories_update
      description: |-
        `PUT <table>/<identity>/`. Idempotent by construction: the
        identity comes from the URL, so a retry cannot make a second row.
        200 whether the row was created or updated - the caller asked for
        the row to exist in this state and it does, and which of the two
        happened is not something a retrying client can act on.
      parameters:
      - in: path
        name: identity
        schema:
          type: string
        description: The row's `origin_guid`.
        required: true
      tags:
      - memory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanionMemory'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CompanionMemory'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CompanionMemory'
        required: true
      security:
      - deviceToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanionMemory'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: 'The write was refused and NOTHING was written. Two body shapes
            occur and both are JSON objects: `{"detail": "..."}` for an unknown field,
            a database refusal or a hand-written check, and `{"<field>": ["..."]}`
            for a field-level validation error. Both carry text meant to be shown
            to a person.'
    delete:
      operationId: api_memory_companion_memories_destroy
      description: |-
        `DELETE <table>/<identity>/`. Sets the tombstone column; the row
        stays, because a phone that has not synced since still needs to
        learn the row is gone. Idempotent - a second delete is still a 204,
        matching `EventsBackend.softDelete`'s own contract.
