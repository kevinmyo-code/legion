    Place:
      type: object
      description: |-
        Base for every serializer this viewset drives.

        Two behaviours, both ticket 04's own text:

        1. **Unknown fields are refused, never dropped.** "A limb sending a
           column the server does not know is a version skew, and it says so
           with a 400 naming the field, never a silent drop." A phone one
           release ahead, writing a column this server has never heard of,
           must be told - a silent drop would look exactly like a successful
           write and lose the value.
        2. **The server facts are the server's.** `id`, `provenance`,
           `created_at`, `updated_at` and `deleted_at` are read-only on every
           subclass; `deleted_at` moves only via DELETE, `updated_at` only via
           the `touch_updated_at` trigger.

        Subclasses set `Meta.model` / `Meta.fields` and, where the table's
        `provenance` column is not the shared `USER` default,
        `default_provenance`.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        label:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        provenance:
          allOf:
          - $ref: '#/components/schemas/ProvenanceEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - created_at
      - deleted_at
      - id
      - label
      - latitude
      - longitude
      - provenance
      - updated_at
    ProvenanceEnum:
      enum:
      - DETERMINISTIC
      - LLM_RECONCILED
      - UNRECONCILED
      - USER
      type: string
      description: |-
        * `DETERMINISTIC` - Deterministic
        * `LLM_RECONCILED` - Llm Reconciled
        * `UNRECONCILED` - Unreconciled
        * `USER` - User
    Receipt:
      type: object
      description: |-
        One `public.receipts` header, with the anchors the gate checked it
        against (section 4 rule 8) and the residual it could not explain (rule 7).

        `ingested_file_id` is nullable here and NOT on `statements`: a receipt can
        reach the gate from a photo the phone took rather than from a file it
        scanned, so there is not always a file row to point at.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        ingested_file_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        store:
          type: string
          readOnly: true
        purchase_date:
          type: string
          format: date
          readOnly: true
        currency:
          type: string
          readOnly: true
        total_cents:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          readOnly: true
          description: The total the receipt printed, in cents. The anchor the line
            items were reconciled against (CLAUDE.md section 4 rule 2).
        subtotal_cents:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          readOnly: true
          nullable: true
        tax_cents:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          readOnly: true
          nullable: true
        other_charges_cents:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          readOnly: true
          nullable: true
        photo_object_path:
          type: string
          readOnly: true
          nullable: true
        provenance:
          allOf:
          - $ref: '#/components/schemas/ProvenanceEnum'
          readOnly: true
          description: |-
            DETERMINISTIC / LLM_RECONCILED / UNRECONCILED / USER. UNRECONCILED is provisional and transient: it is superseded, and physically deleted, when a document that DID pass the gate covers the same purchase.

            * `DETERMINISTIC` - Deterministic
            * `LLM_RECONCILED` - Llm Reconciled
            * `UNRECONCILED` - Unreconciled
            * `USER` - User
        created_at:
          type: string
          format: date-time
          readOnly: true
        origin_guid:
          type: string
          readOnly: true
          nullable: true
        unaccounted_cents:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          readOnly: true
          nullable: true
          description: Null on every healthy receipt. Non-null means the total is
            MORE than the captured lines explain and the difference could not be re-verified
            (CLAUDE.md section 4 rule 7's 2026-08-26 amendment). `provenance` reads
            UNRECONCILED on exactly those rows, by check constraint, so the two always
            agree. **Never add this into a total or any other anchor** - it is the
            residual the arithmetic could not explain, not a figure to reconcile against
            - and any surface showing such a receipt must say in words that it is
            unverified.
      required:
      - created_at
      - currency
      - id
      - ingested_file_id
      - origin_guid
      - other_charges_cents
      - photo_object_path
      - provenance
      - purchase_date
      - store
      - subtotal_cents
      - tax_cents
      - total_cents
      - unaccounted_cents
    ReceiptAnchors:
      type: object
      properties:
        total_cents:
          type: integer
        subtotal_cents:
          type: integer
          nullable: true
        tax_cents:
          type: integer
          nullable: true
        other_charges_cents:
          type: integer
          nullable: true
        note:
          type: string
      required:
      - note
      - other_charges_cents
      - subtotal_cents
      - tax_cents
      - total_cents
    ReceiptCommitted:
      type: object
      description: 'The 201 body: line items were written.'
      properties:
        outcome:
          type: string
          description: Always `COMMITTED` on a 201.
        receipt_id:
          type: string
          format: uuid
        inserted:
          type: integer
          description: Line items written.
        anchors:
          $ref: '#/components/schemas/ReceiptAnchors'
        estimates:
          $ref: '#/components/schemas/ReceiptEstimates'
      required:
      - anchors
      - estimates
      - inserted
      - outcome
      - receipt_id
    ReceiptEstimates:
      type: object
      description: |-
        Section 4 rule 5 as a response a caller cannot miss: anything the
        document does not state is an estimate and is labelled one.
      properties:
        fields:
          type: array
          items:
            type: string
        items_carrying_an_estimate:
          type: integer
        note:
          type: string
      required:
      - fields
      - items_carrying_an_estimate
      - note
    ReceiptLineItem:
      type: object
      description: |-
        One `public.receipt_line_items` row: what the receipt printed, plus four
        macro estimates it did not. See this module's doc comment on rule 5, and on
        why `quantity` and the estimates render as strings rather than numbers.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        receipt_id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
          readOnly: true
        unit_price_cents:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          readOnly: true
          nullable: true
        total_price_cents:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          readOnly: true
          description: In cents. Summed across a receipt's lines, this is what the
            gate checked against the printed total (CLAUDE.md section 4 rule 2).
        estimated_calories_kcal:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
          readOnly: true
          nullable: true
          description: 'An estimate, not a measurement: the model''s guess from the
            product name. A receipt never prints this. Excluded from every reconciliation
            check and never a gated figure (CLAUDE.md section 4 rule 5); any surface
            showing it must say it is an estimate.'
        estimated_protein_g:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
          readOnly: true
          nullable: true
          description: 'An estimate, not a measurement: the model''s guess from the
            product name. A receipt never prints this. Excluded from every reconciliation
            check and never a gated figure (CLAUDE.md section 4 rule 5); any surface
            showing it must say it is an estimate.'
        estimated_carbs_g:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
          readOnly: true
          nullable: true
          description: 'An estimate, not a measurement: the model''s guess from the
            product name. A receipt never prints this. Excluded from every reconciliation
            check and never a gated figure (CLAUDE.md section 4 rule 5); any surface
            showing it must say it is an estimate.'
        estimated_fat_g:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
          readOnly: true
          nullable: true
          description: 'An estimate, not a measurement: the model''s guess from the
            product name. A receipt never prints this. Excluded from every reconciliation
            check and never a gated figure (CLAUDE.md section 4 rule 5); any surface
            showing it must say it is an estimate.'
        reversal_of:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        provenance:
          allOf:
          - $ref: '#/components/schemas/ProvenanceEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        origin_guid:
          type: string
          readOnly: true
          nullable: true
      required:
      - created_at
      - estimated_calories_kcal
      - estimated_carbs_g
      - estimated_fat_g
      - estimated_protein_g
      - id
      - name
      - origin_guid
      - provenance
      - quantity
      - receipt_id
      - reversal_of
      - total_price_cents
      - unit_price_cents
