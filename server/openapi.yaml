        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkipRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SkipRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SkipRequest'
        required: true
      security:
      - deviceToken: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSkip'
          description: Skipped. A new skip for that date.
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSkip'
          description: 'That date was already skipped, and the skip is returned unchanged;
            or it had been un-skipped and the same row is a skip again. Idempotent
