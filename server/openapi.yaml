      type: object
      description: |-
        The 503 body. `detail` is psycopg's own message, verbatim - the
        check says what it actually found rather than a generic failure.
      properties:
        db:
          type: string
          description: Always "error" on a 503.
        detail:
          type: string
      required:
      - db
      - detail
    Household:
      type: object
      description: |-
        `GET`/`PATCH /api/households/me` - the household resource itself.

        `id` is the household's own id, on the household's own endpoint, and is
        the one place a household uuid appears on this API. That is not the
        thing `test_no_openapi_component_declares_household_id` forbids: it
        forbids a tenancy field on a DATA row, where a client could either learn
        something it cannot act on or, worse, choose its own tenancy by sending
        one. A resource describing itself is not that.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        timezone:
          type: string
          nullable: true
          description: The household's IANA timezone (`America/Chicago`), or null
            when the owner has not set one. The engine uses it to decide which local
            day 'today' is (the Groceries same-day untick rule). Any member may read
            it; only the owner may change it.
        created_at:
          type: string
          format: date-time
        members:
          type: array
          items:
            $ref: '#/components/schemas/HouseholdMember'
      required:
      - created_at
      - id
      - members
      - name
      - timezone
    HouseholdMember:
      type: object
      properties:
        role:
          type: string
          description: '`owner` or `member`. The ONLY role there is, and it governs
            membership alone (ADR 0045): an owner may invite and remove people, and
            sees exactly the same rows a member does.'
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        joined_at:
          type: string
          format: date-time
      required:
      - email
      - joined_at
      - name
      - role
      - user_id
    ImportRequest:
      type: object
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ImportRow'
      required:
