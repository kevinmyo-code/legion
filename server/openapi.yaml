          `server_time` from GET /api/changes; both are already `Z`-suffixed so they
          need no extra encoding.
      tags:
      - pantry
      security:
      - deviceToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedReceipt'
          description: ''
  /api/pantry/receipts/{identity}/:
    get:
      operationId: api_pantry_receipts_retrieve
      description: |-
        `GET <table>/<identity>/`. One row, tombstoned or not.

        Routed ONLY on a `GatedReadViewSet`, and it exists there because the
        405 has to have somewhere to happen. A PUT to a path no URL pattern
        matches is a 404, not a 405, and DRF refuses `as_view({})` outright
        ("The `actions` argument must be provided"), so a detail route that
        carried no action at all could not be declared. The minimum honest
        action on a read-only resource is the read, and it is keyed on the
        server's own `id` because none of the five gated tables has a
        client-minted identity that is reliably present: `statements` has no
        `origin_guid` column at all, and it is nullable on
        `ledger_transactions`, `receipts` and `receipt_line_items` (null on
        everything the gate itself committed - see
        `20260826000100_origin_guid.sql`).
      parameters:
      - in: path
        name: identity
        schema:
          type: string
          format: uuid
        description: The row's `id`.
        required: true
      tags:
      - pantry
      security:
      - deviceToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: No such row. Nothing was changed.
  /api/places/:
    get:
      operationId: api_places_list
      description: |-
        `?since=<iso>` (tombstones included) and `?active=1` (live rows
        only). They compose: `?active=1&since=<iso>` is a live-rows-changed
        feed, and `?active=1` alone is every live row since the epoch.

        A missing `since` means EVERYTHING, never nothing - `api/sync.parse_since`
        holds that rule for the whole API and quotes the phone-side cursor
        comment it comes from.
      parameters:
      - in: query
        name: active
        schema:
          type: string
          enum:
          - '1'
          - 'on'
          - 'true'
          - 'yes'
        description: Narrows the feed to live rows (`deleted_at is null`). Composes
          with `since`. Anything else, `0` and `false` included, means the narrowing
          was not asked for and tombstones stay in - a caller who cannot be understood
          sees too much, never silently nothing.
      - in: query
        name: since
        schema:
          type: string
          format: date-time
        description: ISO-8601 UTC watermark. Returns rows with `updated_at >= since`,
          tombstones included, oldest first. **Omitted or unparsable means EVERYTHING,
          never nothing** (api/sync.parse_since), so a fresh client's first pull is
          the whole table. Hand back the `next` cursor from the previous page, or
          `server_time` from GET /api/changes; both are already `Z`-suffixed so they
          need no extra encoding.
      tags:
      - places
      security:
      - deviceToken: []
