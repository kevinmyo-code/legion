  /api/changes:
    get:
      operationId: api_changes_retrieve
      parameters:
      - in: query
        name: aspects
        schema:
          type: array
          items:
            type: string
            enum:
            - events
            - checklists
            - body
            - fleet
            - ingest
            - ledger
            - memory
            - pantry
            - places
            - voice_notes
        description: 'Comma-separated aspect names. Selects which top-level keys get
          populated: `checklists` fills `checklists`, `checklist_items` AND `checklist_ticks`;
          `body` fills all eight of its tables; `memory` all three. **Omitted or blank
          means every known aspect.** An unknown name is a 400 naming it - never a
          silently smaller response. **`fleet` fills eleven of its twelve tables and
          never `obd_samples`**: this endpoint is not paged and that table held 20,796
          rows on 2026-09-07, so telemetry has its own paged, per-vehicle route at
          GET /api/fleet/obd_samples/?vehicle=<uuid>&since= instead. Its absence here
          is a design, not an empty table.'
        explode: false
        style: form
      - in: query
        name: since
        schema:
          type: string
          format: date-time
        description: ISO-8601 UTC watermark. Returns rows with `updated_at >= since`,
          tombstones included, oldest first. **Omitted or unparsable means EVERYTHING,
          never nothing** (api/sync.parse_since), so a fresh client's first pull is
          the whole table. Hand back the `next` cursor from the previous page, or
          `server_time` from GET /api/changes; both are already `Z`-suffixed so they
          need no extra encoding.
      tags:
      - changes
      security:
      - deviceToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Changes'
          description: 'One key per TABLE, named for the table, each holding every
            row changed at or after `since` with tombstones included, oldest first.
            **Not paged**: a large first pull should use the per-table `?since=` routes,
            which are.'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: An aspect name this server does not know. `detail` names it
            and lists the ones that exist.
