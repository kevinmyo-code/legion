openapi: 3.0.3
info:
  title: LEGION
  version: 0.1.0
  description: The engine. One Django server, every limb a client of it.
paths:
  /api/assistant/companion:
    get:
      operationId: api_assistant_companion_retrieve
      description: |-
        Read only. Device tokens may read it too (the API default), so the
        phone can show which companion a member has on the web. Setting one is
        the admin's or `manage.py set_companion`'s; the REST write is not built.

        A recruiter's visit may read it too (ADR 0068, ticket 05): the chat header
        shows the companion's name, and for a recruiter that is always Alfred
        (`companions.recruiter_companion`).
      summary: Who the signed-in member talks to
      tags:
      - assistant
      security:
      - deviceToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantCompanion'
          description: ''
  /api/assistant/conversation:
    post:
      operationId: api_assistant_conversation_create
      description: |-
        The browser's half of a conversation's record. Write only: there is no read here, for a
        member or a recruiter; the record is read with `manage.py device_logs` on the engine.

        A recruiter may use this door (`allows_recruiter`, as on the other assistant doors) for its
        OWN conversation only: `web_conversation.owned` matches the id to the caller, and a visit's
        record to a visit. `/api/device-logs/` stays denied to a recruiter.
      summary: Add the browser's transcript events to the caller's own conversation
        record
      tags:
      - assistant
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConversationUpload'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantConversationStored'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Refused; nothing stored.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: No conversation with that id is the caller's.
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Over the cap; nothing stored.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Too many uploads; nothing stored.
  /api/assistant/pack:
    get:
      operationId: api_assistant_pack_retrieve
      summary: 'The Alfred pack: versioned wording the phone reads at session start'
      parameters:
      - in: header
        name: If-None-Match
        schema:
          type: string
        description: The ETag the client holds; a match answers 304 with no body.
      - in: query
        name: client
        schema:
          type: string
          enum:
          - phone
        description: Which client asks. Only `phone` today, and the default.
      tags:
      - assistant
      security:
      - deviceToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantPack'
          description: ''
        '304':
          description: The client's pack is current. No body.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: The engine refused its own pack, so none was sent.
  /api/assistant/session:
    post:
      operationId: api_assistant_session_create
      summary: 'Start a live conversation: mint a locked Gemini Live token'
      tags:
      - assistant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantSessionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssistantSessionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssistantSessionRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantSession'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: The body did not fit.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: 'Too many starts; nothing started. For a recruiter''s demo
            visit, also: "Today''s demo budget is used up. Try again tomorrow."'
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Google refused the key or the session, in words.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: No `LEGION_GEMINI_KEY` on this server ("The assistant isn't
            set up on this server."), or Google did not answer.
  /api/assistant/tool:
    post:
      operationId: api_assistant_tool_create
      summary: Run one tool call from a live conversation, as the signed-in member
      tags:
      - assistant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantToolRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssistantToolRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssistantToolRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantToolResult'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantToolRefusal'
          description: Not a tool the web assistant has, or a body that did not fit.
            Nothing ran. `response` is ready to forward to Gemini.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Too many calls; nothing ran.
  /api/auth/csrf:
    get:
      operationId: api_auth_csrf_retrieve
      description: |-
        `GET /api/auth/csrf`. Ensures the `csrftoken` cookie is set so the
        browser has something to echo back in `X-CSRFToken` on the session login
        POST and everything session-authenticated after it
        (`frontend/src/api/client.ts`'s `djangoSession` middleware reads this
        exact cookie name). Anonymous and side-effect-free beyond the cookie
        itself - `ensure_csrf_cookie` forces Django to set it even though this
        view reads nothing that would otherwise trigger it.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: The `csrftoken` cookie is set.
  /api/auth/devices:
    get:
      operationId: api_auth_devices_list
      description: |-
        `GET /api/auth/devices`. The calling user's own LIVE device tokens.

        Own, not the household's: a device token is a credential belonging to one
        person, and ADR 0045's owner role governs membership, never someone
        else's phone. An owner who wants a person gone removes the member, which
        revokes their tokens (`DELETE /api/households/me/members/<user_id>`).

        Revoked tokens are not listed. The list answers "what can currently reach
        this account", which is the question a person opens this screen to ask; a
        login history is a different feature and this is not a half-built one.
      tags:
      - auth
      security:
      - deviceToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceToken'
          description: Live device tokens for the calling user, newest first. Never
            a key - the server holds only hashes.
  /api/auth/devices/{token_id}:
    delete:
      operationId: api_auth_devices_destroy
      description: |-
        `DELETE /api/auth/devices/<id>`. Revokes one of the calling user's own
        device tokens - the hands path to "I lost my phone".

        Scoped to `request.user`, so another member's token id 404s rather than
        403s: from here that token does not exist, and a 403 would confirm that
        it does.
      parameters:
      - in: path
        name: token_id
        schema:
          type: integer
        required: true
      tags:
      - auth
      security:
      - deviceToken: []
      - cookieAuth: []
      responses:
        '204':
          description: 'That device token is revoked and every other device keeps
            working. Already-revoked is the same answer: the outcome asked for holds.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: No device token of yours has that id. Nothing was revoked.
  /api/auth/invite/{code}:
    get:
      operationId: api_auth_invite_retrieve
      description: |-
        `GET /api/auth/invite/<code>`. What this code will do, without
        spending it.

        Ticket 05's `/join/<code>` screen calls this on load: a person who was
        sent a link has to be told whether it still works, and whether following
        it joins a family or starts one, BEFORE they type a password into a form
        that then fails. Nothing here increments `used_count` - previewing a code
        is not using it.

        Anonymous, and throttled on the same `signup` scope as the redemption
        endpoint, so the two together give a stranger five guesses a minute at
        the code space rather than ten.

        A code that does not exist answers 404; a real code that is revoked,
        expired or spent answers 200 with `live: false` and a `reason`. The split
        is deliberate - "you mistyped it" and "it expired" are different things
        for the screen to say, and a 12-character random code is not a namespace
        an attacker enumerates five guesses a minute.
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitePreview'
          description: The code exists. `live` says whether it can still be used and
            `reason` says why not when it cannot. Nothing was spent.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: No invite has that code. Nothing was spent.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: 'Rate limited: 5/min per IP, shared with POST /api/auth/signup.'
  /api/auth/login:
    post:
      operationId: api_auth_login_create
      description: |-
        `POST /api/auth/login`. Rate-limited 5/min per IP so a leaked email
        cannot be brute-forced into a working password - the household is two
        people, not a userbase, so five attempts a minute is generous, not
        tight.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: 'A new device token. `token` is the raw key and is shown ONCE
            - the server stores only its hash and cannot hand it back again. Send
            it as `Authorization: Token <key>` on every later call.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Wrong email or password, or the account is inactive. No token
            was issued.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: 'Rate limited: 5 attempts a minute per IP. `detail` says when
            to try again.'
  /api/auth/logout:
    post:
      operationId: api_auth_logout_create
      description: |-
        `POST /api/auth/logout`. Revokes only the token making the request -
        every other device this user owns keeps working.

        Send it with an explicit `Content-Length: 0` even though there is no
        body: measured against the deployed Cloud Run service on 2026-09-07, a
        POST carrying neither a body nor that header is answered 411 Length
        Required by the frontend and never reaches Django, so the token is NOT
        revoked and the caller has been told nothing about why. Most HTTP
        clients set the header themselves for an empty POST; `curl` without
        `-d` does not.
      tags:
      - auth
      security:
      - deviceToken: []
      - cookieAuth: []
      responses:
        '204':
          description: This token is revoked. Every other device keeps working.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: The request carried no device token, so there was nothing to
            revoke. Nothing was changed.
  /api/auth/me:
    get:
      operationId: api_auth_me_retrieve
      description: |-
        `GET /api/auth/me`. This is the membership check for both credentials
        - if this call succeeds, the calling token or session is live and its
        user is a household member; if it 401s or 403s, the caller knows to ask
        for a new one. `DEFAULT_AUTHENTICATION_CLASSES` tries the device token
        first and the session second, so a phone request never pays a session
        lookup.
      tags:
      - auth
      security:
      - deviceToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
          description: The token or session is live and its user is a household member.
            `device_name` is the name the token was issued under at login, or empty
            for a session.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: No credential, an unknown token, or a revoked one. Ask for
            a new one.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: The credential is live but its user is not a household member.
            A `User` row alone is not enough - see `manage.py add_household_member`.
    patch:
      operationId: api_auth_me_partial_update
      description: |-
        web-revamp ticket 05 (spec D12): a member renames themself. Writes
        `first_name`, the field `GET /api/households/me` reads members' names
        from. Only your own account: there is no user id in the path.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdate'
      security:
      - deviceToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
          description: The name is changed. The body is the account as it now is.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: The name is blank or too long. Nothing was changed.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: No live credential.
  /api/auth/password:
    post:
      operationId: api_auth_password_create
      description: |-
        `POST /api/auth/password` (web-revamp ticket 05, spec D12).

        The current password is required even from a signed-in session: a
        browser left open is not the person. Throttled on the `login` scope,
        because checking a current password is a password guess like any other.
        The new one runs Django's `AUTH_PASSWORD_VALIDATORS`, and each refusal
        is said in words. A browser session survives the change
        (`update_session_auth_hash`); device tokens are untouched, since a token
        is not derived from the password.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChange'
        required: true
      security:
      - deviceToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Changed. This session stays signed in; devices stay signed
            in.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: 'Nothing was changed: the current password is wrong, or the
            new one fails a password rule. `detail` says which, in words.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: No live credential.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Too many attempts this minute. Nothing was changed.
  /api/auth/session/login:
    post:
      operationId: api_auth_session_login_create
      description: |-
        `POST /api/auth/session/login`. Sets a Django session cookie for the
        browser. Deliberately mints NO device token - a session and a token are
        different credentials with different revocation stories (ADR 0044 rule
        3) - and is throttled the same as `LoginView`, same scope, so the two
        login doors share one rate budget rather than doubling the attempts a
        leaked email tolerates.

        Anonymous by construction (`authentication_classes = []`, same as
        `LoginView`): this is the request that CREATES the session, so there is
        nothing yet for `SessionAuthentication` to attach to, and DRF's own
        `APIView.as_view()` exempts every view from Django's blanket CSRF
        middleware for exactly this reason - CSRF protection for the session
        path starts at the NEXT request, once `SessionAuthentication` has a
        logged-in user to enforce it against (see `SessionLogoutView`).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SessionLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SessionLoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
          description: A Django session cookie is set. Body is the same shape `/api/auth/me`
            returns; `device_name` is always empty since a session names no device.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Wrong email or password, or the account is inactive. No session
            was created.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: 'Rate limited: 5 attempts a minute per IP, shared with `/api/auth/login`.
            `detail` says when to try again.'
  /api/auth/session/logout:
    post:
      operationId: api_auth_session_logout_create
      description: |-
        `POST /api/auth/session/logout`. Ends the Django session. Never
        touches a device token - `authentication_classes` names only
        `SessionAuthentication`, so a request carrying a device token instead of
        a session cookie authenticates as nobody here and is refused by the
        default `IsHouseholdMember` permission, the same as any other
        unauthenticated request.

        Reachable only once a session already exists, which is exactly the case
        `rest_framework.authentication.SessionAuthentication.authenticate()`
        calls `enforce_csrf()` on - so this endpoint requires `X-CSRFToken`
        without anything here asking for it by hand. Do not subclass
        `SessionAuthentication` to turn that off.
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: The session is ended.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: No active session, or a missing/invalid CSRF token.
  /api/auth/signup:
    post:
      operationId: api_auth_signup_create
      description: |-
        `POST /api/auth/signup`. Creates a user, puts them in a household, and
        issues a device token - the whole of "my wife wants to use this" in one
        call.

        **Invite-only by default (ADR 0045 decision 3).** With no
        `LEGION_OPEN_SIGNUP`, a request carrying no `invite_code` is refused
        outright; this is a household engine, not a service with a sign-up page.
        With the switch on, a codeless request founds a household - and a request
        that DOES carry a code is still honoured exactly as it would be with the
        switch off, so the second adult on a stranger's compose stack joins the
        first one's household rather than founding a rival one.

        **Atomic, and the invite row is locked.** Everything below is one
        transaction: a refused password must not leave a user behind, and a
        `max_uses` of one must mean one even if two people press the button
        together (`Invite.find(for_update=True)`).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SignupRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SignupRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: 'The account exists, is a member of a household, and `token`
            is a new device token for it - shown ONCE, exactly as POST /api/auth/login
            returns one. Send it as `Authorization: Token <key>`.'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: 'NOTHING was created. `detail` names which of these it was:
            no invite code on an invite-only engine, a code that does not exist, a
            code that is revoked/expired/spent, an email already registered, a rejected
            password, or a missing `household_name` for a code that founds a household.
            A field-level shape error answers with the field-keyed body instead.'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: 'Rate limited: 5 signup attempts a minute per IP, shared with
            GET /api/auth/invite/{code} so guessing codes cannot be split across the
            two. Nothing was created.'
  /api/body/bodyweight_logs/:
    get:
      operationId: api_body_bodyweight_logs_list
      description: |-
        `?since=<iso>` (tombstones included) and `?active=1` (live rows
        only). They compose: `?active=1&since=<iso>` is a live-rows-changed
        feed, and `?active=1` alone is every live row since the epoch.

        A missing `since` means EVERYTHING, never nothing - `api/sync.parse_since`
        holds that rule for the whole API and quotes the phone-side cursor
        comment it comes from.
      parameters:
      - in: query
        name: active
        schema:
          type: string
          enum:
          - '1'
          - 'on'
          - 'true'
          - 'yes'
        description: Narrows the feed to live rows (`deleted_at is null`). Composes
          with `since`. Anything else, `0` and `false` included, means the narrowing
          was not asked for and tombstones stay in - a caller who cannot be understood
          sees too much, never silently nothing.
      - in: query
        name: after
        schema:
          type: string
        description: 'Keyset tiebreak: the `next_after` from the previous page, sent
          together with `since=<next>`. Returns rows strictly after that position
          in `(cursor, id)` order, so a page of rows sharing one timestamp cannot
          re-serve itself. Omitted or unparsable means no tiebreak: the inclusive
          `since` read, exactly as before (api/sync.paginate_keyset).'
      - in: query
        name: since
        schema:
          type: string
          format: date-time
        description: ISO-8601 UTC watermark. Returns rows with `updated_at >= since`,
          tombstones included, oldest first. **Omitted or unparsable means EVERYTHING,
          never nothing** (api/sync.parse_since), so a fresh client's first pull is
          the whole table. Hand back the `next` cursor from the previous page, or
          `server_time` from GET /api/changes; both are already `Z`-suffixed so they
          need no extra encoding.
      tags:
      - body
      security:
      - deviceToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedBodyweightLog'
          description: ''
  /api/body/bodyweight_logs/{identity}/:
    put:
      operationId: api_body_bodyweight_logs_update
      description: |-
        `PUT <table>/<identity>/`. Idempotent by construction: the
        identity comes from the URL, so a retry cannot make a second row.
        200 whether the row was created or updated - the caller asked for
        the row to exist in this state and it does, and which of the two
        happened is not something a retrying client can act on.
      parameters:
      - in: path
        name: identity
        schema:
          type: string
        description: The row's `origin_guid`.
        required: true
      tags:
