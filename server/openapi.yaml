    CodeClearEvent:
      type: object
      description: |-
        Field-for-field `RemoteCodeClearEvent` / `CodeClearEventUpload`: the
        outcome of one Mode 04 clear-codes send.

        A row exists only for CLEARED, RETURNED or UNVERIFIED. The two no-op
        outcomes (`NOTHING_TO_CLEAR`, `REFUSED`) never send anything and never
        reach this table, which is why they are not in the allowed set.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        sync_id:
          type: string
        vehicle_id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
        mileage:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        codes_before: {}
        freeze_frame:
          nullable: true
        codes_after:
          nullable: true
          description: THREE-way, not two. Null means the post-send re-read never
            completed (UNVERIFIED). An empty array means it ran and found nothing
            (CLEARED). A non-empty array names the codes that survived (RETURNED).
            Do not collapse null and the empty array.
        outcome:
          type: string
        ack_raw:
          type: string
          default: ''
          description: 'The adapter''s raw acknowledgement. DIAGNOSTIC ONLY: a failed
            send returns an empty string and a quiet link answers exactly like a real
            ack, so `outcome` is never asserted off this field.'
        provenance:
          allOf:
          - $ref: '#/components/schemas/ProvenanceEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - codes_before
      - created_at
      - deleted_at
      - id
      - occurred_at
      - outcome
      - provenance
      - sync_id
      - updated_at
      - vehicle_id
    CodeEvent:
      type: object
      description: |-
        Field-for-field `RemoteCodeEvent` / `CodeEventUpload`: one ELM327 DTC
        read plus its Mode 02 freeze frame.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        sync_id:
          type: string
        vehicle_id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
        mileage:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          description: 'An estimate, not a measurement: a frozen snapshot of the vehicle''s
            current mileage at read time, with nothing captured to prove how stale
            it was. Diagnostic metadata, never a gated figure.'
        codes:
          description: A JSON array of DTC strings, e.g. ["P0420","P0128"].
        freeze_frame:
          nullable: true
          description: A JSON object, or null when the adapter returned no freeze
            frame at all - some older ELM327 clones skip Mode 02 entirely. Null and
            an empty object are different facts.
        provenance:
          allOf:
          - $ref: '#/components/schemas/ProvenanceEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
