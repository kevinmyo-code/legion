    ChassisQuirk:
      type: object
      description: |-
        Field-for-field `RemoteChassisQuirk` / `ChassisQuirkUpload`.

        `chassis` is a comma-delimited list of chassis codes, e.g. "E46,E46M3",
        carried verbatim rather than normalised into a join table - it matches the
        phone's own shape, and it is NOT a `vehicle_id`: this is platform reference
        data, independent of any specific vehicle row.

        The cost and mileage bounds are null, never -1, when unknown. The phone
        stores -1 as its unbounded sentinel and that sentinel must not be carried
        forward - it is the zero-default trap wearing a different number.
      properties:
        quirk_id:
          type: string
        chassis:
          type: string
        engine:
          type: string
          default: ''
        title:
          type: string
        symptom:
          type: string
        verification_steps:
          type: string
        mileage_low:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          description: Null means no lower bound. Never -1, which is the phone's own
            sentinel and must not be carried forward.
        mileage_high:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        severity:
          type: string
        cost_low_cents:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
          description: Typical repair cost range, in cents (CLAUDE.md section 4 rule
            3). Null means unknown or DIY-variable, never 0.
        cost_high_cents:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        fix_notes:
          type: string
          default: ''
        source_url:
          type: string
          default: ''
        provenance:
          allOf:
          - $ref: '#/components/schemas/ProvenanceEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - chassis
      - created_at
      - provenance
      - quirk_id
      - severity
      - symptom
      - title
      - updated_at
      - verification_steps
