          nullable: true
          description: 'An estimate, not a measurement: the model''s guess from the
            meal description. Never gated and never treated as a reconciled figure
            (CLAUDE.md section 4 rule 5).'
        logged_at:
          type: string
          format: date-time
        source_image_path:
          type: string
          nullable: true
        trust_tier:
          type: string
        provenance:
          allOf:
