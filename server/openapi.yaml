          description: Rows that looked like a vault identifier; never stored.
        refused_invalid:
          type: integer
      required:
      - already_here
      - imported
      - refused_invalid
      - refused_sensitive
    ImportRow:
      type: object
      properties:
        store:
          allOf:
          - $ref: '#/components/schemas/MemberMemoryImportStoreEnum'
          description: |-
            `companion_memories` (learned) or `memories` (what `remember` saved).

            * `companion_memories` - companion_memories
            * `memories` - memories
        origin_guid:
          type: string
          maxLength: 64
        text:
          type: string
        category:
          type: string
          default: ''
        source:
          type: string
          default: ''
        importance:
          type: integer
          nullable: true
        logged_at:
          type: string
          format: date-time
        last_accessed_at:
          type: string
          format: date-time
          nullable: true
      required:
      - logged_at
      - origin_guid
      - store
      - text
    IngestOutcome:
      type: object
      description: |-
        The 200 body, and it covers BOTH no-write outcomes because they are one
        status code and a client branches on `outcome`, not on the shape.

        `ALREADY_COMMITTED` carries `content_sha256` and `note`; `QUARANTINED`
        carries `reason`. `inserted` is 0 in both - nothing was written either way.
        A quarantine is a VERDICT, not a transport failure (see this module's own
        doc comment for why it is not a 4xx), so it must never be surfaced as
        "something went wrong" or retried blindly.
      properties:
        outcome:
          type: string
          description: '`ALREADY_COMMITTED` or `QUARANTINED`.'
        inserted:
          type: integer
          description: Always 0 here. Nothing was written.
        content_sha256:
          type: string
          description: '`ALREADY_COMMITTED` only.'
        note:
          type: string
          description: '`ALREADY_COMMITTED` only.'
        reason:
          type: string
          description: '`QUARANTINED` only: what the gate found, in words. Stored
            on `ingested_files.quarantine_reason` too, so the file is not re-offered
            with no memory of why it failed.'
      required:
      - inserted
      - outcome
    IngestStateEnum:
      enum:
      - NEW
      - INGESTED
      - QUARANTINED
      - UNREADABLE
      - DUPLICATE_CONTENT
      - NEEDS_LLM
      type: string
      description: |-
        * `NEW` - New
        * `INGESTED` - Ingested
        * `QUARANTINED` - Quarantined
        * `UNREADABLE` - Unreadable
        * `DUPLICATE_CONTENT` - Duplicate Content
        * `NEEDS_LLM` - Needs Llm
    IngestedFile:
      type: object
      description: |-
        One `public.ingested_files` row.

        `content_sha256` is the idempotency key the whole ingest path turns on: a
        second post of the same bytes is a no-op, which is what makes a lost
        acknowledgement retryable rather than ambiguous
        (`ingest.views._already_committed`'s own doc comment). `quarantine_reason`
        is the sentence the gate wrote when it refused, in the same words the
        caller was given at the time.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        content_sha256:
          type: string
          readOnly: true
        source_file_id:
          type: string
          readOnly: true
          nullable: true
        display_name:
          type: string
          readOnly: true
          nullable: true
        size_bytes:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          readOnly: true
          nullable: true
        state:
          allOf:
          - $ref: '#/components/schemas/IngestStateEnum'
          readOnly: true
          description: |-
            Where this document got to. INGESTED means the section 4 gate ran and committed it; QUARANTINED means the gate ran and REFUSED it, and `quarantine_reason` says why in words; UNREADABLE, DUPLICATE_CONTENT and NEEDS_LLM are the three ways it never reached the gate at all. A QUARANTINED file wrote no rows anywhere - that is the point of it.

            * `NEW` - New
            * `INGESTED` - Ingested
            * `QUARANTINED` - Quarantined
            * `UNREADABLE` - Unreadable
            * `DUPLICATE_CONTENT` - Duplicate Content
            * `NEEDS_LLM` - Needs Llm
        quarantine_reason:
          type: string
          readOnly: true
          nullable: true
          description: 'The gate''s own sentence, or null. Written to be shown to
            a person: it says which figures did not agree, not merely that something
            failed.'
        first_seen_at:
          type: string
          format: date-time
          readOnly: true
          description: The first time this content was posted. FIXED after the first
            insert - not a change watermark. Page this feed with `since` against `last_attempt_at`,
            which is what the `next` cursor carries.
        last_attempt_at:
          type: string
          format: date-time
          readOnly: true
          description: The last time this content was posted, rewritten on every commit
            and every retry. The column this feed's `?since=` and `next` are keyed
            on.
      required:
      - content_sha256
      - display_name
      - first_seen_at
      - id
      - last_attempt_at
      - quarantine_reason
      - size_bytes
      - source_file_id
      - state
    InternalReason:
      type: object
      properties:
        reason:
          allOf:
          - $ref: '#/components/schemas/InternalReasonReasonEnum'
          description: |-
            MEMBER_TRANSFER: to or from a household member. CROSS_BORDER_PAIR: the two legs of a transfer between the household's accounts in two countries.

            * `MEMBER_TRANSFER` - MEMBER_TRANSFER
            * `CROSS_BORDER_PAIR` - CROSS_BORDER_PAIR
        cents:
          type: integer
      required:
      - cents
      - reason
    InternalReasonReasonEnum:
      enum:
      - MEMBER_TRANSFER
      - CROSS_BORDER_PAIR
      type: string
      description: |-
        * `MEMBER_TRANSFER` - MEMBER_TRANSFER
        * `CROSS_BORDER_PAIR` - CROSS_BORDER_PAIR
    InternalRow:
      type: object
      properties:
        txn_date:
          type: string
          format: date
        description:
          type: string
        amount_cents:
          type: integer
        currency:
          type: string
        reason:
          type: string
          description: MEMBER_TRANSFER or CROSS_BORDER_PAIR.
        paired:
          type: boolean
          description: Both legs are on file.
      required:
      - amount_cents
      - currency
      - description
      - paired
      - reason
      - txn_date
    Invite:
      type: object
      description: |-
        One live invite, code included.

        The code is here on purpose and only for live invites: an owner who
        minted a code yesterday and lost the message has to be able to read it
        back, and `GET /api/households/me/invites` returns only invites that are
        still live (`household/households.py:InviteListCreateView`), so a spent,
        expired or revoked code is never listed at all.
      properties:
        id:
          type: integer
        code:
          type: string
        join_url:
          type: string
        creates_household:
          type: boolean
        max_uses:
          type: integer
        used_count:
          type: integer
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
      required:
      - code
      - created_at
      - creates_household
      - expires_at
      - id
      - join_url
      - max_uses
      - used_count
    InviteCreateRequest:
      type: object
      description: |-
        `POST /api/households/me/invites`. Every field optional: the common
        case is an owner minting a code for one more adult in their own
        household, and that is what the defaults are.
      properties:
        creates_household:
          type: boolean
          default: false
          description: True mints a code that FOUNDS a household rather than joining
            this one. The first person to sign up with it names the household and
            becomes its owner; later uses join what the first one founded.
        max_uses:
          type: integer
          maximum: 50
          minimum: 1
          default: 2
        expires_in_days:
          type: integer
          maximum: 365
          minimum: 1
          default: 14
    InvitePreview:
      type: object
      description: |-
        `GET /api/auth/invite/<code>` - what a code will do, WITHOUT spending
        it. Ticket 05's `/join/<code>` screen renders this before anyone types a
        password.

        Anonymous, so it says as little as it can get away with: whether the
        code is live, whether signing up with it joins a household or founds
        one, and - only when it joins an existing one - that household's NAME,
        so the person can tell they are joining the right family. Never its id
        (nothing a signed-out stranger can do with a uuid is honest), never who
        minted it, never how many uses are left when it is dead.
      properties:
        code:
          type: string
        live:
          type: boolean
        creates_household:
          type: boolean
        household_name:
          type: string
          nullable: true
          description: The household this code joins, or null when it founds a new
            one and the person signing up gets to name it.
        uses_left:
          type: integer
        expires_at:
          type: string
          format: date-time
        reason:
          type: string
          nullable: true
          description: Why the code cannot be used, in words, or null when it can.
      required:
      - code
      - creates_household
      - expires_at
      - household_name
      - live
      - reason
      - uses_left
    InviteRequest:
      type: object
      properties:
        opponent_user_id:
          type: string
          format: uuid
      required:
      - opponent_user_id
    InviteResponse:
      type: object
      properties:
        match:
          $ref: '#/components/schemas/Match'
        push:
          allOf:
          - $ref: '#/components/schemas/PushEnum'
          description: |-
            What happened to the notification. Only `sent` reached a device.

            * `sent` - sent
            * `no_device` - no_device
            * `turned_off` - turned_off
            * `failed` - failed
            * `not_set_up` - not_set_up
        detail:
          type: string
      required:
      - detail
      - match
      - push
    LastBought:
      type: object
      properties:
        query:
          type: string
        matches:
          type: array
          items:
            $ref: '#/components/schemas/LastBoughtMatch'
        message:
          type: string
          description: The sentence to show or say. It always names the entries it
            matched.
      required:
      - matches
      - message
      - query
    LastBoughtMatch:
      type: object
      properties:
        entry:
          $ref: '#/components/schemas/Purchase'
        exact:
          type: boolean
          description: 'True when the entry''s text IS the query (case and spacing
            aside). False for a loose match: say the entry''s own text, never the
            query''s.'
        times_logged:
          type: integer
          description: How many live entries carry this same item text.
      required:
      - entry
      - exact
      - times_logged
    LastOutcomeEnum:
      enum:
      - ok
      - failed
      - needs_login
      - skipped_locked
      - skipped
      type: string
      description: |-
        * `ok` - OK
        * `failed` - Failed
        * `needs_login` - Needs login
        * `skipped_locked` - Skipped, already running
        * `skipped` - Skipped, not set up
    LedgerTransaction:
      type: object
      description: |-
        One `public.ledger_transactions` row.

        `provenance` is the load-bearing field on the wire, not decoration.
        `UNRECONCILED` means section 4 rule 7: the source stated no anchor, the
        row is provisional, it is transient, and **every surface that renders one
        must say so in words** - which for this API means a client cannot render
        this row without reading this field. `statement_id` is null on exactly
        those rows and non-null on every other, by
        `ledger_txn_header_matches_provenance`, so the two always agree.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        statement_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        account_last4:
          type: string
          readOnly: true
        account_nickname:
          type: string
          readOnly: true
        currency:
          type: string
          readOnly: true
        txn_date:
          type: string
          format: date
          readOnly: true
        description:
          type: string
          readOnly: true
        display_description:
          type: string
          readOnly: true
          nullable: true
          description: 'Merchant name a person chose for this row''s bank text (a
            merchant alias); null when none applies. Display only: `description` is
            the bank''s own text and is never changed.'
        amount_cents:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          readOnly: true
        balance_cents:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          readOnly: true
          nullable: true
        line_ref:
          type: string
          readOnly: true
        category:
          type: string
          readOnly: true
          nullable: true
          description: 'The EFFECTIVE category: a live `ledger_transaction_categories`
            override''s if there is one, else the row''s own (`stored_category`).
            What every surface shows.'
        category_pending:
          type: boolean
          readOnly: true
          description: False under a live override; otherwise the row's own flag.
        stored_category:
          type: string
          readOnly: true
          nullable: true
          description: 'The row''s own `category` column, exactly as the gate wrote
            it. Never changes: `forbid_mutation_of_facts` refuses every UPDATE.'
        category_source:
          readOnly: true
          nullable: true
          description: |-
            Which one `category` is: `person` or `rule` (a live override), `stored` (the row's own column), or null when the row has no category.

            * `person` - person
            * `rule` - rule
            * `stored` - stored
          oneOf:
          - $ref: '#/components/schemas/CategorySourceEnum'
          - $ref: '#/components/schemas/NullEnum'
        pending_logged_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        pending:
          type: boolean
          readOnly: true
          description: True while the bank has not posted this transaction yet (a
            BANK_API row only). The bank may still change its amount or drop it.
        reversal_of:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: The id of the row this one reverses, or null. A gated row is
            never edited; it is corrected by posting a reversal and a replacement.
        provenance:
          allOf:
          - $ref: '#/components/schemas/ProvenanceEnum'
          readOnly: true
          description: |-
            DETERMINISTIC / LLM_RECONCILED / UNRECONCILED / USER / BANK_API. **UNRECONCILED is provisional** (CLAUDE.md section 4 rule 7): the source stated no anchor, the figure is unverified, and any surface showing it - or any total containing it - must say so in words, never by colour or a glyph alone. **BANK_API is the bank's own feed (ADR 0057) and is fact**: render it exactly like a verified row, with no tag.

            * `DETERMINISTIC` - Deterministic
            * `LLM_RECONCILED` - Llm Reconciled
            * `UNRECONCILED` - Unreconciled
            * `USER` - User
            * `BANK_API` - Bank Api
        verification_note:
          type: string
          nullable: true
          readOnly: true
          description: 'A sentence beginning ''Unverified'' on every UNRECONCILED
            row (section 4 rule 7: the source stated no anchor, so the row is provisional).
            Null on a row that passed the gate. A surface showing the row, or a total
            containing it, shows this.'
        created_at:
          type: string
          format: date-time
          readOnly: true
        origin_guid:
          type: string
          readOnly: true
          nullable: true
      required:
      - account_last4
      - account_nickname
      - amount_cents
      - balance_cents
      - category
      - category_pending
      - category_source
      - created_at
      - currency
      - description
      - display_description
      - id
      - line_ref
      - origin_guid
      - pending
      - pending_logged_at
      - provenance
      - reversal_of
      - statement_id
      - stored_category
      - txn_date
      - verification_note
    LedgerTransactionCategory:
      type: object
      description: |-
        One `ledger_transaction_categories` row: a category shown in place of a
        gated transaction's own.

        `transaction_id` can only name a transaction in the caller's household
        (`HouseholdScopedPrimaryKeyRelatedField`); one in another household reads
        as one that does not exist, which from here it does not.

        **`source` defaults to `person` on every write**, not only on insert. A
        PUT says "the row in this state", and a client that left `source` out of
        a PUT over a `rule` row is a person choosing a category; keeping `rule`
        would let the backfill's word stand over theirs.

        **A `rule` never replaces a live `person` row.** Refused here in words; a
        trigger refuses it again in SQL (`ingest/category_overrides.py`).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        transaction_id:
          type: string
          format: uuid
        category:
          type: string
        source:
          type: string
          description: '`person` (the default: someone chose it) or `rule` (written
            by `manage.py apply_category_rules` from the household''s rules). A rule
            never replaces a live person row.'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        origin_guid:
          type: string
          nullable: true
      required:
      - category
      - created_at
      - deleted_at
      - id
      - transaction_id
      - updated_at
    LibraryBook:
      type: object
      properties:
