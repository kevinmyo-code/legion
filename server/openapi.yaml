  /api/pantry/receipts/:
    get:
      operationId: api_pantry_receipts_list
      description: |-
        `?since=<iso>` (tombstones included) and `?active=1` (live rows
        only). They compose: `?active=1&since=<iso>` is a live-rows-changed
        feed, and `?active=1` alone is every live row since the epoch.

        A missing `since` means EVERYTHING, never nothing - `api/sync.parse_since`
        holds that rule for the whole API and quotes the phone-side cursor
        comment it comes from.
      parameters:
      - in: query
        name: after
        schema:
          type: string
        description: 'Keyset tiebreak: the `next_after` from the previous page, sent
          together with `since=<next>`. Returns rows strictly after that position
          in `(cursor, id)` order, so a page of rows sharing one timestamp cannot
          re-serve itself. Omitted or unparsable means no tiebreak: the inclusive
          `since` read, exactly as before (api/sync.paginate_keyset).'
      - in: query
        name: since
        schema:
          type: string
          format: date-time
        description: ISO-8601 UTC watermark. Returns rows with `updated_at >= since`,
          tombstones included, oldest first. **Omitted or unparsable means EVERYTHING,
          never nothing** (api/sync.parse_since), so a fresh client's first pull is
          the whole table. Hand back the `next` cursor from the previous page, or
          `server_time` from GET /api/changes; both are already `Z`-suffixed so they
          need no extra encoding.
      tags:
      - pantry
      security:
      - deviceToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedReceipt'
          description: ''
  /api/pantry/receipts/{identity}/:
    get:
      operationId: api_pantry_receipts_retrieve
      description: |-
        `GET <table>/<identity>/`. One row, tombstoned or not.

        Routed ONLY on a `GatedReadViewSet`, and it exists there because the
        405 has to have somewhere to happen. A PUT to a path no URL pattern
        matches is a 404, not a 405, and DRF refuses `as_view({})` outright
        ("The `actions` argument must be provided"), so a detail route that
        carried no action at all could not be declared. The minimum honest
        action on a read-only resource is the read, and it is keyed on the
        server's own `id` because none of the five gated tables has a
        client-minted identity that is reliably present: `statements` has no
        `origin_guid` column at all, and it is nullable on
        `ledger_transactions`, `receipts` and `receipt_line_items` (null on
        everything the gate itself committed - see
        `20260826000100_origin_guid.sql`).
      parameters:
      - in: path
        name: identity
        schema:
          type: string
          format: uuid
        description: The row's `id`.
        required: true
      tags:
      - pantry
      security:
      - deviceToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: No such row. Nothing was changed.
  /api/places/:
    get:
      operationId: api_places_list
      description: |-
        `?since=<iso>` (tombstones included) and `?active=1` (live rows
        only). They compose: `?active=1&since=<iso>` is a live-rows-changed
        feed, and `?active=1` alone is every live row since the epoch.

        A missing `since` means EVERYTHING, never nothing - `api/sync.parse_since`
        holds that rule for the whole API and quotes the phone-side cursor
        comment it comes from.
      parameters:
      - in: query
        name: active
        schema:
          type: string
          enum:
          - '1'
          - 'on'
          - 'true'
          - 'yes'
        description: Narrows the feed to live rows (`deleted_at is null`). Composes
          with `since`. Anything else, `0` and `false` included, means the narrowing
          was not asked for and tombstones stay in - a caller who cannot be understood
          sees too much, never silently nothing.
      - in: query
        name: after
        schema:
          type: string
        description: 'Keyset tiebreak: the `next_after` from the previous page, sent
          together with `since=<next>`. Returns rows strictly after that position
          in `(cursor, id)` order, so a page of rows sharing one timestamp cannot
          re-serve itself. Omitted or unparsable means no tiebreak: the inclusive
          `since` read, exactly as before (api/sync.paginate_keyset).'
      - in: query
        name: since
        schema:
          type: string
          format: date-time
        description: ISO-8601 UTC watermark. Returns rows with `updated_at >= since`,
          tombstones included, oldest first. **Omitted or unparsable means EVERYTHING,
          never nothing** (api/sync.parse_since), so a fresh client's first pull is
          the whole table. Hand back the `next` cursor from the previous page, or
          `server_time` from GET /api/changes; both are already `Z`-suffixed so they
          need no extra encoding.
      tags:
      - places
      security:
      - deviceToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedPlace'
          description: ''
  /api/places/{identity}/:
    put:
      operationId: api_places_update
      description: |-
        `PUT <table>/<identity>/`. Idempotent by construction: the
        identity comes from the URL, so a retry cannot make a second row.
        200 whether the row was created or updated - the caller asked for
        the row to exist in this state and it does, and which of the two
        happened is not something a retrying client can act on.
      parameters:
      - in: path
        name: identity
        schema:
          type: string
        description: The row's `label`.
        required: true
      tags:
      - places
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Place'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Place'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Place'
        required: true
      security:
      - deviceToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: 'The write was refused and NOTHING was written. Two body shapes
            occur and both are JSON objects: `{"detail": "..."}` for an unknown field,
            a database refusal or a hand-written check, and `{"<field>": ["..."]}`
            for a field-level validation error. Both carry text meant to be shown
            to a person.'
    delete:
      operationId: api_places_destroy
      description: |-
        `DELETE <table>/<identity>/`. Sets the tombstone column; the row
        stays, because a phone that has not synced since still needs to
        learn the row is gone. Idempotent - a second delete is still a 204,
        matching `EventsBackend.softDelete`'s own contract.
      parameters:
      - in: path
        name: identity
        schema:
          type: string
        description: The row's `label`.
        required: true
      tags:
      - places
      security:
      - deviceToken: []
      - cookieAuth: []
      responses:
        '204':
          description: Done. Soft-deleted (the tombstone row stays so an unsynced
            client learns of it).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: No such row. Nothing was changed.
  /api/places/{label}/rename/:
    post:
      operationId: api_places_rename
      description: |-
        `POST /api/places/<label>/rename/` - a new label for the same place.

        **Why a route of its own rather than a PUT plus a DELETE from the
        client** (voice audit 2026-10-09, finding 2): "rename Home to Katie House"
        was carried out as `forget_place` then `tag_place`, which deleted home
        with nothing said and then re-pinned wherever the phone happened to be.
        A rename keeps the coordinates and the address and changes nothing but
        the name, so it is one write the engine owns, in one transaction.

        `label` is this table's identity and every phone keys its replica by it,
        so the rename is written as the sync feed can carry it: the new label is
        upserted (reviving its own tombstone if it once existed) with the old
        row's coordinates and address, and the old label is tombstoned. A row
        updated in place would reach other phones as a new label with no
        tombstone for the old one, and they would keep both forever.

        Place-triggered reminders name a place by this string
        (`events.trigger_place_label`), so the live ones move with it, in the
        same transaction; `touch_updated_at` on `events` puts them in the feed.
      parameters:
      - in: path
        name: label
        schema:
          type: string
        required: true
      tags:
      - places
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceRenameRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PlaceRenameRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PlaceRenameRequest'
        required: true
      security:
      - deviceToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceRenameResult'
          description: Renamed. The old label is tombstoned, the new one carries the
            same coordinates and address, and live reminders on the old label moved.
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: 'The write was refused and NOTHING was written. Two body shapes
            occur and both are JSON objects: `{"detail": "..."}` for an unknown field,
            a database refusal or a hand-written check, and `{"<field>": ["..."]}`
            for a field-level validation error. Both carry text meant to be shown
            to a person.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: No such row. Nothing was changed.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: A live place already has the new label, or the two labels are
            the same. Nothing was renamed.
