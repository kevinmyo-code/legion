        required: true
      security:
      - deviceToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionMetadata'
          description: Stored, replacing any earlier login for this source and clearing
            `invalid_since`. The body is metadata only; the secret is not echoed.
        '400':
          description: 'Nothing was stored: `bofa` (never leaves the laptop), an unknown
            source, a secret of the wrong shape, anything naming a password, or a
            config key that names a secret. `detail` says which.'
        '403':
          description: 'Nothing was stored: the caller is not an owner.'
        '503':
          description: 'Nothing was stored: LEGION_VAULT_KEY is unset or invalid.'
  /api/ingest/statement:
    post:
      operationId: api_ingest_statement_create
      description: |-
