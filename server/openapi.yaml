  /api/voice_notes/:
    get:
      operationId: api_voice_notes_list
      description: |-
        `?since=<iso>` (tombstones included) and `?active=1` (live rows
        only). They compose: `?active=1&since=<iso>` is a live-rows-changed
        feed, and `?active=1` alone is every live row since the epoch.

        A missing `since` means EVERYTHING, never nothing - `api/sync.parse_since`
        holds that rule for the whole API and quotes the phone-side cursor
        comment it comes from.
      parameters:
      - in: query
        name: active
        schema:
          type: string
          enum:
          - '1'
          - 'on'
          - 'true'
          - 'yes'
        description: Narrows the feed to live rows (`deleted_at is null`). Composes
          with `since`. Anything else, `0` and `false` included, means the narrowing
          was not asked for and tombstones stay in - a caller who cannot be understood
          sees too much, never silently nothing.
      - in: query
        name: after
        schema:
          type: string
        description: 'Keyset tiebreak: the `next_after` from the previous page, sent
          together with `since=<next>`. Returns rows strictly after that position
          in `(cursor, id)` order, so a page of rows sharing one timestamp cannot
          re-serve itself. Omitted or unparsable means no tiebreak: the inclusive
          `since` read, exactly as before (api/sync.paginate_keyset).'
      - in: query
        name: since
        schema:
          type: string
          format: date-time
        description: ISO-8601 UTC watermark. Returns rows with `updated_at >= since`,
          tombstones included, oldest first. **Omitted or unparsable means EVERYTHING,
          never nothing** (api/sync.parse_since), so a fresh client's first pull is
          the whole table. Hand back the `next` cursor from the previous page, or
          `server_time` from GET /api/changes; both are already `Z`-suffixed so they
          need no extra encoding.
      tags:
      - voice_notes
      security:
      - deviceToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedVoiceNote'
          description: ''
    post:
      operationId: api_voice_notes_create
      description: |-
        `POST <table>/`. Routed only where the identity IS the primary
        key (voice notes) - everywhere else the client mints the identity
        and PUT is both create and update, so a second create path would be
        a second way to do one thing.
      tags:
      - voice_notes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceNote'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VoiceNote'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VoiceNote'
        required: true
      security:
      - deviceToken: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceNote'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: 'The write was refused and NOTHING was written. Two body shapes
            occur and both are JSON objects: `{"detail": "..."}` for an unknown field,
            a database refusal or a hand-written check, and `{"<field>": ["..."]}`
            for a field-level validation error. Both carry text meant to be shown
            to a person.'
  /api/voice_notes/{identity}/:
    put:
      operationId: api_voice_notes_update
      description: |-
        `PUT <table>/<identity>/`. Idempotent by construction: the
        identity comes from the URL, so a retry cannot make a second row.
        200 whether the row was created or updated - the caller asked for
        the row to exist in this state and it does, and which of the two
        happened is not something a retrying client can act on.
      parameters:
      - in: path
        name: identity
        schema:
          type: string
          format: uuid
        description: The row's `id`.
        required: true
      tags:
      - voice_notes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceNote'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VoiceNote'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VoiceNote'
        required: true
      security:
      - deviceToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceNote'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: 'The write was refused and NOTHING was written. Two body shapes
            occur and both are JSON objects: `{"detail": "..."}` for an unknown field,
            a database refusal or a hand-written check, and `{"<field>": ["..."]}`
            for a field-level validation error. Both carry text meant to be shown
            to a person.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: This identity is the server's own primary key, and it has not
            issued this one. Nothing was created. POST the collection instead.
    delete:
      operationId: api_voice_notes_destroy
      description: |-
        `DELETE <table>/<identity>/`. Sets the tombstone column; the row
        stays, because a phone that has not synced since still needs to
        learn the row is gone. Idempotent - a second delete is still a 204,
        matching `EventsBackend.softDelete`'s own contract.
      parameters:
      - in: path
        name: identity
        schema:
          type: string
          format: uuid
        description: The row's `id`.
        required: true
      tags:
      - voice_notes
      security:
      - deviceToken: []
      - cookieAuth: []
      responses:
        '204':
          description: Done. Soft-deleted (the tombstone row stays so an unsynced
            client learns of it).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: No such row. Nothing was changed.
  /health:
    get:
      operationId: health_retrieve
      description: |-
        `GET /healthz`. Unauthenticated on purpose - a load balancer or an
        uptime check has no device token - and it says exactly what it checked:
        whether the database answered a query, nothing more. Section 7's
        outcome-verb rule applies here too: 'ok' is never returned unless the
        query actually ran.
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: The database answered `SELECT 1`.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthError'
          description: The database did not answer. The body carries psycopg's own
            message.
  /healthz:
    get:
      operationId: healthz_retrieve
      description: |-
        `GET /healthz`. Unauthenticated on purpose - a load balancer or an
        uptime check has no device token - and it says exactly what it checked:
        whether the database answered a query, nothing more. Section 7's
        outcome-verb rule applies here too: 'ok' is never returned unless the
        query actually ran.
      tags:
