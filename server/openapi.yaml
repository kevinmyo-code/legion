      - origin_guid
      - provenance
      - target_sets_per_week
      - updated_at
    WorkoutSetLog:
      type: object
      description: |-
        No `source_list_item_id`. `WorkoutSetLog.sourceListItemId` names a
        phone-local Room row id from a table that has no server counterpart, so
        it would be a dangling reference here - the body migration's own comment
        on that table, and `RemoteWorkoutSetLog`'s, both say so.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        exercise:
          type: string
        sets:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        reps:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        weight_value:
          type: number
          format: double
          nullable: true
        weight_unit:
          type: string
          nullable: true
        logged_at:
          type: string
          format: date-time
        trust_tier:
          type: string
        provenance:
          allOf:
          - $ref: '#/components/schemas/ProvenanceEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        origin_guid:
          type: string
      required:
      - created_at
      - deleted_at
      - exercise
      - id
      - logged_at
      - origin_guid
      - provenance
      - sets
      - trust_tier
      - updated_at
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    deviceToken:
      type: apiKey
      in: header
      name: Authorization
      description: One token per device (phone, browser, future robot), revocable
        alone. Send the value as `Token <key>`, including the word Token and the space.
        Get a key from POST /api/auth/login; POST /api/auth/logout revokes only the
        key that made the request.
