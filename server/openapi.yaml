      - provenance
      - quantity
      - receipt_id
      - reversal_of
      - total_price_cents
      - unit_price_cents
    ServiceHistory:
      type: object
      description: |-
        Field-for-field `RemoteServiceHistory` / `ServiceHistoryUpload`.

        `kind` is the fleet aspect's own small provenance and is deliberately a
        separate column from `provenance`: provenance says how the ROW was
        produced, `kind` says how the EVENT was witnessed. OBSERVED means LEGION
        saw it or read it from a document; ASSERTED means the driver said so with
        no independent evidence. A client rendering a service record must not
        collapse the two, for the same reason section 4 rule 5 will not let an
        estimate be shown as a measurement.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        vehicle_id:
          type: string
          format: uuid
        service_name:
          type: string
        mileage:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        service_date:
          type: string
          format: date
          nullable: true
        cost_cents:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
          description: In cents (CLAUDE.md section 4 rule 3), or null when no figure
            was recorded. Unlike `build_entries.cost_cents` this column carries no
            non-negative CHECK on the live schema, so none is invented here.
        kind:
          type: string
          description: OBSERVED means LEGION saw it happen or read it from a document;
            ASSERTED means the driver said so, with no independent evidence. NOT the
            same axis as `provenance`, which says how the row was produced rather
            than how the event was witnessed.
        provenance:
          allOf:
          - $ref: '#/components/schemas/ProvenanceEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        origin_guid:
          type: string
          nullable: true
      required:
      - created_at
      - deleted_at
      - id
      - kind
      - provenance
      - service_name
      - updated_at
      - vehicle_id
    SessionLoginRequest:
      type: object
      description: |-
        `POST /api/auth/session/login`. No `device_name` - a browser session
        is not a device token (ADR 0044 rule 3: different credentials, different
        revocation stories) and mints none.
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    SleepLog:
      type: object
      description: |-
        Base for every serializer this viewset drives.

        Two behaviours, both ticket 04's own text:

        1. **Unknown fields are refused, never dropped.** "A limb sending a
           column the server does not know is a version skew, and it says so
           with a 400 naming the field, never a silent drop." A phone one
           release ahead, writing a column this server has never heard of,
           must be told - a silent drop would look exactly like a successful
           write and lose the value.
        2. **The server facts are the server's.** `id`, `provenance`,
           `created_at`, `updated_at` and `deleted_at` are read-only on every
           subclass; `deleted_at` moves only via DELETE, `updated_at` only via
           the `touch_updated_at` trigger.

        Subclasses set `Meta.model` / `Meta.fields` and, where the table's
        `provenance` column is not the shared `USER` default,
        `default_provenance`.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        sleep_date:
          type: string
          format: date
        duration_minutes:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        quality:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        notes:
          type: string
          nullable: true
        logged_at:
          type: string
          format: date-time
        trust_tier:
          type: string
        provenance:
          allOf:
          - $ref: '#/components/schemas/ProvenanceEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        origin_guid:
          type: string
      required:
      - created_at
      - deleted_at
      - duration_minutes
      - id
      - logged_at
      - origin_guid
      - provenance
      - sleep_date
      - trust_tier
      - updated_at
    SleepTarget:
