          type: string
          format: date-time
          nullable: true
        provenance:
          allOf:
          - $ref: '#/components/schemas/ProvenanceEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        origin_guid:
          type: string
          nullable: true
        archived:
          type: boolean
          default: false
        last_obd_mac:
          type: string
          nullable: true
          description: 'The MAC of the OBD dongle this car was last seen on. A best-effort
            rebuild HINT, never an identity: a car that changed dongles carries its
            old value here until the next sync, and nothing may be assigned on the
            strength of it alone.'
        plate:
          type: string
          nullable: true
          description: The licence plate, ordinary data (not an ID-vault item). Trimmed
            and upper-cased; at most 16 characters. Omit it to leave the stored plate
            as is; send null to clear it.
