<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The scaffold's Vite-logo favicon is gone: shipping someone else's mark
         as LEGION's is a small untruth on a page anyone can load. These are the
         placeholder icons `scripts/make_icons.py` generates; ticket 05 owns the
         real mark. -->
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Matches the manifest's theme_color, which is DeckChrome from the
         phone's palette (app/.../ui/theme/Color.kt). Stated here as well so
         the browser tints correctly on the first paint, before the manifest
         has been fetched. -->
    <meta name="theme-color" content="#FF5330" />
    <title>LEGION</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
