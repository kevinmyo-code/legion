# Keeps a free-tier Supabase project from pausing.
#
# Why this is not on the phone. The free tier pauses after roughly a week with no user database
# activity, and ticket 01 ruling 8 removed the offline write queue, so a paused project is a hard
# outage rather than a degraded mode. A phone-side ping cannot solve that: it only runs when the
# app is opened, and an opened app is already producing activity. The week that matters is the one
# where nobody touches the app at all - a holiday, a lost phone - which is exactly when a
# lifecycle-driven or AlarmManager-driven ping is not running either.
#
# So the ping has to come from somewhere that is awake regardless of any device. A scheduled
# workflow in this repo is free, versioned next to the code that depends on it, and genuinely
# external to the project it is pinging.
#
# Clone-and-run: a stranger forks this repo, adds their OWN two secrets, and it works against their
# own project. Nothing here is specific to Kevin's. If the secrets are absent the job exits
# successfully with a message rather than failing, so a fork that has not set them up does not
# accumulate red runs.
#
# Setup (once), Settings -> Secrets and variables -> Actions:
#   SUPABASE_URL       https://<project-ref>.supabase.co
#   SUPABASE_ANON_KEY  the project's anon/public key
# The anon key is designed to be public and is safe in a client, but it is kept in secrets anyway
# so a fork cannot accidentally hammer the original project.

name: Supabase keep-alive

on:
  schedule:
    # 07:00 UTC daily. Cron on GitHub Actions is best-effort and can be delayed under load, which
    # is fine: the pause threshold is about a week and this runs every day, so several consecutive
    # misses are survivable.
    - cron: '0 7 * * *'
  # Manual trigger, for verifying setup without waiting a day.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the project
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "SUPABASE_URL or SUPABASE_ANON_KEY is not set; nothing to ping."
            echo "This is expected on a fork that has not configured its own project."
            exit 0
          fi

          # /rest/v1/rpc/keepalive is created by
          # supabase/migrations/20260825000100_household_and_rls.sql. It returns the server clock
          # and touches no data; the point is only that a real query reaches the database.
          status=$(curl --silent --show-error --location \
            --output /tmp/keepalive-body.txt \
            --write-out '%{http_code}' \
            --max-time 30 \
            --request POST \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "${SUPABASE_URL}/rest/v1/rpc/keepalive")

          echo "HTTP ${status}"
          echo "Response: $(cat /tmp/keepalive-body.txt)"

          # A paused project answers with a 5xx or a gateway error rather than a clean 200, so a
          # non-2xx here is the signal that someone needs to open the dashboard and click Resume.
          # Fail loudly: a keep-alive that reports success while the project is down would be
          # reporting safety it is not providing, which is the exact failure ticket 04 named.
          case "${status}" in
            2*) echo "Project is awake." ;;
            *)  echo "::error::Supabase did not answer with 2xx (got ${status}). The project may be paused; check the dashboard."
                exit 1 ;;
          esac
