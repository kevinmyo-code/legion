# Build, check and publish a phone release from GitHub (cloud-builds plan step 5, 2026-11-20).
# workflow_dispatch ONLY, from `dev` only (the production environment's branch policy, and checked
# again below): nothing builds, signs or publishes on a push, a pull request or a fork.
#
# Two runs, in this order (dry run first, always):
#
#   1. DRY RUN (dry_run ticked, the default). Builds commit `sha`, signs it with the pinned debug key,
#      runs every check the laptop ship runs, and keeps the APK and its sha256 as the run artifact
#      `phone-apk-<sha>`. It uploads NOTHING to the APK bucket and records nothing on the engine; its
#      only network reads are the speaker model (private bucket or official download, as
#      app/speaker-model.pin says), the licence text and one GET of the newest release.
#      `sha` may be on `dev` or on a `ship/**` branch of this repo (so a ship can build before dev
#      moves), never anywhere else.
#   2. PUBLISH (dry_run unticked). Builds nothing and touches no signing key: it takes the artifact
#      of the newest successful dry run for the same `sha`, checks its sha256, runs the same checks
#      again, then `tools/release_apk.py` uploads it and records the release (the phone offers it on
#      its next check). `sha` must already be on `dev` (the ship moved dev first).
#
# Checks (dry run, and again before a publish): the inputs; `sha` reachable from dev or ship/**; the
# committed models against app/models.sha256 (Gradle `verifyModels`); the speaker model and its
# licence text against app/speaker-model.pin (release_ok=no: the INTERIM copy that ships on the phone
# today, from the private bucket; yes: the official download; no APK builds without one); the
# keystore's fingerprint against
# deploy/release/signer.sha256 before Gradle sees it; then on the APK (.github/scripts/
# check_phone_apk.py and `release_apk.py --dry-run`): signer pin, package, no baked Gemini/AirNow
# key, the Mapbox token is the public pk. token and no sk. token anywhere, every pinned model in the
# APK byte for byte, versionName ends with the sha, versionCode above the newest published release.
#
# The artifact: the repo is public, so any signed-in GitHub user can download it for its retention
# (1 day: a ship takes it within the hour). It holds what the repo already publishes (code, the
# committed models), the speaker model (while release_ok=no, the interim copy whose origin is
# unproven: that file is NOT committed, but this artifact does carry it for a day) and the public
# Mapbox pk. token; no key. It is signed with the debug key; a signed APK does not reveal the key.
#
# Setup (environment `production`, the same one ship.yml uses; deploy/cloudrun/README.md
# "Shipping from GitHub" and deploy/cloudrun/github_setup.sh do the Google side). Unchanged by
# this file: variables GCP_WIF_PROVIDER, GCP_SHIP_SERVICE_ACCOUNT, LEGION_ENGINE_URL,
# LEGION_APK_BUCKET, MAPBOX_ACCESS_TOKEN; secrets PHONE_DEBUG_KEYSTORE_B64 (the laptop's
# ~/.android/debug.keystore, base64) and LEGION_ENGINE_TOKEN (an owner device token named for this
# job; revoke it from the web's devices list and the next publish fails at the engine step).
name: Release phone

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to build (full 40-hex sha, on dev or a ship/** branch; on dev to publish)"
        required: true
        type: string
      dry_run:
        description: "Dry run: build, check, keep the APK as an artifact; publish nothing"
        required: true
        default: true
        type: boolean
      notes:
        description: "Publish only: what the phone shows in the update offer"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read     # the publish run reads the dry run's artifact
  id-token: write   # the OIDC token Workload Identity Federation exchanges (publish only)

concurrency:
  group: release-phone
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production   # its protection rules (reviewer, dev-only branch policy) apply here
    timeout-minutes: 60
    env:
      JAVA_TOOL_OPTIONS: -Duser.language=en -Duser.country=US
      SHA: ${{ inputs.sha }}
      DRY: ${{ inputs.dry_run }}
    steps:
      - name: Check the inputs and where this run comes from
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be 40 lowercase hex characters. Nothing was built or published."; exit 1; }
          [ "$GITHUB_REF" = refs/heads/dev ] || { echo "::error::Dispatch this from dev (got $GITHUB_REF). Nothing was built or published."; exit 1; }
          [ "$GITHUB_REPOSITORY" = kevinmyo-code/legion ] || { echo "::error::Runs only in kevinmyo-code/legion. Nothing was built or published."; exit 1; }
          if [ "$DRY" != "true" ] && [ -z "${NOTES// /}" ]; then
            echo "::error::A publish needs notes. Nothing was published."; exit 1
          fi
          echo "sha $SHA; dry run: $DRY"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: The commit is on dev or a ship/** branch (on dev to publish)
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$SHA" ] || { echo "::error::checkout is not at $SHA"; exit 1; }
          on=$(git branch -r --contains "$SHA" --format='%(refname:short)' | grep -E '^origin/(dev|ship/.+)$' || true)
          [ -n "$on" ] || { echo "::error::$SHA is on neither origin/dev nor an origin/ship/** branch. Nothing was built or published."; exit 1; }
          echo "on: $(echo $on)"
          if [ "$DRY" != "true" ]; then
            git merge-base --is-ancestor "$SHA" origin/dev || { echo "::error::A publish needs $SHA on dev first (the ship moves dev, then publishes). Nothing was published."; exit 1; }
          fi

      # Keyless Google sign-in (Workload Identity Federation, production environment only): the dry run
      # reads the interim speaker model from the private bucket, the publish uploads the APK.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SHIP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # ---------------------------------------------------------------- dry run: build and check
      - name: Speaker model (app/speaker-model.pin decides which file; a missing or wrong one stops here)
        if: inputs.dry_run
        env:
          LEGION_APK_BUCKET: ${{ vars.LEGION_APK_BUCKET }}
        run: bash .github/scripts/fetch_speaker_model.sh --install

      - name: Set up JDK 17
        if: inputs.dry_run
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # local.properties is gitignored; the runner ships the Android SDK. Only sdk.dir goes in, so
      # no Gemini or AirNow key can be baked.
      - name: Point local.properties at the runner's SDK
        if: inputs.dry_run
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          [ -n "${sdk}" ] || { echo "::error::Neither ANDROID_SDK_ROOT nor ANDROID_HOME is set."; exit 1; }
          echo "sdk.dir=${sdk}" > local.properties

      - name: Make the Gradle wrapper executable
        if: inputs.dry_run
        run: chmod +x gradlew

      - name: Set up Gradle
        if: inputs.dry_run
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Committed models match app/models.sha256
        if: inputs.dry_run
        run: ./gradlew :app:verifyModels --no-daemon

      - name: Signing key
        if: inputs.dry_run
        env:
          KEYSTORE_B64: ${{ secrets.PHONE_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_B64" ] || { echo "::error::Secret PHONE_DEBUG_KEYSTORE_B64 is not set. Nothing was built or published; see this file's header."; exit 1; }
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
          # The debug key's passwords are Android's public defaults; only the key itself is secret.
          got=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey \
            | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | tr -d ':' | tr 'A-F' 'a-f')
          want=$(tr -d '[:space:]' < deploy/release/signer.sha256)
          [ "$got" = "$want" ] || { echo "::error::The keystore in PHONE_DEBUG_KEYSTORE_B64 is not the pinned key (got ${got:0:12}..., want ${want:0:12}...). Nothing was built or published."; exit 1; }
          echo "signing key matches deploy/release/signer.sha256"

      - name: Build the fast APK
        if: inputs.dry_run
        env:
          MAPBOX_TOKEN: ${{ vars.MAPBOX_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          args=(:app:assembleFast --no-daemon
            "-Pandroid.injected.signing.store.file=$HOME/.android/debug.keystore"
            -Pandroid.injected.signing.store.password=android
            -Pandroid.injected.signing.key.alias=androiddebugkey
            -Pandroid.injected.signing.key.password=android)
          if [ -n "$MAPBOX_TOKEN" ]; then
            args+=("-PMAPBOX_ACCESS_TOKEN=$MAPBOX_TOKEN")
          else
            echo "::warning::MAPBOX_ACCESS_TOKEN is not set: navigation will say it is not set up unless a token is pasted on the phone."
          fi
          ./gradlew "${args[@]}"
          mkdir -p out
          cp app/build/outputs/apk/fast/app-fast.apk "out/legion-phone-${SHA}.apk"

      - name: Forget the signing key
        if: always()
        run: rm -f "$HOME/.android/debug.keystore"

      # ---------------------------------------------------------------- publish: the dry run's APK
      - name: Take the APK from the newest successful dry run of this commit
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="phone-apk-${SHA}"
          run_id=""
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$name&per_page=20" \
                        --jq '.artifacts | sort_by(.created_at) | reverse | .[] | select(.expired | not) | .workflow_run.id'); do
            read -r path branch concl < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq '[.path, .head_branch, .conclusion] | @tsv')
            if [ "$path" = .github/workflows/release-phone.yml ] && [ "$branch" = dev ] && [ "$concl" = success ]; then
              run_id=$id; break
            fi
          done
          [ -n "$run_id" ] || { echo "::error::No successful dry run of $SHA with an unexpired $name artifact. Run the dry run first. Nothing was published."; exit 1; }
          echo "dry run $run_id: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id"
          gh run download "$run_id" -R "$GITHUB_REPOSITORY" -n "$name" -D out
          (cd out && sha256sum -c "legion-phone-${SHA}.apk.sha256") || { echo "::error::the artifact's APK does not match its sha256 file. Nothing was published."; exit 1; }

      # ---------------------------------------------------------------- both: the checks on the APK
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Newest published phone release (read only)
        env:
          LEGION_ENGINE_URL: ${{ vars.LEGION_ENGINE_URL }}
          LEGION_ENGINE_TOKEN: ${{ secrets.LEGION_ENGINE_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$LEGION_ENGINE_URL" ] && [ -n "$LEGION_ENGINE_TOKEN" ] || { echo "::error::LEGION_ENGINE_URL or LEGION_ENGINE_TOKEN is not set. Nothing was published."; exit 1; }
          code=$(curl -sS -o latest.json -w '%{http_code}' -H "Authorization: Token $LEGION_ENGINE_TOKEN" "$LEGION_ENGINE_URL/api/releases/latest?app=phone")
          case "$code" in
            200) vc=$(python -c "import json;print(int(json.load(open('latest.json'))['version_code']))");;
            404) vc=0;;
            *) echo "::error::the engine answered $code for the newest release. Nothing was published."; exit 1;;
          esac
          rm -f latest.json
          echo "newest published phone versionCode: $vc"
          echo "NEWEST_VC=$vc" >> "$GITHUB_ENV"

      - name: APK checks (models, speaker, Mapbox token, version)
        run: python .github/scripts/check_phone_apk.py --apk "out/legion-phone-${SHA}.apk" --sha "$SHA" --newest-vc "$NEWEST_VC"

      - name: Signer pin, package, no baked keys (release_apk.py --dry-run; nothing uploaded)
        run: python tools/release_apk.py --app phone --apk "out/legion-phone-${SHA}.apk" --notes "dry run" --dry-run

      - name: Keep the APK and its sha256 (the dry run's output)
        if: inputs.dry_run
        run: (cd out && sha256sum "legion-phone-${SHA}.apk" > "legion-phone-${SHA}.apk.sha256" && cat "legion-phone-${SHA}.apk.sha256")

      - uses: actions/upload-artifact@v4
        if: inputs.dry_run
        with:
          name: phone-apk-${{ inputs.sha }}
          path: |
            out/legion-phone-${{ inputs.sha }}.apk
            out/legion-phone-${{ inputs.sha }}.apk.sha256
          if-no-files-found: error
          retention-days: 1

      # ---------------------------------------------------------------- publish only
      - name: Publish (tools/release_apk.py)
        if: ${{ !inputs.dry_run }}
        env:
          NOTES: ${{ inputs.notes }}
          LEGION_ENGINE_URL: ${{ vars.LEGION_ENGINE_URL }}
          LEGION_APK_BUCKET: ${{ vars.LEGION_APK_BUCKET }}
          LEGION_ENGINE_TOKEN: ${{ secrets.LEGION_ENGINE_TOKEN }}
        run: python tools/release_apk.py --app phone --apk "out/legion-phone-${SHA}.apk" --notes "$NOTES"
