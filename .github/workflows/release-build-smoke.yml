# Release build smoke (2026-11-20, after release-phone dry run 44856938727 ran out of Gradle heap in
# lint-vital). Builds the phone's `:app:assembleFast` exactly as release-phone.yml's build job does (same
# JDK, same Gradle flags and heap, same official speaker model, same model and APK checks) but with NO
# secret and NO environment: it signs with a throwaway debug key made in the job, bakes no Mapbox token,
# and keeps nothing (no artifact). So a heap, JDK or Gradle change to the release build is proven here,
# on a push, before anyone is asked to approve a Production run.
# It also prints the runner's memory and the peak "used" memory during the build.
name: Release build smoke

on:
  push:
    branches: [dev, main, 'up/**', 'ci/**']
    paths:
      - '.github/workflows/release-phone.yml'
      - '.github/workflows/release-build-smoke.yml'
      - 'gradle.properties'
      - 'gradle/**'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: assembleFast as release-phone builds it (no secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JAVA_TOOL_OPTIONS: -Duser.language=en -Duser.country=US
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Speaker model (the official file, as release-phone)
        run: bash .github/scripts/fetch_speaker_model.sh --install

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Point local.properties at the runner's SDK
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          [ -n "${sdk}" ] || { echo "::error::Neither ANDROID_SDK_ROOT nor ANDROID_HOME is set."; exit 1; }
          echo "sdk.dir=${sdk}" > local.properties
          chmod +x gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4 (v4.4.3)
        with:
          cache-read-only: true

      - name: Committed models match app/models.sha256
        run: ./gradlew :app:verifyModels --no-daemon

      - name: A throwaway debug key (not the real one; nothing signed here is kept)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/smoke"
          keytool -genkeypair -keystore "$RUNNER_TEMP/smoke/debug.keystore" -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 1 -dname "CN=smoke" >/dev/null 2>&1

      - name: Build the fast APK (release-phone's flags and heap), with a memory sampler
        run: |
          set -euo pipefail
          free -m | sed -n '1,2p'
          ( while :; do free -m | awk '/^Mem:/{print $3}' >> "$RUNNER_TEMP/smoke/mem.txt"; sleep 5; done ) &
          sampler=$!
          set +e
          ./gradlew :app:assembleFast --no-daemon \
            "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8" \
            "-Pandroid.injected.signing.store.file=$RUNNER_TEMP/smoke/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android
          rc=$?
          set -e
          kill "$sampler" || true
          echo "peak used memory during the build: $(sort -n "$RUNNER_TEMP/smoke/mem.txt" | tail -1) MB (sampled every 5 s)"
          [ "$rc" = 0 ] || exit "$rc"
          ls -l app/build/outputs/apk/fast/

      - name: Stop anything Gradle left running; forget the throwaway key
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/smoke/debug.keystore"
          ./gradlew --stop >/dev/null 2>&1 || true
          pkill -f 'GradleDaemon|KotlinCompileDaemon' || true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: APK checks (models, speaker, Mapbox token, version name), as release-phone
        run: python .github/scripts/check_phone_apk.py --apk app/build/outputs/apk/fast/app-fast.apk --sha "$GITHUB_SHA"
