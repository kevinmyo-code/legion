# Ship one commit of the engine from GitHub, by hand only (architecture review Q6).
#
# workflow_dispatch ONLY: nothing ships on a push. Kevin clicks "Run workflow", gives the commit,
# and leaves "dry run" ticked for the plan or unticks it to ship. Same tool as the laptop:
# deploy/ship.py, with --no-worker (the Claude worker lives on the laptop) and no APK (the phone
# build is made and published on the laptop).
#
# Auth is Workload Identity Federation: no JSON key exists anywhere. The setup Kevin does once is in
# deploy/cloudrun/README.md, "Shipping from GitHub (Workload Identity Federation)". Until it is
# done this workflow fails at the auth step and changes nothing.
name: Ship

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to ship (full 40-hex SHA; must fast-forward dev and main)"
        required: true
        type: string
      dry_run:
        description: "Dry run: read-only checks and the plan, nothing changes"
        required: true
        default: true
        type: boolean

permissions:
  contents: write   # fast-forward push of dev and main to the shipped commit
  id-token: write   # the OIDC token Workload Identity Federation exchanges

concurrency:
  group: ship
  cancel-in-progress: false

jobs:
  ship:
    runs-on: ubuntu-latest
    environment: production   # protection rules (required reviewer) live on this environment
    timeout-minutes: 45
    steps:
      - name: Check the input is a full SHA
        env:
          SHA: ${{ inputs.sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be 40 lowercase hex characters"; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SHIP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ship.py's one dependency
        run: python -m pip install --quiet pyyaml==6.0.3

      - name: Site config (non-secret .env, kept as an environment secret because it holds a contact address)
        env:
          CLOUDRUN_ENV: ${{ secrets.CLOUDRUN_ENV }}
        run: |
          [ -n "$CLOUDRUN_ENV" ] || { echo "environment secret CLOUDRUN_ENV is not set; see deploy/cloudrun/README.md"; exit 1; }
          printf '%s\n' "$CLOUDRUN_ENV" > deploy/cloudrun/.env

      - name: Ship
        env:
          SHA: ${{ inputs.sha }}
          DRY: ${{ inputs.dry_run }}
          GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          args=(--sha "$SHA" --deploy-tree . --no-worker --records "$RUNNER_TEMP/ships")
          [ "$DRY" = "true" ] && args+=(--dry-run)
          python deploy/ship.py "${args[@]}"

      - name: Keep the rollback record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ship-records-${{ inputs.sha }}
          path: ${{ runner.temp }}/ships
          if-no-files-found: ignore
          retention-days: 90
