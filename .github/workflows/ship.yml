# Ship the engine from GitHub, by hand only (cloud-builds step 2, 2026-11-21). It does what the laptop
# ship_engine_*_1121.sh scripts do, in three jobs:
#
#   checks   no credentials: the inputs, dev = main = sha (this workflow pushes NOTHING: dev and main are
#            already at the commit; the owner's merge put them there), CI green for that exact commit,
#            the cloud engine gate run for it (gates.yml, verified the way release-phone verifies its
#            phone gate), the scope (every changed image file pinned by path and blob, frozen files
#            unchanged, schema files added only and never destructive: deploy/ship_checks.py).
#   rehearse only when the ship adds schema files: on a throwaway Postgres, the LIVE code keeps serving on
#            the NEW schema (deploy/rehearse_old_on_new.sh, each side in its own environment).
#   deploy   the production environment (one approval tap): live state and switch checks, the deploy
#            window, deploy.py --ci then deploy_job.py --ci, confirmation, probes, the error log, the
#            rollback text (deploy/ship_engine_deploy.sh). dry_run stops after the read-only checks.
#
# Dispatch from dev only (Run workflow, branch dev), with sha = dev's tip. Auth is Workload Identity
# Federation (no key anywhere); the deploy identity and its roles: deploy/cloudrun/README.md.
# deploy/ship.py is not used by this workflow.
name: Ship engine

run-name: "Ship engine ${{ inputs.dry_run && 'DRY RUN' || 'DEPLOY' }} ${{ inputs.sha }} over ${{ inputs.expect_live_rev }}, gates ${{ inputs.gates_run_id }}"

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to ship: full 40-hex SHA, must be dev's tip and main's (the run's own commit)"
        required: true
        type: string
      live_code:
        description: "Full SHA of the code the live revision runs (proven by hand, never from a label)"
        required: true
        type: string
      expect_live_rev:
        description: "The live revision now, e.g. legion-00106-sjm (must hold 100% of the traffic)"
        required: true
        type: string
      gates_run_id:
        description: "Run id of a passed gates.yml run (engine or all) for this sha"
        required: true
        type: string
      image_files:
        description: "Every changed file under server/ and deploy/ as path:blob, space separated"
        required: true
        type: string
      migrations:
        description: "Each added schema file as path:blob, space separated (empty: none)"
        required: false
        default: ""
        type: string
      expected_extras:
        description: "The gate's extra checks this ship relies on, e.g. realrun_web_carry_checks (empty: none)"
        required: false
        default: ""
        type: string
      extra_unset:
        description: "More env names that must stay unset (adds to the fixed list; cannot remove any)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Dry run: every check and the plan, nothing built or deployed"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ship-engine
  cancel-in-progress: false

env:
  SHA: ${{ inputs.sha }}
  LIVE_CODE: ${{ inputs.live_code }}
  EXPECT_LIVE_REV: ${{ inputs.expect_live_rev }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      has_migrations: ${{ steps.scope.outputs.has_migrations }}
      switches: ${{ steps.scope.outputs.switches }}
    steps:
      - name: The inputs, and the run is a dispatch of dev at sha
        env:
          GATES_RUN_ID: ${{ inputs.gates_run_id }}
          IMAGE_FILES: ${{ inputs.image_files }}
          MIGRATIONS: ${{ inputs.migrations }}
          EXTRAS: ${{ inputs.expected_extras }}
          EXTRA_UNSET: ${{ inputs.extra_unset }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be 40 lowercase hex characters"; exit 1; }
          [[ "$LIVE_CODE" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::live_code must be 40 lowercase hex characters"; exit 1; }
          [[ "$EXPECT_LIVE_REV" =~ ^legion-[0-9]{5}-[a-z0-9]{3}$ ]] || { echo "::error::expect_live_rev must look like legion-00106-sjm"; exit 1; }
          [[ "$GATES_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::gates_run_id must be a run id"; exit 1; }
          [[ "$IMAGE_FILES" =~ ^[A-Za-z0-9_./:\ -]+$ ]] || { echo "::error::image_files: path:blob pairs only"; exit 1; }
          [[ "$MIGRATIONS" =~ ^[A-Za-z0-9_./:\ -]*$ ]] || { echo "::error::migrations: path:blob pairs only"; exit 1; }
          [[ "$EXTRAS" =~ ^[a-z0-9_,\ ]*$ ]] || { echo "::error::expected_extras: check names only"; exit 1; }
          [[ "$EXTRA_UNSET" =~ ^[A-Z0-9_,\ ]*$ ]] || { echo "::error::extra_unset: env names only"; exit 1; }
          [ "$GITHUB_REF" = refs/heads/dev ] || { echo "::error::dispatch from dev (this run is on $GITHUB_REF)"; exit 1; }
          [ "$GITHUB_SHA" = "$SHA" ] || { echo "::error::sha $SHA is not the run's own commit $GITHUB_SHA (dev moved, or the wrong sha)"; exit 1; }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: dev and main are both at sha
        run: |
          git fetch -q origin dev main
          [ "$(git rev-parse origin/dev)" = "$SHA" ] || { echo "::error::dev is $(git rev-parse origin/dev), not $SHA"; exit 1; }
          [ "$(git rev-parse origin/main)" = "$SHA" ] || { echo "::error::main is $(git rev-parse origin/main), not $SHA: merge dev into main first (fast-forward)"; exit 1; }
          echo "dev = main = $SHA"

      - name: CI green for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Each CI workflow that ran on sha (push), judged by its newest run (a passed re-run supersedes a
          # failed one): every one must be green, and the server suite must be one of them.
          newest=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA&event=push&per_page=100" \
            --jq '[.workflow_runs[] | select(.path | test("workflows/(server|frontend|android|headunit)\\.yml$"))] | group_by(.path)[] | max_by(.run_started_at) | [.path, (.conclusion // .status)] | @tsv')
          echo "$newest"
          printf '%s\n' "$newest" | grep -qP '^\.github/workflows/server\.yml\tsuccess$' \
            || { echo "::error::no successful server.yml push run on $SHA"; exit 1; }
          not_green=$(printf '%s\n' "$newest" | awk -F'\t' 'NF && $2!="success"')
          [ -z "$not_green" ] || { echo "::error::not green on $SHA: $not_green"; exit 1; }
          echo "CI green on $SHA"

      - name: The cloud engine gate for this sha
        env:
          GH_TOKEN: ${{ github.token }}
          GATES_RUN_ID: ${{ inputs.gates_run_id }}
          EXTRAS: ${{ inputs.expected_extras }}
        run: |
          read -r path event repo branch title concl attempt < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GATES_RUN_ID" \
            --jq '[.path, .event, .head_repository.full_name, .head_branch, (.display_title | gsub(" "; "_")), .conclusion, .run_attempt] | @tsv')
          [ "$path" = .github/workflows/gates.yml ] || { echo "::error::run $GATES_RUN_ID is $path, not gates.yml"; exit 1; }
          [ "$event" = workflow_dispatch ] && [ "$repo" = "$GITHUB_REPOSITORY" ] && [ "$branch" = dev ] \
            || { echo "::error::run $GATES_RUN_ID is not a dispatch from dev in this repo ($event, $repo, $branch)"; exit 1; }
          [ "$concl" = success ] || { echo "::error::gates run $GATES_RUN_ID concluded $concl"; exit 1; }
          engine=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GATES_RUN_ID/jobs" --jq '[.jobs[] | select(.name | startswith("engine"))] | .[0].conclusion')
          [ "$engine" = success ] || { echo "::error::the engine job of gates run $GATES_RUN_ID is $engine"; exit 1; }
          gh run download "$GATES_RUN_ID" -R "$GITHUB_REPOSITORY" -n "gates-engine-$SHA" -D "$RUNNER_TEMP/gatecard" \
            || { echo "::error::gates run $GATES_RUN_ID kept no engine scorecard for $SHA"; exit 1; }
          cat "$RUNNER_TEMP/gatecard/engine-summary.txt"
          python3 deploy/ship_checks.py gate --summary "$RUNNER_TEMP/gatecard/engine-summary.txt" \
            --title "${title//_/ }" --attempt "$attempt" --fix "$SHA" --expected-extras "$EXTRAS"

      - name: Scope (pinned image files, frozen files, schema files)
        id: scope
        env:
          IMAGE_FILES: ${{ inputs.image_files }}
          MIGRATIONS: ${{ inputs.migrations }}
          EXTRA_UNSET: ${{ inputs.extra_unset }}
        run: |
          printf '%s\n' $IMAGE_FILES | sed 's/:\([0-9a-f]\{40\}\)$/ \1/' > "$RUNNER_TEMP/image-files.txt"
          printf '%s\n' $MIGRATIONS | sed 's/:\([0-9a-f]\{40\}\)$/ \1/' | awk 'NF' > "$RUNNER_TEMP/migrations.txt"
          python3 deploy/ship_checks.py scope --fix "$SHA" --live-code "$LIVE_CODE" \
            --image-files "$RUNNER_TEMP/image-files.txt" --migrations "$RUNNER_TEMP/migrations.txt"
          echo "has_migrations=$([ -s "$RUNNER_TEMP/migrations.txt" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "switches=$(python3 deploy/ship_checks.py switches --extra "$EXTRA_UNSET")" >> "$GITHUB_OUTPUT"

  rehearse:
    needs: checks
    if: ${{ needs.checks.outputs.has_migrations == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Two environments, each from its own commit's requirements (review S6)
        run: |
          git show "$LIVE_CODE:server/requirements.txt" > "$RUNNER_TEMP/req-old.txt"
          git show "$SHA:server/requirements.txt" > "$RUNNER_TEMP/req-new.txt"
          uv venv -q --python 3.13 "$RUNNER_TEMP/venv-old" && VIRTUAL_ENV="$RUNNER_TEMP/venv-old" uv pip install -q -r "$RUNNER_TEMP/req-old.txt"
          uv venv -q --python 3.13 "$RUNNER_TEMP/venv-new" && VIRTUAL_ENV="$RUNNER_TEMP/venv-new" uv pip install -q -r "$RUNNER_TEMP/req-new.txt"

      - name: Old code on the new schema (throwaway Postgres)
        env:
          PGURL: postgres://postgres:postgres@localhost:5432
        run: |
          PY_OLD="$RUNNER_TEMP/venv-old/bin/python" PY_NEW="$RUNNER_TEMP/venv-new/bin/python" \
            bash deploy/rehearse_old_on_new.sh "$LIVE_CODE" "$SHA"

  deploy:
    needs: [checks, rehearse]
    if: ${{ !cancelled() && needs.checks.result == 'success' && (needs.rehearse.result == 'success' || needs.rehearse.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: production   # the required reviewer's one tap; the Google login only works here
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SHIP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Site config (the CLOUDRUN_ENV environment secret)
        env:
          CLOUDRUN_ENV: ${{ secrets.CLOUDRUN_ENV }}
        run: |
          [ -n "$CLOUDRUN_ENV" ] || { echo "::error::environment secret CLOUDRUN_ENV is not set"; exit 1; }
          printf '%s\n' "$CLOUDRUN_ENV" > deploy/cloudrun/.env

      - name: Ship
        env:
          FIX: ${{ inputs.sha }}
          SWITCHES: ${{ needs.checks.outputs.switches }}
          MIGRATIONS_IN: ${{ inputs.migrations }}
          DRY: ${{ inputs.dry_run }}
          PROJECT: ${{ vars.GCP_PROJECT }}
          REGION: us-south1
          SERVICE: legion
          JOB: legion-worker
          ENGINE_URL: ${{ vars.LEGION_ENGINE_URL }}
          LEGION_ENGINE_TOKEN: ${{ secrets.LEGION_ENGINE_TOKEN }}
        run: |
          [ -n "$PROJECT" ] && [ -n "$ENGINE_URL" ] || { echo "::error::vars GCP_PROJECT and LEGION_ENGINE_URL must be set on the repo"; exit 1; }
          printf '%s\n' $MIGRATIONS_IN | sed 's/:\([0-9a-f]\{40\}\)$/ \1/' | awk 'NF' > "$RUNNER_TEMP/migrations.txt"
          MIGRATIONS="$RUNNER_TEMP/migrations.txt" bash deploy/ship_engine_deploy.sh
