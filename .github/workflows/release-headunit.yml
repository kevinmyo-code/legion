# Build, check and publish a head unit release from GitHub (cloud-builds plan step 8, 2026-11-20),
# modelled on release-phone.yml. workflow_dispatch ONLY, from `dev` only (the production environment's
# branch policy, and checked again below): nothing builds, signs or publishes on a push, a pull request
# or a fork. The head unit has no ADB: it installs an update by OTA from the engine's release record.
#
# Two runs, in this order (dry run first, always):
#   1. DRY RUN (dry_run ticked, the default). Builds `headunit/` at commit `sha` as `assembleFast
#      -Pnokey`, signed with the pinned debug key (the same key and pin as the phone), runs the checks,
#      and keeps the chosen ABI's APK and its sha256 as the artifact `headunit-apk-<abi>-<sha>` (1 day).
#      It uploads nothing to the APK bucket and records nothing on the engine; its one network read is
#      a GET of the newest head unit release. `sha` may be on dev or a ship/** branch of this repo.
#   2. PUBLISH (dry_run unticked). Builds nothing and touches no key: it takes the artifact of the
#      newest successful dry run for the same `sha` and ABI, checks its sha256, repeats the checks,
#      then `tools/release_apk.py --app headunit` uploads it and records the release. `sha` must be on dev.
#
# Checks: the inputs; `sha` on dev or ship/**; HEADUNIT_GOOGLE_SERVICES_B64 present and a JSON file for
# package com.kevin.midnightai; the keystore's fingerprint against deploy/release/signer.sha256 before
# Gradle sees it; on the APK: signer pin, package com.kevin.midnightai, no baked Gemini/AirNow key
# (release_apk.py --dry-run), versionName `1.0+<sha prefix>`, versionCode above the newest published
# head unit release.
#
# Setup (environment `production`). Existing and unchanged: GCP_WIF_PROVIDER, GCP_SHIP_SERVICE_ACCOUNT,
# LEGION_ENGINE_URL, LEGION_APK_BUCKET (variables); PHONE_DEBUG_KEYSTORE_B64, LEGION_ENGINE_TOKEN
# (secrets). NEW, added by Kevin only: secret HEADUNIT_GOOGLE_SERVICES_B64, the laptop's
# headunit/app/google-services.json in base64. Without it every run fails at its first step.
name: Release head unit

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to build (full 40-hex sha, on dev or a ship/** branch; on dev to publish)"
        required: true
        type: string
      abi:
        description: "Which ABI split ships (the laptop ships arm64-v8a)"
        required: true
        default: arm64-v8a
        type: choice
        options: [arm64-v8a, armeabi-v7a]
      dry_run:
        description: "Dry run: build, check, keep the APK as an artifact; publish nothing"
        required: true
        default: true
        type: boolean
      notes:
        description: "Publish only: what the head unit shows in the update offer"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read     # the publish run reads the dry run's artifact
  id-token: write   # Workload Identity Federation (publish only)

concurrency:
  group: release-headunit
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    env:
      JAVA_TOOL_OPTIONS: -Duser.language=en -Duser.country=US
      SHA: ${{ inputs.sha }}
      ABI: ${{ inputs.abi }}
      DRY: ${{ inputs.dry_run }}
      APK: out/legion-headunit-${{ inputs.abi }}-${{ inputs.sha }}.apk
    steps:
      - name: Inputs, the google-services secret, and where this run comes from (fail closed)
        env:
          NOTES: ${{ inputs.notes }}
          GS_B64: ${{ secrets.HEADUNIT_GOOGLE_SERVICES_B64 }}
        run: |
          set -euo pipefail
          [ -n "$GS_B64" ] || { echo "::error::Secret HEADUNIT_GOOGLE_SERVICES_B64 is not set in the production environment. Nothing was built or published (see this file's header)."; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be 40 lowercase hex characters. Nothing was built or published."; exit 1; }
          [ "$GITHUB_REF" = refs/heads/dev ] || { echo "::error::Dispatch this from dev (got $GITHUB_REF). Nothing was built or published."; exit 1; }
          [ "$GITHUB_REPOSITORY" = kevinmyo-code/legion ] || { echo "::error::Runs only in kevinmyo-code/legion."; exit 1; }
          if [ "$DRY" != "true" ] && [ -z "${NOTES// /}" ]; then echo "::error::A publish needs notes. Nothing was published."; exit 1; fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: The commit is on dev or a ship/** branch (on dev to publish)
        run: |
          set -euo pipefail
          on=$(git branch -r --contains "$SHA" --format='%(refname:short)' | grep -E '^origin/(dev|ship/.+)$' || true)
          [ -n "$on" ] || { echo "::error::$SHA is on neither origin/dev nor an origin/ship/** branch. Nothing was built or published."; exit 1; }
          if [ "$DRY" != "true" ]; then
            git merge-base --is-ancestor "$SHA" origin/dev || { echo "::error::A publish needs $SHA on dev first. Nothing was published."; exit 1; }
          fi

      # ---------------------------------------------------------------- dry run: build and check
      - name: google-services.json from the secret (never printed)
        if: inputs.dry_run
        env:
          GS_B64: ${{ secrets.HEADUNIT_GOOGLE_SERVICES_B64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$GS_B64" | base64 -d > headunit/app/google-services.json
          python3 - <<'EOF'
          import json, sys
          d = json.load(open("headunit/app/google-services.json", encoding="utf-8"))
          pkgs = {c["client_info"]["android_client_info"]["package_name"] for c in d.get("client", [])}
          if "com.kevin.midnightai" not in pkgs:
              sys.exit("google-services.json has no client for com.kevin.midnightai")
          print("google-services.json: a client for com.kevin.midnightai")
          EOF

      - name: Set up JDK 17
        if: inputs.dry_run
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Point local.properties at the runner's SDK (no key baked)
        if: inputs.dry_run
        working-directory: headunit
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          [ -n "${sdk}" ] || { echo "::error::Neither ANDROID_SDK_ROOT nor ANDROID_HOME is set."; exit 1; }
          echo "sdk.dir=${sdk}" > local.properties
          chmod +x gradlew

      - name: Set up Gradle
        if: inputs.dry_run
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Signing key
        if: inputs.dry_run
        env:
          KEYSTORE_B64: ${{ secrets.PHONE_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_B64" ] || { echo "::error::Secret PHONE_DEBUG_KEYSTORE_B64 is not set. Nothing was built or published."; exit 1; }
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
          got=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey \
            | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | tr -d ':' | tr 'A-F' 'a-f')
          want=$(tr -d '[:space:]' < deploy/release/signer.sha256)
          [ "$got" = "$want" ] || { echo "::error::The keystore is not the pinned key (got ${got:0:12}..., want ${want:0:12}...). Nothing was built or published."; exit 1; }
          echo "signing key matches deploy/release/signer.sha256"

      - name: Build the fast APKs (-Pnokey)
        if: inputs.dry_run
        working-directory: headunit
        run: |
          set -euo pipefail
          ./gradlew :app:assembleFast -Pnokey --no-daemon \
            "-Pandroid.injected.signing.store.file=$HOME/.android/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android
          ls -l app/build/outputs/apk/fast/
          mkdir -p ../out
          cp "app/build/outputs/apk/fast/app-${ABI}-fast.apk" "../$APK"

      - name: Forget the signing key and google-services.json
        if: always()
        run: rm -f "$HOME/.android/debug.keystore" headunit/app/google-services.json

      # ---------------------------------------------------------------- publish: the dry run's APK
      - name: Take the APK from the newest successful dry run of this commit and ABI
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="headunit-apk-${ABI}-${SHA}"
          run_id=""
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$name&per_page=20" \
                        --jq '.artifacts | sort_by(.created_at) | reverse | .[] | select(.expired | not) | .workflow_run.id'); do
            read -r path branch concl < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq '[.path, .head_branch, .conclusion] | @tsv')
            if [ "$path" = .github/workflows/release-headunit.yml ] && [ "$branch" = dev ] && [ "$concl" = success ]; then
              run_id=$id; break
            fi
          done
          [ -n "$run_id" ] || { echo "::error::No successful dry run of $SHA ($ABI) with an unexpired $name artifact. Run the dry run first. Nothing was published."; exit 1; }
          echo "dry run $run_id: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id"
          gh run download "$run_id" -R "$GITHUB_REPOSITORY" -n "$name" -D out
          (cd out && sha256sum -c "$(basename "$APK").sha256") || { echo "::error::the artifact's APK does not match its sha256 file. Nothing was published."; exit 1; }

      # ---------------------------------------------------------------- both: the checks on the APK
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Newest published head unit release (read only), versionCode and versionName
        env:
          LEGION_ENGINE_URL: ${{ vars.LEGION_ENGINE_URL }}
          LEGION_ENGINE_TOKEN: ${{ secrets.LEGION_ENGINE_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$LEGION_ENGINE_URL" ] && [ -n "$LEGION_ENGINE_TOKEN" ] || { echo "::error::LEGION_ENGINE_URL or LEGION_ENGINE_TOKEN is not set. Nothing was published."; exit 1; }
          code=$(curl -sS -o latest.json -w '%{http_code}' -H "Authorization: Token $LEGION_ENGINE_TOKEN" "$LEGION_ENGINE_URL/api/releases/latest?app=headunit")
          case "$code" in
            200) newest=$(python -c "import json;print(int(json.load(open('latest.json'))['version_code']))");;
            404) newest=0;;
            *) echo "::error::the engine answered $code for the newest head unit release. Nothing was published."; exit 1;;
          esac
          rm -f latest.json
          python - "$APK" "$SHA" "$newest" <<'EOF'
          import sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          import release_apk
          apk, sha, newest = Path(sys.argv[1]), sys.argv[2], int(sys.argv[3])
          vc, vname = release_apk.parse_badging(release_apk.aapt2_output(apk))
          print(f"version {vc} ({vname}); newest published head unit release {newest}")
          short = vname.removeprefix("1.0+")
          if not (vname.startswith("1.0+") and len(short) >= 7 and sha.startswith(short)):
              sys.exit(f"versionName {vname} is not 1.0+<a prefix of {sha}>")
          if vc <= newest:
              sys.exit(f"versionCode {vc} is not above the newest published {newest}")
          print("ok versionName names the commit; versionCode above the newest")
          EOF

      - name: Signer pin, package, no baked keys (release_apk.py --dry-run; nothing uploaded)
        run: python tools/release_apk.py --app headunit --apk "$APK" --notes "dry run" --dry-run

      - name: Keep the APK and its sha256 (the dry run's output)
        if: inputs.dry_run
        run: (cd out && sha256sum "$(basename "$APK")" > "$(basename "$APK").sha256" && cat "$(basename "$APK").sha256")

      - uses: actions/upload-artifact@v4
        if: inputs.dry_run
        with:
          name: headunit-apk-${{ inputs.abi }}-${{ inputs.sha }}
          path: |
            out/legion-headunit-${{ inputs.abi }}-${{ inputs.sha }}.apk
            out/legion-headunit-${{ inputs.abi }}-${{ inputs.sha }}.apk.sha256
          if-no-files-found: error
          retention-days: 1

      # ---------------------------------------------------------------- publish only
      - uses: google-github-actions/auth@v2
        if: ${{ !inputs.dry_run }}
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SHIP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        if: ${{ !inputs.dry_run }}

      - name: Publish (tools/release_apk.py)
        if: ${{ !inputs.dry_run }}
        env:
          NOTES: ${{ inputs.notes }}
          LEGION_ENGINE_URL: ${{ vars.LEGION_ENGINE_URL }}
          LEGION_APK_BUCKET: ${{ vars.LEGION_APK_BUCKET }}
          LEGION_ENGINE_TOKEN: ${{ secrets.LEGION_ENGINE_TOKEN }}
        run: python tools/release_apk.py --app headunit --apk "$APK" --notes "$NOTES"
