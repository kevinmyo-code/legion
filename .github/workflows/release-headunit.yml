# Build, check and publish a head unit release from GitHub (cloud-builds plan step 8, 2026-11-20; review
# fixes the same day), modelled on release-phone.yml. workflow_dispatch ONLY: nothing builds, signs or
# publishes on a push, a pull request or a fork. The head unit has no ADB: it installs an update by OTA.
# Each mode is ONE job in `production` (one approval tap); the run's title names the mode and the commit.
#
# DRY RUN (dry_run ticked, the default), job `build`:
#   - builds ONLY the commit this run was dispatched on (`sha` == the dev tip, GITHUB_SHA): the workflow,
#     the checks and the built code are one reviewed dev commit.
#   - writes google-services.json from HEADUNIT_GOOGLE_SERVICES_B64 (0600, checked for a
#     com.kevin.midnightai client), checks the keystore against deploy/release/signer.sha256 before
#     Gradle, builds `headunit assembleFast -Pnokey` (--no-daemon, daemons stopped after), checks
#     versionName `1.0+<sha prefix>` and release_apk.py --dry-run (signer, package, baked keys), logs
#     HEADUNIT_APK_SHA256=<hash>.
#   - keeps the APK as an artifact ONLY when `keep_apk` is ticked (1 day): the APK carries the
#     compiled-in Firebase config values, and an artifact on a public repo is downloadable by any
#     signed-in GitHub user. A publish needs a dry run with keep_apk.
#   - can reach: google-services.json and the debug keystore. No OIDC token, no Google login, no engine
#     token. Uploads nothing.
# PUBLISH (dry_run unticked, `dry_run_id` required), job `publish`: checks out dev only (never the built
#   tree); verifies through the API that the named run is this file, a workflow_dispatch from this repo
#   on dev, head sha == `sha`, success; downloads its artifact; the APK sha256 must equal the
#   HEADUNIT_APK_SHA256 line in that run's build log; versionCode above the newest head unit release
#   (GET); release_apk.py publishes. Can reach: the engine owner token, the OIDC token (bucket upload),
#   the artifact. No keystore, no Gradle, no built-tree code.
#
# Setup (environment `production`): variables GCP_WIF_PROVIDER, GCP_SHIP_SERVICE_ACCOUNT,
# LEGION_ENGINE_URL, LEGION_APK_BUCKET; secrets PHONE_DEBUG_KEYSTORE_B64, LEGION_ENGINE_TOKEN and
# HEADUNIT_GOOGLE_SERVICES_B64 (added by Kevin). Without the last, a dry run fails at its first step.
# Third-party actions are pinned to full commit shas (the tag they had on 2026-11-20 in the comment).
name: Release head unit
run-name: "Release head unit ${{ inputs.dry_run && 'DRY RUN' || 'PUBLISH' }} ${{ inputs.abi }} ${{ inputs.sha }}${{ !inputs.dry_run && format(' from dry run {0}', inputs.dry_run_id) || '' }}"

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to build: the current dev tip (full 40-hex sha)"
        required: true
        type: string
      abi:
        description: "Which ABI split ships (headunit/CLAUDE.md: publish the arm64 one)"
        required: true
        default: arm64-v8a
        type: choice
        options: [arm64-v8a, armeabi-v7a]
      dry_run:
        description: "Dry run: build and check; publish nothing"
        required: true
        default: true
        type: boolean
      keep_apk:
        description: "Dry run only: keep the APK as a 1-day artifact (needed for a publish; it holds the Firebase config values)"
        required: true
        default: false
        type: boolean
      dry_run_id:
        description: "Publish only: the run id of the successful dry run (with keep_apk) of this sha"
        required: false
        default: ""
        type: string
      notes:
        description: "Publish only: what the head unit shows in the update offer"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: release-headunit
  cancel-in-progress: false

jobs:
  build:
    if: inputs.dry_run
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      JAVA_TOOL_OPTIONS: -Duser.language=en -Duser.country=US
      SHA: ${{ inputs.sha }}
      ABI: ${{ inputs.abi }}
      APK: out/legion-headunit-${{ inputs.abi }}-${{ inputs.sha }}.apk
    steps:
      - name: Inputs, the google-services secret, and only the dispatched dev commit (fail closed)
        env:
          GS_B64: ${{ secrets.HEADUNIT_GOOGLE_SERVICES_B64 }}
        run: |
          set -euo pipefail
          [ -n "$GS_B64" ] || { echo "::error::Secret HEADUNIT_GOOGLE_SERVICES_B64 is not set in production. Nothing was built."; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be 40 lowercase hex characters. Nothing was built."; exit 1; }
          [ "$GITHUB_REF" = refs/heads/dev ] || { echo "::error::Dispatch this from dev (got $GITHUB_REF). Nothing was built."; exit 1; }
          [ "$GITHUB_REPOSITORY" = kevinmyo-code/legion ] || { echo "::error::Runs only in kevinmyo-code/legion."; exit 1; }
          [ "$SHA" = "$GITHUB_SHA" ] || { echo "::error::sha must be the dev tip this run was dispatched on ($GITHUB_SHA). Nothing was built."; exit 1; }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: google-services.json from the secret (never printed)
        env:
          GS_B64: ${{ secrets.HEADUNIT_GOOGLE_SERVICES_B64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$GS_B64" | base64 -d > headunit/app/google-services.json
          python3 - <<'EOF'
          import json, sys
          d = json.load(open("headunit/app/google-services.json", encoding="utf-8"))
          pkgs = {c["client_info"]["android_client_info"]["package_name"] for c in d.get("client", [])}
          if "com.kevin.midnightai" not in pkgs:
              sys.exit("google-services.json has no client for com.kevin.midnightai")
          print("google-services.json: a client for com.kevin.midnightai")
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Point local.properties at the runner's SDK (no key baked)
        working-directory: headunit
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          [ -n "${sdk}" ] || { echo "::error::Neither ANDROID_SDK_ROOT nor ANDROID_HOME is set."; exit 1; }
          echo "sdk.dir=${sdk}" > local.properties
          chmod +x gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          cache-read-only: true

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.PHONE_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_B64" ] || { echo "::error::Secret PHONE_DEBUG_KEYSTORE_B64 is not set. Nothing was built."; exit 1; }
          mkdir -p "$HOME/.android"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
          got=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey \
            | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | tr -d ':' | tr 'A-F' 'a-f')
          want=$(tr -d '[:space:]' < deploy/release/signer.sha256)
          [ "$got" = "$want" ] || { echo "::error::The keystore is not the pinned key (got ${got:0:12}..., want ${want:0:12}...). Nothing was built."; exit 1; }
          echo "signing key matches deploy/release/signer.sha256"

      - name: Build the fast APKs (-Pnokey)
        working-directory: headunit
        run: |
          set -euo pipefail
          ./gradlew :app:assembleFast -Pnokey --no-daemon \
            "-Pandroid.injected.signing.store.file=$HOME/.android/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android
          ls -l app/build/outputs/apk/fast/
          mkdir -p ../out
          cp "app/build/outputs/apk/fast/app-${ABI}-fast.apk" "../$APK"

      - name: Forget the signing key and google-services.json; stop anything Gradle left running
        if: always()
        run: |
          rm -f "$HOME/.android/debug.keystore" headunit/app/google-services.json
          (cd headunit && ./gradlew --stop >/dev/null 2>&1) || true
          pkill -f 'GradleDaemon|KotlinCompileDaemon' || true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: versionName names the commit
        run: |
          python - "$APK" "$SHA" <<'EOF'
          import sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          import release_apk
          apk, sha = Path(sys.argv[1]), sys.argv[2]
          vc, vname = release_apk.parse_badging(release_apk.aapt2_output(apk))
          print(f"version {vc} ({vname})")
          short = vname.removeprefix("1.0+")
          if not (vname.startswith("1.0+") and len(short) >= 7 and sha.startswith(short)):
              sys.exit(f"versionName {vname} is not 1.0+<a prefix of {sha}>")
          EOF

      - name: Signer pin, package, no baked keys (release_apk.py --dry-run; nothing uploaded)
        run: python tools/release_apk.py --app headunit --apk "$APK" --notes "dry run" --dry-run

      - name: The APK's sha256 (the publish compares against this log line)
        run: |
          set -euo pipefail
          h=$(sha256sum "$APK" | cut -c1-64)
          echo "$h  $(basename "$APK")" > "$APK.sha256"
          echo "HEADUNIT_APK_SHA256=$h"
          echo "Dry run of \`$SHA\` ($ABI): APK sha256 \`$h\`." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.keep_apk
        with:
          name: headunit-apk-${{ inputs.abi }}-${{ inputs.sha }}
          path: |
            out/legion-headunit-${{ inputs.abi }}-${{ inputs.sha }}.apk
            out/legion-headunit-${{ inputs.abi }}-${{ inputs.sha }}.apk.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read     # read the dry run, its log and its artifact
      id-token: write   # the bucket upload
    env:
      SHA: ${{ inputs.sha }}
      ABI: ${{ inputs.abi }}
      DRY_RUN_ID: ${{ inputs.dry_run_id }}
      APK: out/legion-headunit-${{ inputs.abi }}-${{ inputs.sha }}.apk
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Inputs and where this run comes from
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be 40 lowercase hex characters. Nothing was published."; exit 1; }
          [[ "$DRY_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::dry_run_id must be the numeric run id of the dry run. Nothing was published."; exit 1; }
          [ "$GITHUB_REF" = refs/heads/dev ] || { echo "::error::Dispatch this from dev (got $GITHUB_REF). Nothing was published."; exit 1; }
          [ "$GITHUB_REPOSITORY" = kevinmyo-code/legion ] || { echo "::error::Runs only in kevinmyo-code/legion."; exit 1; }
          [ -n "${NOTES// /}" ] || { echo "::error::A publish needs notes. Nothing was published."; exit 1; }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: sha is on dev
        run: git merge-base --is-ancestor "$SHA" HEAD || { echo "::error::$SHA is not on dev. Nothing was published."; exit 1; }

      - name: The named dry run is a dispatch of this workflow, from this repo, of this sha, and passed
        run: |
          set -euo pipefail
          read -r path event repo branch head concl < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DRY_RUN_ID" \
            --jq '[.path, .event, .head_repository.full_name, .head_branch, .head_sha, .conclusion] | @tsv')
          [ "$path" = .github/workflows/release-headunit.yml ] || { echo "::error::run $DRY_RUN_ID is $path"; exit 1; }
          [ "$event" = workflow_dispatch ] || { echo "::error::run $DRY_RUN_ID is a $event run"; exit 1; }
          [ "$repo" = "$GITHUB_REPOSITORY" ] || { echo "::error::run $DRY_RUN_ID comes from $repo"; exit 1; }
          [ "$branch" = dev ] || { echo "::error::run $DRY_RUN_ID ran on $branch"; exit 1; }
          [ "$head" = "$SHA" ] || { echo "::error::run $DRY_RUN_ID built $head, not $SHA"; exit 1; }
          [ "$concl" = success ] || { echo "::error::run $DRY_RUN_ID concluded $concl"; exit 1; }
          job=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DRY_RUN_ID/jobs" --jq '[.jobs[] | select(.name == "build")] | .[0].id')
          [ -n "$job" ] && [ "$job" != null ] || { echo "::error::run $DRY_RUN_ID has no build job"; exit 1; }
          logged=$(gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$job/logs" | grep -oE 'HEADUNIT_APK_SHA256=[0-9a-f]{64}' | tail -1 | cut -d= -f2)
          [[ "$logged" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::no HEADUNIT_APK_SHA256 line in the dry run's build log"; exit 1; }
          echo "LOGGED_SHA256=$logged" >> "$GITHUB_ENV"
          echo "dry run $DRY_RUN_ID: logged APK sha256 $logged"

      - name: Take that run's APK and match it to the logged sha256
        run: |
          set -euo pipefail
          gh run download "$DRY_RUN_ID" -R "$GITHUB_REPOSITORY" -n "headunit-apk-${ABI}-${SHA}" -D out \
            || { echo "::error::that dry run kept no APK (tick keep_apk on the dry run). Nothing was published."; exit 1; }
          got=$(sha256sum "$APK" | cut -c1-64)
          [ "$got" = "$LOGGED_SHA256" ] || { echo "::error::the artifact's APK is $got, the dry run logged $LOGGED_SHA256. Nothing was published."; exit 1; }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: versionName and versionCode above the newest head unit release (read only)
        env:
          LEGION_ENGINE_URL: ${{ vars.LEGION_ENGINE_URL }}
          LEGION_ENGINE_TOKEN: ${{ secrets.LEGION_ENGINE_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$LEGION_ENGINE_URL" ] && [ -n "$LEGION_ENGINE_TOKEN" ] || { echo "::error::LEGION_ENGINE_URL or LEGION_ENGINE_TOKEN is not set. Nothing was published."; exit 1; }
          code=$(curl -sS -o latest.json -w '%{http_code}' -H "Authorization: Token $LEGION_ENGINE_TOKEN" "$LEGION_ENGINE_URL/api/releases/latest?app=headunit")
          case "$code" in
            200) newest=$(python -c "import json;print(int(json.load(open('latest.json'))['version_code']))");;
            404) newest=0;;
            *) echo "::error::the engine answered $code for the newest head unit release. Nothing was published."; exit 1;;
          esac
          rm -f latest.json
          python - "$APK" "$SHA" "$newest" <<'EOF'
          import sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          import release_apk
          apk, sha, newest = Path(sys.argv[1]), sys.argv[2], int(sys.argv[3])
          vc, vname = release_apk.parse_badging(release_apk.aapt2_output(apk))
          print(f"version {vc} ({vname}); newest published head unit release {newest}")
          short = vname.removeprefix("1.0+")
          if not (vname.startswith("1.0+") and len(short) >= 7 and sha.startswith(short)):
              sys.exit(f"versionName {vname} is not 1.0+<a prefix of {sha}>")
          if vc <= newest:
              sys.exit(f"versionCode {vc} is not above the newest published {newest}")
          EOF

      - name: Signer pin, package, no baked keys (release_apk.py --dry-run)
        run: python tools/release_apk.py --app headunit --apk "$APK" --notes "dry run" --dry-run

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SHIP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Publish (tools/release_apk.py)
        env:
          NOTES: ${{ inputs.notes }}
          LEGION_ENGINE_URL: ${{ vars.LEGION_ENGINE_URL }}
          LEGION_APK_BUCKET: ${{ vars.LEGION_APK_BUCKET }}
          LEGION_ENGINE_TOKEN: ${{ secrets.LEGION_ENGINE_TOKEN }}
        run: python tools/release_apk.py --app headunit --apk "$APK" --notes "$NOTES"
