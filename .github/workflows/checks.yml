# Review-finding checks and the blast-radius tier (docs/process/blast-radius.md).
#
# Findings reviewers kept repeating, turned into checks (tools/checks/):
#   (a) clock times in docs and comments, (b) code files over 600 lines, (c) schema files declared and
#   existing ones untouched, (d) em dashes in user-facing copy, (f) the detekt baseline only shrinks.
#   (e) offhand quotes is not mechanical.
# Each check reads only what the change ADDS, so existing debt never fails the build; the counts for the
# whole tree come from `python tools/checks/run_all.py --all`.
#
# No path filter on purpose: strings.xml, docs and migrations live under paths no other workflow watches.
# No secrets, no keys: it reads the repository and nothing else.

name: Checks

on:
  push:
    branches: [dev, main, 'up/**', 'integrate/**', 'ship/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: review-finding checks + tier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The checks diff against a base: a shallow clone has no merge base, and an empty diff
          # would read as a pass.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install --quiet pytest==8.4.2

      # The checks' own tests, the tier script's tests, and the voice eval's free no-key half (the
      # scorer's rules, the committed case files' shape, and which failure reasons the paid gate may
      # upload). The voice eval tests live here rather than in android.yml because this workflow has
      # no path filter, so they run on every PR, and because they need no Gradle, no key and no
      # network: stdlib and pytest only. Verdict from the XML, never the console.
      - name: Tests for the checks, the tier script and the voice eval cases
        run: python -m pytest tools/checks tools/tests/test_blast_radius.py tools/tests/test_voice_eval.py tools/tests/test_voice_eval_cases.py tools/tests/test_gate_reasons.py --junitxml=checks-junit.xml || echo "pytest exited $? (verdict comes from the XML below)"

      - name: Totals from the JUnit XML
        if: ${{ !cancelled() }}
        run: python .github/scripts/junit_totals.py checks-junit.xml

      # Base: the PR's base; on a dev/main push, the previous tip; anywhere else, the merge base with dev.
      - name: Resolve the base
        if: ${{ !cancelled() }}
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          REF: ${{ github.ref }}
        run: |
          git fetch --quiet origin dev
          if [ "$EVENT" = "pull_request" ]; then
            BASE="$PR_BASE"
          elif [ "$EVENT" = "push" ] && { [ "$REF" = "refs/heads/dev" ] || [ "$REF" = "refs/heads/main" ]; }; then
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then BASE="HEAD~1"; else BASE="$BEFORE"; fi
          else
            BASE="origin/dev"
          fi
          git rev-parse --verify --quiet "$BASE^{commit}" >/dev/null || { echo "::error::base $BASE does not resolve"; exit 1; }
          echo "base: $BASE"
          echo "CHECK_BASE=$BASE" >> "$GITHUB_ENV"

      # The trusted tier: the BASE copy of tools/blast_radius.py, read from git, never the head copy, so a
      # change cannot lower its own tier by editing the script. The base TIP's copy first, so a branch
      # forked long ago still meets today's rules; the merge base's copy if the tip has none.
      - name: Blast-radius tier from the base copy of the script
        if: ${{ !cancelled() && env.CHECK_BASE != '' }}
        run: |
          SRC=""
          for REV in "$CHECK_BASE" "$(git merge-base "$CHECK_BASE" HEAD)"; do
            if git cat-file -e "$REV:tools/blast_radius.py" 2>/dev/null; then SRC="$REV"; break; fi
          done
          if [ -n "$SRC" ]; then
            git show "$SRC:tools/blast_radius.py" > "$RUNNER_TEMP/blast_radius_base.py"
            echo "base copy from $SRC" | tee -a "$GITHUB_STEP_SUMMARY"
            python "$RUNNER_TEMP/blast_radius_base.py" --base "$CHECK_BASE" --head HEAD | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No tools/blast_radius.py on the base tip or at the merge base: only the head copy's tier exists (this change adds the script)." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # run_all.py exits 2 when the base cannot be resolved, so a missing base fails here.
      - name: Review-finding checks on the change
        if: ${{ !cancelled() && env.CHECK_BASE != '' }}
        run: python tools/checks/run_all.py --base "$CHECK_BASE" --head HEAD

      - name: Upload the JUnit XML
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checks-junit-xml
          path: checks-junit.xml
          if-no-files-found: warn
