# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Pin the Gradle JVM to Android Studio's bundled JDK (JBR). Without this, Gradle
# can auto-pick the VS Code Red Hat extension's bundled *JRE* (same version,
# 21.0.10) which has no jlink/javac, failing with "jlink executable ... does not
# exist". Forward slashes are intentional (gradle.properties treats '\' as an
# escape char), and the drive-letter colon is escaped per the Java properties
# spec (unescaped it still works, but lint errors on it).
# Overrides JAVA_HOME / PATH / IDE Java for every build of this project.
org.gradle.java.home=C\:/Program Files/Android/Android Studio/jbr
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

android.useAndroidX=true
android.enableJetifier=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
