[versions]
agp = "9.2.1"
kotlin = "2.1.0"
coreKtx = "1.13.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
appcompat = "1.7.0"
material = "1.12.0"
room = "2.8.4"
composeBom = "2024.05.00"
okhttp = "4.12.0"
coroutines = "1.8.1"
lifecycle = "2.8.0"
activityCompose = "1.9.0"
# Nav for the single-activity shell (ticket 07, app shell and ignition):
# bottom-nav tabs (fleet/ledger/pantry/settings) plus their absorbed sub-routes
# (fleet/places, ledger/import, pantry/import, settings/key). New dependency -
# not previously in this catalog.
navigationCompose = "2.8.0"
# Room 2.8.4's MigrationTestHelper parses the exported schema JSON with
# kotlinx-serialization and needs 1.8.1. navigation-compose 2.8.0 drags in
# 1.6.3, and AGP's consistent resolution then forces the androidTest classpath
# to match the app's - so the migration test died with
# AbstractMethodError: typeParametersSerializers(). Pinning it up here fixes
# every configuration at once. See app/build.gradle.kts.
kotlinxSerialization = "1.8.1"
playServicesAuth = "21.2.0"
# Geofencing (location-intelligence map, ticket 05): GeofencingClient lives in play-services-location,
# not play-services-auth (that one is Drive sign-in only) - a separate artifact, same GMS group.
playServicesLocation = "21.3.0"
# Vosk (custom wake word, ported from Midnight AI's 2026-07-19 reopen):
# published directly to Maven Central, no JitPack needed.
vosk = "0.3.47"
# PdfBox-Android (ledger bank-statement parsing, .claude/plans/wiggly-beaming-quasar.md):
# Android port of Apache PDFBox, needed for per-word coordinate extraction
# (DBS statement column classification) that Android has no built-in equivalent
# for. Verify this resolves - not yet confirmed against Maven Central directly.
pdfboxAndroid = "2.0.27.0"
# Robolectric: test-only, needed because PdfBox-Android's fonts/glyphlists ship
# as Android assets (not JVM classpath resources) - a plain unit test can't
# reach them without something shadowing AssetManager.
robolectric = "4.13"
# Media3 session (`.scratch/android-auto/map.md`, Android Auto probe harness). CLAUDE.md §3 lists
# Media3 as a dependency deliberately dropped at the pivot - it is back specifically for the
# MediaLibraryService that puts LEGION in Android Auto's media list (research 02 section 1c). Only
# media3-session is pulled in, not the ExoPlayer stack: LegionMediaLibraryService never plays audio,
# it only needs a Player implementation the session can hold.
media3 = "1.4.1"
# androidx.media (legacy media-compat) is already pulled in TRANSITIVELY by media3-session (it is
# how media3 talks to a legacy MediaBrowserCompat client like Android Auto), but transitive-only
# is `implementation`-scoped in that library's own POM and not exposed on our compile classpath -
# `androidx.media.utils.MediaConstants` (the root-hints/custom-action key constants research 02
# section 5/6 documents) needs an explicit `implementation` dependency here to be resolvable.
# Pinned to the version already resolved transitively so nothing double-loads at a different one.
media-compat = "1.7.0"
# fastexcel (aspect-engine ticket 20, mirror/sync): plain-JVM xlsx reader/writer, no Android
# assets, no java.awt - unlike PdfBox-Android this needs no Robolectric (research
# `.scratch/aspect-engine/research/02-xlsx-on-android.md` section 1/"Test implications"). Writer
# and reader are published as separate artifacts at the same version.
fastexcel = "0.19.0"
# Roborazzi (hardening ticket 01, screenshot tests): Robolectric-native screenshot testing, runs
# in testDebugUnitTest alongside every other JVM unit test - no emulator/device needed, unlike
# Dropshots-style instrumented screenshot tests. `roborazzi`/`roborazzi-compose` are the runtime
# capture libraries (ComposeTestRule.onRoot().captureRoboImage(...)); the Gradle plugin below
# wires the record/verify/compare task triples per build type.
roborazzi = "1.72.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
ui = { group = "androidx.compose.ui", name = "ui" }
ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
material3 = { group = "androidx.compose.material3", name = "material3" }
material3-windowsizeclass = { group = "androidx.compose.material3", name = "material3-window-size-class" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
kotlinx-serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "kotlinxSerialization" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
# ProcessLifecycleOwner (senior review of aspect-engine ticket 20, MUST-FIX 2): the mirror's real
# app-foreground/app-background triggers, same "lifecycle" version already pinned above.
lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
# Google Identity Authorization API (com.google.android.gms.auth.api.identity):
# on-device authorization for the driver's OWN Google Drive appDataFolder, used
# by the BYO-cloud cross-device sync. The app talks straight to the user's
# Drive - no Kevin-hosted backend.
play-services-auth = { group = "com.google.android.gms", name = "play-services-auth", version.ref = "playServicesAuth" }
# GeofencingClient (location-intelligence ticket 05): registers real OS geofences for
# TaggedPlace rows so arrival reminders fire event-driven, with the app closed, instead of
# depending on a GPS poll happening to land near the place.
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }
# Custom wake word ("hey <name>"), ported from Midnight AI.
vosk-android = { group = "com.alphacephei", name = "vosk-android", version.ref = "vosk" }
pdfbox-android = { group = "com.tom-roush", name = "pdfbox-android", version.ref = "pdfboxAndroid" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
media-compat = { group = "androidx.media", name = "media", version.ref = "media-compat" }
fastexcel-writer = { group = "org.dhatim", name = "fastexcel", version.ref = "fastexcel" }
fastexcel-reader = { group = "org.dhatim", name = "fastexcel-reader", version.ref = "fastexcel" }
# Compose UI testing entry points - createComposeRule()/createAndroidComposeRule<T>(), needed for
# the screenshot tests (hardening ticket 01) and for any future Compose behaviour test. Neither
# was in this catalog before (see BodyWriteSameFunctionTest's own doc: "repo has no
# createComposeRule harness").
ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
# Supplies the merged-manifest <activity> Robolectric/Espresso need to host createComposeRule()'s
# default ComponentActivity - test-only, never shipped.
ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
roborazzi = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose", version.ref = "roborazzi" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
