<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Geist:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'Geist', system-ui, -apple-system, sans-serif; }
    a { color: oklch(0.58 0.12 45); } a:hover { color: oklch(0.48 0.12 45); }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: oklch(0.985 0.006 85); color: oklch(0.22 0.012 60); display: flex; flex-direction: column; overflow: hidden">

  <div style="padding: 20px 20px 12px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
    <div>
      <div style="font-family: 'Newsreader', Georgia, serif; font-size: 28px; line-height: 1.1; letter-spacing: -0.01em">BIO Plan</div>
      <div style="font-size: 13px; color: oklch(0.52 0.012 70); margin-top: 4px">Daily - resets at midnight</div>
    </div>
    <button style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid oklch(0.90 0.008 80); background: oklch(1 0.003 85); display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="oklch(0.22 0.012 60)" stroke-width="1.75" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <!-- progress, stated as a plain count and never as a score or streak -->
  <div style="padding: 0 20px 16px">
    <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px">
      <span style="font-size: 13px; color: oklch(0.52 0.012 70)">{{doneCount}} of 65 ticked today</span>
    </div>
    <div style="height: 5px; border-radius: 999px; background: oklch(0.92 0.006 80); overflow: hidden">
      <div style="height: 100%; width: {{pct}}; background: oklch(0.58 0.12 155); border-radius: 999px"></div>
    </div>
  </div>

  <div style="flex-grow: 1; overflow-y: auto; padding: 0 20px 20px">
    <sc-for list="{{items}}" as="row" hint-placeholder-count="6">
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid oklch(0.93 0.006 80); min-height: 48px">
        <div onClick="{{row.toggle}}" style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 6px; border: 1.5px solid {{row.boxBorder}}; background: {{row.boxFill}}; cursor: pointer; display: flex; align-items: center; justify-content: center">
          <sc-if value="{{row.done}}" hint-placeholder-val="{{ false }}">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="oklch(0.99 0.01 155)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          </sc-if>
        </div>
        <div style="flex-grow: 1; font-size: 15px; line-height: 1.35; color: {{row.textColor}}; text-decoration: {{row.strike}}">{{row.label}}</div>
        <div style="font-size: 12px; color: oklch(0.62 0.012 70); padding: 4px 8px; cursor: pointer">Skip</div>
      </div>
    </sc-for>

    <div style="padding: 16px 0 0; font-size: 13px; color: oklch(0.52 0.012 70)">
      Ticks are kept per day. Yesterday stays readable after tonight&#39;s reset.
    </div>
  </div>

  <div style="display: flex; border-top: 1px solid oklch(0.90 0.008 80); background: oklch(1 0.003 85); padding-bottom: 8px">
    <div style="flex-grow: 1; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="oklch(0.52 0.012 70)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2.5"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
      <span style="font-size: 11px; color: oklch(0.52 0.012 70)">Today</span>
    </div>
    <div style="flex-grow: 1; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="oklch(0.58 0.12 45)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      <span style="font-size: 11px; font-weight: 500; color: oklch(0.58 0.12 45)">Lists</span>
    </div>
    <div style="flex-grow: 1; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="oklch(0.52 0.012 70)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.6 3.1-5.6 7-5.6s7 2 7 5.6"/></svg>
      <span style="font-size: 11px; color: oklch(0.52 0.012 70)">You</span>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { done: { a: true } };
  }
  renderVals() {
    const items = [
      { id: 'a', label: '1 SETS - GOBLET SQUAT' },
      { id: 'b', label: '3 SETS - ROMANIAN DEADLIFT' },
      { id: 'c', label: '3 SETS - WALKING LUNGE' },
      { id: 'd', label: '3 SETS - SEATED ROW' },
      { id: 'e', label: '20 MIN - ZONE 2 WALK' },
      { id: 'f', label: '10 MIN - MOBILITY' },
    ];
    const count = Object.values(this.state.done).filter(Boolean).length;
    return {
      doneCount: count,
      pct: Math.round((count / 65) * 100) + '%',
      items: items.map((it) => {
        const done = !!this.state.done[it.id];
        return {
          ...it,
          done,
          toggle: () => this.setState({ done: { ...this.state.done, [it.id]: !done } }),
          boxBorder: done ? 'oklch(0.58 0.12 155)' : 'oklch(0.78 0.01 80)',
          boxFill: done ? 'oklch(0.58 0.12 155)' : 'transparent',
          textColor: done ? 'oklch(0.60 0.012 70)' : 'oklch(0.22 0.012 60)',
          strike: done ? 'line-through' : 'none',
        };
      }),
    };
  }
}
</script>
</body>
</html>
