<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Geist:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'Geist', system-ui, -apple-system, sans-serif; }
    a { color: oklch(0.58 0.12 45); } a:hover { color: oklch(0.48 0.12 45); }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: oklch(0.985 0.006 85); color: oklch(0.22 0.012 60); display: flex; flex-direction: column; overflow: hidden">

  <!-- header -->
  <div style="padding: 20px 20px 12px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
    <div>
      <div style="font-family: 'Newsreader', Georgia, serif; font-size: 28px; line-height: 1.1; letter-spacing: -0.01em">Today</div>
      <div style="font-size: 13px; color: oklch(0.52 0.012 70); margin-top: 4px">Friday, 12 September</div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <button style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid oklch(0.90 0.008 80); background: oklch(1 0.003 85); display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="oklch(0.22 0.012 60)" stroke-width="1.75" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <div style="width: 44px; height: 44px; border-radius: 999px; background: oklch(0.58 0.12 155); color: oklch(0.99 0.01 155); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600">M</div>
    </div>
  </div>

  <div style="flex-grow: 1; overflow-y: auto; padding: 0 20px 20px; display: flex; flex-direction: column; gap: 26px">

    <!-- DUE -->
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px">
        <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: oklch(0.52 0.012 70)">Due</div>
        <div style="font-size: 12px; color: oklch(0.52 0.012 70)">3 left</div>
      </div>

      <sc-for list="{{due}}" as="row" hint-placeholder-count="3">
        <div style="display: flex; align-items: flex-start; gap: 12px; padding: 11px 0; border-bottom: 1px solid oklch(0.93 0.006 80); min-height: 44px">
          <div onClick="{{row.toggle}}" style="width: 22px; height: 22px; margin-top: 1px; flex-shrink: 0; border-radius: 6px; border: 1.5px solid {{row.boxBorder}}; background: {{row.boxFill}}; cursor: pointer; display: flex; align-items: center; justify-content: center">
            <sc-if value="{{row.done}}" hint-placeholder-val="{{ false }}">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="oklch(0.99 0.01 155)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
            </sc-if>
          </div>
          <div style="flex-grow: 1; min-width: 0">
            <div style="font-size: 15px; line-height: 1.35; color: {{row.textColor}}; text-decoration: {{row.strike}}">{{row.title}}</div>
            <div style="font-size: 12.5px; color: oklch(0.52 0.012 70); margin-top: 3px">{{row.meta}}</div>
          </div>
        </div>
      </sc-for>
    </div>

    <!-- TODAY'S EVENTS -->
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: oklch(0.52 0.012 70); margin-bottom: 8px">On today</div>

      <div style="display: flex; align-items: flex-start; gap: 12px; padding: 11px 0; border-bottom: 1px solid oklch(0.93 0.006 80)">
        <div style="width: 52px; flex-shrink: 0; font-size: 13px; font-variant-numeric: tabular-nums; color: oklch(0.52 0.012 70); padding-top: 1px">09:30</div>
        <div style="flex-grow: 1; font-size: 15px; line-height: 1.35">COSC 4320 lecture</div>
        <div style="width: 8px; height: 8px; border-radius: 999px; background: oklch(0.58 0.12 45); margin-top: 6px; flex-shrink: 0"></div>
      </div>
      <div style="display: flex; align-items: flex-start; gap: 12px; padding: 11px 0; border-bottom: 1px solid oklch(0.93 0.006 80)">
        <div style="width: 52px; flex-shrink: 0; font-size: 13px; font-variant-numeric: tabular-nums; color: oklch(0.52 0.012 70); padding-top: 1px">14:00</div>
        <div style="flex-grow: 1; font-size: 15px; line-height: 1.35">Gym</div>
        <div style="width: 8px; height: 8px; border-radius: 999px; background: oklch(0.58 0.12 45); margin-top: 6px; flex-shrink: 0"></div>
      </div>
    </div>

    <!-- TOMORROW, collapsed -->
    <div>
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-top: 1px solid oklch(0.93 0.006 80); min-height: 44px; cursor: pointer">
        <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: oklch(0.52 0.012 70)">Tomorrow</div>
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="font-size: 13px; color: oklch(0.52 0.012 70)">2 events</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="oklch(0.52 0.012 70)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </div>
      </div>
    </div>

    <!-- LIST PREVIEW: preview + count, never the whole list -->
    <div style="background: oklch(1 0.003 85); border: 1px solid oklch(0.90 0.008 80); border-radius: 14px; padding: 16px">
      <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px">
        <div style="font-family: 'Newsreader', Georgia, serif; font-size: 18px">BIO Plan</div>
        <div style="font-size: 13px; color: oklch(0.52 0.012 70); font-variant-numeric: tabular-nums">1 / 65</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 9px">
        <div style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: oklch(0.52 0.012 70)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="oklch(0.58 0.12 155)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          <span style="text-decoration: line-through">1 SETS - GOBLET SQUAT</span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px; font-size: 14px">
          <span style="width: 15px"></span>3 SETS - ROMANIAN DEADLIFT
        </div>
        <div style="display: flex; align-items: center; gap: 10px; font-size: 14px">
          <span style="width: 15px"></span>3 SETS - WALKING LUNGE
        </div>
      </div>
      <div style="margin-top: 13px; font-size: 13px; color: oklch(0.58 0.12 45); cursor: pointer">plus 62 more</div>
    </div>

  </div>

  <!-- bottom nav -->
  <div style="display: flex; border-top: 1px solid oklch(0.90 0.008 80); background: oklch(1 0.003 85); padding-bottom: 8px">
    <div style="flex-grow: 1; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="oklch(0.58 0.12 45)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2.5"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
      <span style="font-size: 11px; font-weight: 500; color: oklch(0.58 0.12 45)">Today</span>
    </div>
    <div style="flex-grow: 1; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="oklch(0.52 0.012 70)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      <span style="font-size: 11px; color: oklch(0.52 0.012 70)">Lists</span>
    </div>
    <div style="flex-grow: 1; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="oklch(0.52 0.012 70)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.6 3.1-5.6 7-5.6s7 2 7 5.6"/></svg>
      <span style="font-size: 11px; color: oklch(0.52 0.012 70)">You</span>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { done: { quiz: false, waterfall: false, discussion: false } };
  }
  renderVals() {
    const rows = [
      { id: 'quiz', title: 'Chapter 2 Quiz', meta: 'MATH 3391 - due Sun 23:59' },
      { id: 'waterfall', title: 'Module 2: Assignment 2 - Waterfall Model', meta: 'COSC 4320 - due Sun 23:59' },
      { id: 'discussion', title: 'Discussion-2-Incremental Advantage Delivery', meta: 'COSC 4320 - due Sun 23:59' },
    ];
    return {
      due: rows.map((r) => {
        const done = !!this.state.done[r.id];
        return {
          ...r,
          done,
          toggle: () => this.setState({ done: { ...this.state.done, [r.id]: !done } }),
          boxBorder: done ? 'oklch(0.58 0.12 155)' : 'oklch(0.78 0.01 80)',
          boxFill: done ? 'oklch(0.58 0.12 155)' : 'transparent',
          textColor: done ? 'oklch(0.60 0.012 70)' : 'oklch(0.22 0.012 60)',
          strike: done ? 'line-through' : 'none',
        };
      }),
    };
  }
}
</script>
</body>
</html>
