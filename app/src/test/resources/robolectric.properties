# Global Robolectric config for every JVM unit test in this module, not just the screenshot ones
# (hardening ticket 01). NATIVE renders through Robolectric's Skia-backed shadow layer, matching
# what an actual phone draws; the older LEGACY graphics mode is a hand-rolled approximation of
# Android's 2D pipeline that is close enough for behaviour tests but not for pixel comparison.
# Robolectric 4.10+ already defaults to NATIVE - this file pins it explicitly so a future
# Robolectric bump can never silently change what a committed screenshot baseline was captured
# against (the android-testing skill's "screenshot determinism" guidance: pin every input a
# screenshot depends on).
graphicsMode=NATIVE
