<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dumb home, text list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#EDEDED;text-decoration:none}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 384px; height: 832px; box-sizing: border-box; background: #0E0E0E; color: #EDEDED; font-family: 'Inter Tight', system-ui, sans-serif; padding: 56px 28px 28px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-family: 'JetBrains Mono', monospace; font-size: 64px; font-weight: 400; letter-spacing: -2px; line-height: 1">2:47</div>
<div style="font-size: 15px; color: #9A9A9A">Wednesday, October 22</div>
<div style="font-size: 13px; color: #9A9A9A; font-family: 'JetBrains Mono', monospace">dumb for 2h 14m · 4 days in a row</div>
</div>
<nav aria-label="Kept apps" style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1">
<sc-for list="{{apps}}" as="app" hint-placeholder-count="9">
<a href="#" style="font-size: 30px; font-weight: 500; line-height: 1.25; padding: 6px 0; min-height: 44px; box-sizing: border-box; display: flex; align-items: baseline; justify-content: space-between">
<span>{{app.label}}</span>
<span style="font-size: 13px; font-weight: 400; color: #9A9A9A; font-family: 'JetBrains Mono', monospace">{{app.hint}}</span>
</a>
</sc-for>
</nav>
<div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #2A2A2A; padding-top: 16px">
<span style="font-size: 13px; color: #9A9A9A">Mia, Mom, Dad get through</span>
<a href="Leave.dc.html" style="font-size: 14px; color: #EDEDED; border: 1px solid #3A3A3A; border-radius: 999px; padding: 12px 16px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center">Leave</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":384,"height":832}}'>
class Component extends DCLogic {
renderVals() {
return {
apps: [
{ label: 'Phone', hint: '' },
{ label: 'Messages', hint: '1 from Mia' },
{ label: 'Maps', hint: '' },
{ label: 'Camera', hint: '' },
{ label: 'Music', hint: '' },
{ label: 'To-dos', hint: '3 due' },
{ label: 'Calendar', hint: '' },
{ label: 'Books', hint: '' },
{ label: 'Assistant', hint: '' }
]
};
}
}
</script>
</body>
</html>
