<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LEGION Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&amp;display=block">
<style>
body{margin:0;background:#0b0c0f}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
</style>
</helmet>
<div style="position: relative; width: 412px; height: 820px; box-sizing: border-box; display: flex; flex-direction: column; background: #121317; color: #E6E7EC; font-family: 'Figtree', system-ui, sans-serif; overflow: hidden">

<div style="height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 4px 0 16px">
<div style="display: flex; align-items: center; gap: 14px; font-size: 13px; color: #A9ADB8">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #7EDBA5; display: block"></span>Synced</span>
<span>OBD off</span>
</div>
<div style="display: flex; align-items: center; gap: 2px">
<span style="font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums">14:02</span>
<button aria-label="Settings" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #A9ADB8"><span class="material-symbols-rounded" aria-hidden="true">settings</span></button>
</div>
</div>

<div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 4px 16px 16px">

<button aria-label="Open today in the calendar" style="background: #1C1E24; border-radius: 24px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; text-align: left; flex-shrink: 0">
<div style="display: flex; justify-content: space-between; align-items: flex-start; width: 100%">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; font-weight: 500; color: #A9ADB8">Sunday</span>
<span style="font-size: 26px; font-weight: 700; letter-spacing: -0.01em">September 27</span>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
<span style="display: flex; align-items: center; gap: 6px; font-size: 20px; font-weight: 600"><span class="material-symbols-rounded" aria-hidden="true" style="color: #FFD36B">sunny</span>72°</span>
<span style="font-size: 12px; color: #A9ADB8">Clear, AQI 38 good</span>
</div>
</div>
<div style="display: flex; align-items: center; gap: 10px; font-size: 15px">
<span class="material-symbols-rounded" aria-hidden="true" style="font-size: 20px; color: #A8C8FF">schedule</span>
<span>Next: Lab report due, 11:59 PM</span>
</div>
<div style="display: flex; gap: 8px">
<span style="font-size: 13px; font-weight: 600; background: #24272E; color: #E6E7EC; border-radius: 10px; padding: 6px 10px">4 due today</span>
<span style="font-size: 13px; font-weight: 600; background: #4A1F24; color: #FFB4AB; border-radius: 10px; padding: 6px 10px">1 overdue</span>
</div>
</button>

<div style="flex-grow: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); gap: 12px">

<button style="background: #1C1E24; border-radius: 20px; padding: 14px 14px 12px; display: flex; flex-direction: column; justify-content: space-between; text-align: left; min-height: 0">
<span style="width: 40px; height: 40px; border-radius: 12px; background: #1F3450; color: #A8C8FF; display: flex; align-items: center; justify-content: center"><span class="material-symbols-rounded" aria-hidden="true">calendar_month</span></span>
<span style="display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 16px; font-weight: 600">Calendar</span>
<span style="font-size: 13px; color: #A9ADB8">4 due today</span>
</span>
</button>

<button style="background: #1C1E24; border-radius: 20px; padding: 14px 14px 12px; display: flex; flex-direction: column; justify-content: space-between; text-align: left; min-height: 0">
<span style="width: 40px; height: 40px; border-radius: 12px; background: #43340F; color: #FFD36B; display: flex; align-items: center; justify-content: center"><span class="material-symbols-rounded" aria-hidden="true">checklist</span></span>
<span style="display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 16px; font-weight: 600">Lists</span>
<span style="font-size: 13px; color: #A9ADB8">5 lists</span>
</span>
</button>

<button style="background: #1C1E24; border-radius: 20px; padding: 14px 14px 12px; display: flex; flex-direction: column; justify-content: space-between; text-align: left; min-height: 0">
<span style="width: 40px; height: 40px; border-radius: 12px; background: #173D2B; color: #7EDBA5; display: flex; align-items: center; justify-content: center"><span class="material-symbols-rounded" aria-hidden="true">account_balance_wallet</span></span>
<span style="display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 16px; font-weight: 600">Money</span>
<span style="font-size: 13px; color: #A9ADB8">$1,240 of $2,000 spent</span>
</span>
</button>

<button style="background: #1C1E24; border-radius: 20px; padding: 14px 14px 12px; display: flex; flex-direction: column; justify-content: space-between; text-align: left; min-height: 0">
<span style="width: 40px; height: 40px; border-radius: 12px; background: #4A1F2C; color: #FFB1C3; display: flex; align-items: center; justify-content: center"><span class="material-symbols-rounded" aria-hidden="true">monitor_heart</span></span>
<span style="display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 16px; font-weight: 600">Body</span>
<span style="font-size: 13px; color: #A9ADB8">1,450 kcal, estimated</span>
</span>
</button>

<button style="background: #1C1E24; border-radius: 20px; padding: 14px 14px 12px; display: flex; flex-direction: column; justify-content: space-between; text-align: left; min-height: 0">
<span style="width: 40px; height: 40px; border-radius: 12px; background: #0F3B40; color: #77DCE5; display: flex; align-items: center; justify-content: center"><span class="material-symbols-rounded" aria-hidden="true">directions_car</span></span>
<span style="display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 16px; font-weight: 600">Fleet</span>
<span style="font-size: 13px; font-weight: 600; color: #FFB4AB">2 services overdue</span>
</span>
</button>

<div style="position: relative; background: #1C1E24; border-radius: 20px; padding: 14px 14px 12px; display: flex; flex-direction: column; justify-content: space-between; min-height: 0">
<div style="display: flex; justify-content: space-between; align-items: flex-start">
<span style="width: 40px; height: 40px; border-radius: 12px; background: #33265A; color: #CDBDFF; display: flex; align-items: center; justify-content: center"><span class="material-symbols-rounded" aria-hidden="true">graphic_eq</span></span>
<button aria-label="{{recAria}}" onClick="{{toggleRec}}" style="width: 44px; height: 44px; margin: -4px -4px 0 0; border-radius: 22px; background: {{recBg}}; display: flex; align-items: center; justify-content: center">
<sc-if value="{{notRecording}}" hint-placeholder-val="{{ true }}"><span style="width: 16px; height: 16px; border-radius: 8px; background: #FF6B5E; display: block"></span></sc-if>
<sc-if value="{{recording}}" hint-placeholder-val="{{ false }}"><span style="width: 14px; height: 14px; border-radius: 3px; background: #FFDAD5; display: block"></span></sc-if>
</button>
</div>
<button style="display: flex; flex-direction: column; gap: 1px; text-align: left">
<span style="font-size: 16px; font-weight: 600">Recordings</span>
<span style="font-size: 13px; font-weight: {{recWeight}}; color: {{recStatusColor}}">{{recStatus}}</span>
</button>
</div>

<button style="background: #1C1E24; border-radius: 20px; padding: 14px 14px 12px; display: flex; flex-direction: column; justify-content: space-between; text-align: left; min-height: 0">
<span style="width: 40px; height: 40px; border-radius: 12px; background: #4A2A12; color: #FFB77C; display: flex; align-items: center; justify-content: center"><span class="material-symbols-rounded" aria-hidden="true">newspaper</span></span>
<span style="display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 16px; font-weight: 600">News</span>
<span style="font-size: 13px; color: #A9ADB8">Feeds and newsletters</span>
</span>
</button>

<button style="background: #1C1E24; border-radius: 20px; padding: 14px 14px 12px; display: flex; flex-direction: column; justify-content: space-between; text-align: left; min-height: 0">
<span style="width: 40px; height: 40px; border-radius: 12px; background: #262E57; color: #B9C3FF; display: flex; align-items: center; justify-content: center"><span class="material-symbols-rounded" aria-hidden="true">bar_chart</span></span>
<span style="display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 16px; font-weight: 600">Reports</span>
<span style="font-size: 13px; color: #A9ADB8">Spending, groceries</span>
</span>
</button>

</div>
</div>

<div style="flex-shrink: 0; padding: 10px 16px 14px; background: #16181D; border-top: 1px solid #23262D">
<button style="width: 100%; height: 52px; border-radius: 26px; background: #733423; color: #FFDBD1; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; font-weight: 600"><span class="material-symbols-rounded" aria-hidden="true">mic</span>Tap to talk</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    var rec = !!(this.state && this.state.recording);
    return {
      recording: rec,
      notRecording: !rec,
      recAria: rec ? 'Stop recording' : 'Start recording',
      recBg: rec ? '#8C1D18' : '#2A2D34',
      recStatus: rec ? 'Recording now' : '12 saved',
      recStatusColor: rec ? '#FFB4AB' : '#A9ADB8',
      recWeight: rec ? '600' : '400',
      toggleRec: () => this.setState({ recording: !rec }),
    };
  }
}
</script>
</body>
</html>
