<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Direction B - Calm Apple</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
*{margin:0}
html{color-scheme:light dark}
html[data-theme=light]{color-scheme:light}
html[data-theme=dark]{color-scheme:dark}
body{background:var(--canvas);color:var(--ink);min-width:1500px;-webkit-font-smoothing:antialiased;line-height:1.35}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--focus,currentColor);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.num{font-variant-numeric:tabular-nums}

/* board */
.topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:10px 28px}
.board{padding:28px 28px 90px;max-width:1500px;margin:0 auto}
.grp{margin-bottom:60px}
.grp-h{display:flex;align-items:baseline;gap:12px;margin-bottom:18px}
.phones{display:flex;gap:44px;align-items:flex-start;padding-left:10px}
.ab figcaption{margin:0 0 14px 4px;display:flex;gap:10px;align-items:center}
.desks{display:flex;flex-direction:column;gap:56px}

/* phone frame */
.phone{position:relative;width:390px;height:844px;border-radius:46px;overflow:hidden;display:flex;flex-direction:column;isolation:isolate;
  box-shadow:0 0 0 9px var(--bezel),0 0 0 10px rgba(255,255,255,.08),0 34px 60px -22px rgba(0,0,0,.45)}
.phone::after{content:"";position:absolute;left:50%;bottom:8px;width:134px;height:5px;border-radius:3px;background:var(--ink);opacity:.85;transform:translateX(-50%);z-index:40;pointer-events:none}
.status{flex:none;height:44px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 34px;font-size:15px;font-weight:600;position:relative;z-index:2}
.status .si{display:flex;gap:6px;align-items:center}
.status .bat{width:25px;height:12px;border:1.5px solid currentColor;border-radius:4px;position:relative;opacity:.9}
.status .bat::before{content:"";position:absolute;inset:1.5px;right:5px;background:currentColor;border-radius:1.5px}
.status .sig{display:flex;gap:2px;align-items:flex-end;height:11px}.status .sig i{width:3px;background:currentColor;border-radius:1px}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

/* sheet plumbing */
.sheet-host{position:absolute;inset:0;pointer-events:none;z-index:30}
.sheet-host[data-open=true]{pointer-events:auto}
.scrim{position:absolute;inset:0;opacity:0;transition:opacity .28s ease;background:var(--scrim,rgba(0,0,0,.4))}
[data-open=true]>.scrim{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;transform:translateY(104%);transition:transform .36s cubic-bezier(.2,.85,.25,1);display:flex;flex-direction:column;max-height:92%}
[data-open=true]>.sheet{transform:none}
.toast{position:absolute;left:50%;bottom:104px;transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:.25s;z-index:45;max-width:330px;text-align:center;font-size:14px;padding:11px 16px}
.toast[data-on=true]{opacity:1;transform:translate(-50%,0)}
.sheet-body{overflow:auto}

/* desk frame */
.desk{position:relative;width:1440px;height:900px;display:flex;overflow:hidden}
.desk>main{flex:1;min-width:0;display:flex;flex-direction:column}

/* menu (the one popover) */
.menu{position:fixed;z-index:200;min-width:190px;max-height:340px;overflow:auto;padding:6px;display:flex;flex-direction:column}
.menu-opt{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:36px;padding:6px 10px;white-space:nowrap}
.menu-opt .menu-tick{width:16px;height:16px;opacity:0}
.menu-opt[aria-selected=true] .menu-tick{opacity:1}

@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}

:root{
  --bg:light-dark(oklch(0.962 0.005 255),oklch(0.135 0.004 255));
  --card:light-dark(oklch(1 0 0),oklch(0.215 0.006 255));
  --ink:light-dark(oklch(0.2 0.01 265),oklch(0.97 0.002 255));
  --sec:light-dark(oklch(0.54 0.014 265),oklch(0.7 0.012 260));
  --sep:light-dark(oklch(0.915 0.004 260),oklch(0.31 0.006 260));
  --fill:light-dark(oklch(0.935 0.005 260),oklch(0.28 0.006 260));
  --ring:light-dark(oklch(0.78 0.008 260),oklch(0.5 0.01 260));
  --blue:light-dark(oklch(0.6 0.2 257),oklch(0.69 0.17 252));
  --blue-tint:light-dark(oklch(0.955 0.03 255),oklch(0.3 0.07 255));
  --green:light-dark(oklch(0.75 0.2 150),oklch(0.76 0.19 150));
  --pink:light-dark(oklch(0.66 0.22 5),oklch(0.7 0.2 5));
  --pink-tint:light-dark(oklch(0.96 0.03 5),oklch(0.3 0.08 5));
  --pink-text:light-dark(oklch(0.54 0.21 5),oklch(0.79 0.14 5));
  --unv-bg:light-dark(oklch(0.95 0.06 75),oklch(0.32 0.07 65));
  --unv-fg:light-dark(oklch(0.48 0.13 55),oklch(0.84 0.12 75));
  --canvas:light-dark(oklch(0.9 0.006 255),oklch(0.09 0.004 255));
  --bezel:light-dark(oklch(0.22 0.01 265),oklch(0.05 0.003 255));
  --focus:var(--blue);
  --scrim:light-dark(oklch(0.2 0.02 260 / .3),oklch(0 0 0 / .55));
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;letter-spacing:-.006em}
h1,h2,h3{font-weight:700}
.muted{color:var(--sec);font-size:13px}
.topbar{background:color-mix(in oklab,var(--canvas) 85%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--sep)}
.tb-l{display:flex;align-items:baseline;gap:12px}.tb-l b{font-size:13px;color:var(--sec);font-weight:600}
.tb-name{font-size:19px;font-weight:700;letter-spacing:-.02em}.tb-note{font-size:13px;color:var(--sec)}
.tt{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px 0 11px;border-radius:999px;background:var(--fill);font-size:13.5px;font-weight:500}
.tt .ic{width:17px;height:17px}.tt .moon{display:none}
html[data-eff=dark] .tt .sun{display:none}html[data-eff=dark] .tt .moon{display:inline}
.grp-h h2{font-size:28px;letter-spacing:-.025em}.grp-h span{color:var(--sec);font-size:14px}
.ab figcaption{font-size:13px;color:var(--sec)}
.ab figcaption b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:12px}
.phone{background:var(--bg)}
.status{color:var(--ink)}

/* atoms */
.m{display:flex;flex-direction:column;min-width:0;flex:1}
.m b{font-weight:500;font-size:16px;display:block;width:fit-content;max-width:100%;
  background:linear-gradient(currentColor,currentColor) no-repeat 0 58%/0% 1.5px;transition:background-size .3s ease,color .25s}
.m small{font-size:13px;color:var(--sec);margin-top:1px}.m small:empty{display:none}
.sh{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:500;color:var(--pink-text);white-space:nowrap;flex:none}
.sh .ic{width:15px;height:15px}
.sh.big{background:var(--pink-tint);padding:6px 12px 6px 9px;border-radius:999px;font-size:13.5px}.sh.big .ic{width:16px;height:16px}
.pv{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--sec);white-space:nowrap;flex:none}.pv .ic{width:14px;height:14px}
.bar{width:4px;height:34px;border-radius:2px;background:var(--pink);flex:none}.bar.gray{background:var(--ring)}
.unv{background:var(--unv-bg);color:var(--unv-fg);border-radius:999px;padding:.05em .55em .1em;font-weight:500;white-space:nowrap}
.fig{font-weight:600;font-variant-numeric:tabular-nums}
.figwrap{display:inline-flex;align-items:baseline;gap:8px}
.foot{font-size:13px;color:var(--sec);padding:7px 16px 0}
.lico{width:30px;height:30px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;flex:none}.lico .ic{width:16px;height:16px}
.chk{width:44px;height:44px;display:grid;place-items:center;flex:none;border-radius:50%}
.chk .ic{width:24px;height:24px;padding:5px;border:1.5px solid var(--ring);border-radius:50%;stroke:transparent;stroke-width:3.4;transition:background .18s,border-color .18s,stroke .18s}
.chk[aria-checked=true] .ic{background:var(--blue);border-color:var(--blue);stroke:#fff;animation:pop .36s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{0%{transform:scale(.8)}55%{transform:scale(1.16)}100%{transform:scale(1)}}
@keyframes arrive{0%{opacity:0;transform:translateX(-14px)}100%{opacity:1;transform:none}}
.done .m b{color:var(--sec);background-size:100% 1.5px}
.tbtn{color:var(--blue);font-size:15px;min-height:32px;padding:0 6px;white-space:nowrap}.tbtn:hover{opacity:.75}
.tbtn.strong{font-weight:600}
.pillbtn{height:34px;padding:0 16px;border-radius:999px;background:var(--blue);color:#fff;font-size:14px;font-weight:600}

/* grouped lists */
.sec{margin-top:8px;padding:0 16px}
.gh{font-size:17px;font-weight:700;letter-spacing:-.015em;padding:0 4px 5px}.gh span{font-weight:400;color:var(--sec);font-size:14px;margin-left:6px}
.g{background:var(--card);border-radius:12px;overflow:hidden}
.g>*{position:relative}
.g>*+*::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--sep)}
.g>.td+.td::before,.g>.gr+.gr::before{left:50px}

/* phone */
.navrow{display:flex;justify-content:space-between;align-items:center;height:38px;padding:0 12px 0 20px}
.dt{font-size:13px;font-weight:600;color:var(--sec)}
.navbtn{width:40px;height:40px;border-radius:50%;background:var(--card);color:var(--blue);display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.navbtn .ic{width:21px;height:21px;stroke-width:2}
.lt{font-size:32px;line-height:1.1;letter-spacing:-.03em;padding:0 20px 2px}
.ev{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:5px 16px}
.td{display:flex;align-items:center;gap:2px;min-height:44px;padding:0 16px 0 6px}
.td .m,.gr .m{padding-left:4px}
.td .sh,.td .pv{margin-left:6px}
.grohd{display:flex;align-items:center;gap:10px;padding:6px 14px 4px 12px}
.grohd b{font-size:17px;font-weight:600;margin-right:auto}
.grohd .chev,.ls .chev{width:16px;height:16px;color:var(--ring)}
.gp{display:flex;align-items:center;gap:13px;height:28px;padding:0 16px 0 20px;font-size:16px;position:relative}
.gp::before{content:"";position:absolute;top:0;left:20px;right:0;height:1px;background:var(--sep)}
.gp i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ring);flex:none}
.more{font-size:14px;color:var(--sec);padding:3px 16px 6px 51px;border-top:1px solid var(--sep)}.more:empty{display:none}
.kv{display:flex;justify-content:space-between;align-items:center;min-height:40px;padding:0 16px;font-size:17px}
.kv>span:first-child{font-size:16px}
.tabbar{flex:none;display:flex;height:74px;padding:5px 4px 20px;border-top:1px solid var(--sep);background:color-mix(in oklab,var(--bg) 80%,transparent);backdrop-filter:blur(20px)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:500;color:var(--sec);min-height:44px}
.tabbar button .ic{width:25px;height:25px;stroke-width:1.6}
.tabbar button[aria-current=page]{color:var(--blue)}.tabbar button[aria-current=page] .ic{stroke-width:2}
.back{display:inline-flex;align-items:center;color:var(--blue);font-size:17px;min-height:44px;margin-left:-8px}.back .ic{width:24px;height:24px}
.shline{display:flex;align-items:center;gap:12px;padding:6px 20px 12px}
.cnt2{font-size:13.5px;color:var(--sec)}
.scroll>.g{margin:0 16px}
.gr{display:flex;align-items:center;gap:2px;min-height:44px;padding:0 16px 0 6px;transition:background .3s}
.gr .m b{font-size:17px;font-weight:400}.gr.done{min-height:54px}
.gr .side{font-size:14px;color:var(--sec)}
.gr.ticking{background:var(--blue-tint)}
.gr.fresh{animation:arrive .45s ease}
.emptyline{padding:22px 20px;color:var(--sec)}
.addbar{flex:none;display:flex;align-items:center;gap:10px;margin:6px 16px 8px;padding:0 6px 0 16px;height:50px;background:var(--card);border-radius:25px;box-shadow:0 2px 12px -2px rgba(0,0,0,.18),0 0 0 1px var(--sep)}
.addbar .ic{color:var(--blue)}
.addbar input{flex:1;min-width:0;border:0;background:transparent;font-size:17px;outline:none;height:100%}
.addgo{height:38px;padding:0 16px;border-radius:19px;background:var(--blue);color:#fff;font-weight:600;font-size:15px}

/* sheet */
.sheet{background:var(--bg);border-radius:16px 16px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.25);padding-bottom:30px}
.grab{width:36px;height:5px;border-radius:3px;background:var(--ring);margin:7px auto 0;opacity:.6}
.sh-hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:52px;padding:0 10px}
.sh-hd h2{font-size:17px;font-weight:600;letter-spacing:-.01em}.sh-hd .tbtn{min-height:44px;font-size:17px;justify-self:start}.sh-hd .tbtn.strong{justify-self:end}
.sheet-body{padding:4px 16px 4px;display:flex;flex-direction:column;gap:14px}
.fgroup{background:var(--card);border-radius:12px;overflow:hidden}
.fgroup>*{position:relative}.fgroup>*+*::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--sep)}
.frow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px;padding:0 16px;font-size:17px;width:100%}
.frow .inp{border:0;background:transparent;height:44px;outline:none;font-size:17px;padding:0;flex:1;min-width:0}
.frow .inp.r{text-align:right;flex:none;width:auto}
.frow .inp:focus-visible{outline:none}
.rv{display:flex;align-items:center;gap:6px;color:var(--sec)}.rv .ic{width:15px;height:15px}
.switch{width:51px;height:31px;border-radius:16px;background:var(--ring);position:relative;transition:background .22s;flex:none}
.switch::after{content:"";position:absolute;inset:-7px -4px}
.switch i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .24s cubic-bezier(.3,1.3,.5,1);box-shadow:0 2px 4px rgba(0,0,0,.28)}
.switch[aria-checked=true]{background:var(--green)}.switch[aria-checked=true] i{transform:translateX(20px)}
.seg.two{display:grid;grid-template-columns:1fr 1fr;padding:2px;gap:2px;background:var(--fill);border-radius:10px}
.seg.two button{display:flex;align-items:center;justify-content:center;gap:7px;height:44px;border-radius:8px;font-size:15px;font-weight:500;color:var(--sec)}
.seg.two .ic{width:17px;height:17px}
.seg.two button[aria-checked=true]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.14)}
.seg.two [data-val=Shared][aria-checked=true]{color:var(--pink-text)}
.segwrap .foot{padding:8px 4px 0}
.err{font-size:13px;color:var(--unv-fg);margin:-8px 4px 0}
.toast{background:color-mix(in oklab,var(--ink) 90%,transparent);color:var(--bg);border-radius:999px}
.menu{background:color-mix(in oklab,var(--card) 90%,transparent);backdrop-filter:blur(24px);border-radius:14px;box-shadow:0 12px 44px -6px rgba(0,0,0,.3),0 0 0 1px var(--sep);padding:5px}
.menu-opt{border-radius:9px;font-size:15px;min-height:40px}.menu-opt:hover,.menu-opt:focus-visible{background:var(--fill);outline:none}
.menu-opt .menu-tick{color:var(--blue)}

/* desktop */
.desk{background:var(--bg);border-radius:12px;box-shadow:0 0 0 1px var(--sep),0 30px 60px -30px rgba(0,0,0,.35)}
.rail{width:236px;flex:none;background:color-mix(in oklab,var(--card) 50%,var(--bg));border-right:1px solid var(--sep);padding:16px 12px 16px;display:flex;flex-direction:column}
.search{height:32px;background:var(--fill);border-radius:9px;display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--sec);font-size:14px;margin-bottom:14px}.search .ic{width:15px;height:15px}
.rail nav{display:flex;flex-direction:column;gap:1px}
.ri{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:8px;font-size:14.5px;color:var(--ink)}
.ri .ic{width:18px;height:18px;color:var(--sec)}
.ri:hover{background:var(--fill)}
.ri[aria-current=page]{background:var(--blue-tint);color:var(--blue);font-weight:600}.ri[aria-current=page] .ic{color:var(--blue)}
.rail hr{border:0;border-top:1px solid var(--sep);margin:9px 6px}
.who{margin-top:auto;display:flex;align-items:center;padding:0 8px}.who small{margin-left:10px;color:var(--sec);font-size:13px}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;border:2px solid var(--bg);color:#fff}
.av.k{background:oklch(0.62 0.04 255)}.av.m{background:oklch(0.55 0.05 300);margin-left:-8px}
.tool{height:52px;flex:none;padding:0 28px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--sep);background:color-mix(in oklab,var(--card) 60%,var(--bg))}
.tool .dt{font-weight:500;font-size:13.5px}
.legend{display:flex;gap:16px}
.desk .lt{font-size:34px;padding:20px 28px 10px}
.hdr-actions{display:flex;gap:14px;align-items:center}
.dgrid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 410px;gap:20px;padding:4px 28px 24px}
.agenda{display:flex;flex-direction:column;min-height:0}
.stateline{font-size:13px;color:var(--sec);padding:7px 12px;background:var(--fill);border-radius:9px;margin-bottom:8px}.stateline b{color:var(--ink);font-weight:600}
.g.ag{flex:1;min-height:0;overflow:auto}
.agday>*+*::before{display:none}
.dh{position:sticky;top:0;z-index:1;height:26px;background:var(--fill);padding:0 16px;display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--sec);text-transform:uppercase;letter-spacing:.04em}
.dh b{font-weight:700;color:var(--ink)}.agday.today .dh b{color:var(--blue)}
.ar{display:flex;align-items:center;gap:12px;min-height:42px;padding:0 16px;position:relative}
.ar+.ar::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--sep)}
.ar .t{width:68px;flex:none;font-size:13.5px;color:var(--sec)}
.ar .bar{position:absolute;left:0;top:9px;bottom:9px;height:auto;width:3px}
.ar .m{flex-direction:row;align-items:baseline;gap:10px}.ar .m b{font-size:15px}
.ar .sh,.ar .pv{margin-left:auto}
.chk.sm{width:34px;height:34px;margin-left:-6px}.chk.sm .ic{width:21px;height:21px;padding:4px}
.slot{width:28px;flex:none}
.none{font-size:14px;color:var(--sec);padding:12px 16px}
.col{display:flex;flex-direction:column;gap:6px;min-height:0}
.col .sec,.col>section{margin:0}
.ghrow{display:flex;justify-content:space-between;align-items:baseline}
.dec{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 16px}.dec .m b{font-size:14.5px}
.mrow{display:grid;grid-template-columns:104px 56px 1fr;gap:10px;align-items:center;padding:10px 16px}
.mrow>.fig,.mrow>.figwrap{justify-self:end;font-size:17px}
.lab2{font-size:14px;color:var(--sec)}
.bars{display:flex;gap:3px;align-items:flex-end;height:38px}
.bars i{flex:1;border-radius:2px 2px 1px 1px;background:var(--ring)}
.bars i.part{background:transparent;border:1.5px dashed var(--sec)}
.ls{display:flex;align-items:center;gap:12px;padding:8px 14px 8px 14px;min-height:52px}
.ls .m b{font-size:15px}.ls .cnt2{margin-right:2px}
.mbody{flex:1;min-height:0;display:flex;padding-left:28px}
.tbl-wrap{flex:1;min-width:0;display:flex;flex-direction:column;padding:0 22px 24px 0}
.strip{display:flex;gap:30px;align-items:baseline;padding:13px 16px;background:var(--card);border-radius:12px;font-size:15px;margin-bottom:12px}
.strip>span:first-child{color:var(--sec)}.strip b{font-weight:600}
.chips{display:flex;align-items:center;gap:8px;margin-bottom:12px}.chips .grow{flex:1}
.chip{height:32px;padding:0 12px;border-radius:999px;background:var(--fill);font-size:13.5px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.chip .ic{width:14px;height:14px;color:var(--sec)}
.chip.on,.chip[aria-pressed=true]{background:var(--blue);color:#fff}.chip.on .ic{color:#fff}
.chip .cnt{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;background:var(--unv-bg);color:var(--unv-fg);font-size:12px;padding:0 5px}
.chip[aria-pressed=true] .cnt{background:rgba(255,255,255,.25);color:#fff}
.tscroll{flex:1;min-height:0;overflow:auto;border-radius:12px;background:var(--card)}
.tbl{width:100%;border-collapse:collapse;table-layout:fixed;font-size:14px}
.tbl th{position:sticky;top:0;z-index:1;background:var(--card);text-align:left;font-size:12px;font-weight:500;color:var(--sec);height:36px;padding:0 12px;border-bottom:1px solid var(--sep)}
.tbl td{height:44px;padding:0 12px;border-bottom:1px solid var(--sep);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl .r,.tbl th.r{text-align:right}.sec2{color:var(--sec)}
.tbl tbody tr:hover{background:color-mix(in oklab,var(--ink) 3%,transparent)}
.tbl tr.sel{background:var(--blue-tint)}
.tbl td.pos{color:var(--ink);font-weight:500}
.catbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 9px;margin-left:-9px;border-radius:8px;font-size:14px;max-width:100%}
.catbtn span{overflow:hidden;text-overflow:ellipsis}.catbtn .ic{width:14px;height:14px;color:var(--sec)}
.catbtn:hover{background:var(--fill)}
.catbtn.uncat{background:var(--blue-tint);color:var(--blue);font-weight:500}.catbtn.uncat .ic{color:var(--blue)}
.panel{width:330px;flex:none;border-left:1px solid var(--sep);padding:22px 20px;overflow:auto;background:color-mix(in oklab,var(--card) 40%,var(--bg))}
.eyebrow{font-size:13px;font-weight:600;color:var(--sec)}
.panel h3{font-size:22px;margin-top:6px;letter-spacing:-.02em;line-height:1.2}
.panel .big{font-size:32px;font-weight:700;letter-spacing:-.03em;margin:4px 0 16px}
.panel .fgroup .frow{font-size:14.5px;min-height:44px}.frow .sm{font-size:12.5px;color:var(--sec);text-align:right}
.panel .frow>span:first-child{color:var(--sec)}
.menubtn{display:inline-flex;align-items:center;gap:6px;color:var(--blue);font-size:14.5px;min-height:36px}.menubtn .ic{width:14px;height:14px}
.notice{margin-top:16px;padding:13px 15px;border-radius:12px;font-size:14px}.notice p{margin-top:6px}
.unvbox{background:var(--unv-bg)}.unvw{color:var(--unv-fg);font-size:15px}
.okbox{background:var(--card)}.okw{font-weight:600}
.gro>*+*::before{display:none}

</style>
</head>

(() => {

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------------- theme: follows the system, the toggle overrides ---------------- */

function paintTheme() {

mq.addEventListener('change', paintTheme);

  sel: 'x2',
  moved: null,
};
const ACCT = { checking: 'BofA checking', card: 'BofA card' };
const MONTH = { Oct: 'October', Sep: 'September' };

/* ---------------- templates ---------------- */
const T = {};
function loadTemplates() { $$('template[data-tpl]').forEach(t => { T[t.dataset.tpl] = t.innerHTML; }); }
function fill(name, o) {
  const html = (T[name] || '').replace(/\{\{(\w+)\}\}/g, (m, k) => (o[k] == null ? '' : esc(o[k])));
  const d = document.createElement(/^\s*<tr/i.test(html) ? 'tbody' : 'div'); d.innerHTML = html;
  $$('[data-if]', d).forEach(e => { if (!o[e.dataset.if]) e.remove(); });
  $$('[data-ifnot]', d).forEach(e => { if (o[e.dataset.ifnot]) e.remove(); });
  return d;
}
const frag = d => { const f = document.createDocumentFragment(); while (d.firstChild) f.appendChild(d.firstChild); return f; };

const fmt12 = t24 => { const [h, m] = t24.split(':').map(Number); return `${((h + 11) % 12) + 1}:${String(m).padStart(2, '0')} ${h < 12 ? 'am' : 'pm'}`; };
const money = n => (n < 0 ? '−' : '+') + '$' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const moneyPlain = n => '$' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const plural = (n, a, b) => `${n} ${n === 1 ? a : b}`;
const open = () => S.groceries.filter(g => !g.done);
const done = () => S.groceries.filter(g => g.done);
const needCat = () => S.tx.filter(t => !t.cat);

/* ---------------- renderers ---------------- */
function renderTodos() {
  $$('[data-render="todos"]').forEach(c => c.replaceChildren(...S.todos.map(t => frag(fill('todo', {
    ...t, cls: t.done ? 'done' : '', checked: String(t.done), shared: t.kind === 'shared', mine: t.kind === 'mine' }))
    ).flatMap(f => Array.from(f.childNodes))));
}
function renderEvents() {
  const evs = S.events.slice().sort((a, b) => (a.allDay ? -1 : 0) - (b.allDay ? -1 : 0) || (a.time24 || '').localeCompare(b.time24 || ''));
  $$('[data-render="events"]').forEach(c => c.replaceChildren(...evs.flatMap(e => Array.from(frag(fill('event', {
    ...e, time: e.allDay ? 'All day' : fmt12(e.time24), evcls: e.kind === 'shared' ? 'pk' : 'pn', sub: [e.allDay ? 'All day' : fmt12(e.time24), e.meta].filter(Boolean).join(' · '), shared: e.kind === 'shared', mine: e.kind === 'mine' })).childNodes))));
}
function renderGroceries() {
  const o = open(), d = done();
  $$('[data-render="gpreview"]').forEach(c => c.replaceChildren(...o.slice(0, 3).flatMap(g => Array.from(frag(fill('gpreview', g)).childNodes))));
  $$('[data-render="gopen"]').forEach(c => c.replaceChildren(...o.flatMap(g => Array.from(frag(fill('grow', {
    ...g, checked: 'false', cls: '', tickline: '' })).childNodes))));
  $$('[data-render="gdone"]').forEach(c => c.replaceChildren(...d.flatMap(g => Array.from(frag(fill('grow', {
    ...g, checked: 'true', cls: 'done' + (S.moved === g.id ? ' fresh' : ''), tickline: `Ticked ${g.tickedAt} by ${g.tickedBy}` })).childNodes))));
  S.moved = null;
}
function renderAgenda() {
  $$('[data-render="agenda"]').forEach(c => {
    c.replaceChildren(...S.agenda.flatMap(day => {
      const dEl = fill('agday', { ...day, empty: day.rows.length === 0, todayCls: day.today ? 'today' : '', dnum: day.date.replace(/\D/g, '') });
      const holder = $('[data-rows]', dEl);
      if (holder) day.rows.forEach(r => holder.append(...frag(fill('agrow', {
        ...r, evcls: r.kind === 'shared' ? 'pk' : 'pn', shared: r.kind === 'shared', canvas: r.kind === 'canvas', tick: !!r.tick, cls: r.done ? 'done' : '', checked: String(!!r.done) })).childNodes));
      return Array.from(frag(dEl).childNodes);
    }));
  });
}
function renderLists() {
  const items = S.lists.map(l => l.key === 'groceries'
    ? { ...l, count: open().length ? `${open().length} to get` : 'Nothing left to get', meta: `Shared with ${'Mia'}${done().length ? ` · ${done().length} ticked` : ''}` }
    : l);
  $$('[data-render="lists"]').forEach(c => c.replaceChildren(...items.flatMap(l => Array.from(frag(fill('listsum', l)).childNodes))));
}
function filteredTx() {
  const f = S.filter;
  return S.tx.filter(t => (f.acct === 'all' || t.acct === f.acct) && (f.month === 'all' || t.m === f.month) && (!f.need || !t.cat));
}
function txRow(t) {
  return {
    ...t, acctLabel: ACCT[t.acct], amtText: money(t.amt), amtCls: t.amt < 0 ? 'neg' : 'pos', uncat: !t.cat, uncatCls: t.cat ? '' : 'uncat', catText: t.cat || 'Choose category',
    statusText: t.prov ? 'unverified' : 'Verified', cls: (t.prov ? 'prov ' : '') + (S.sel === t.id ? 'sel' : ''), selected: String(S.sel === t.id),
  };
}
function renderTx() {
  const rows = filteredTx();
  $$('[data-render="tx"]').forEach(c => {
    c.replaceChildren(...rows.flatMap(t => Array.from(frag(fill('txrow', txRow(t))).childNodes)));
  });
  const t = S.tx.find(x => x.id === S.sel);
  $$('[data-render="txpanel"]').forEach(c => {
    c.replaceChildren(...(t ? Array.from(frag(fill('txpanel', {
      ...txRow(t), source: t.prov ? 'BofA_card_export_Oct.csv' : 'Statement, September 2026.pdf',
      explain: t.prov
        ? 'This row came from a card export that prints no total, so there is nothing to check it against yet. It is replaced when this month’s statement is added.'
        : 'This row was checked against the statement’s own printed total and balances.',
    })).childNodes) : []));
  });
}
function bind() {
  const o = open(), d = done(), n = needCat().length, shown = filteredTx().length, left = S.todos.filter(t => !t.done).length;
  const v = {
    groceryMore: o.length > 3 ? `and ${o.length - 3} more` : (o.length ? '' : 'Nothing left to get'),
    openCount: String(o.length), openLabel: o.length ? `${o.length} to get` : 'All ticked', doneCount: String(d.length),
    todoLeft: left ? `${left} left` : 'All ticked',
    needCat: String(n), needCatLabel: n ? `${plural(n, 'transaction needs', 'transactions need')} a category` : 'Every transaction has a category',
    txShown: `Showing ${shown} of 47 rows`,
    acctLabel: S.filter.acct === 'all' ? 'All accounts' : ACCT[S.filter.acct],
    monthLabel: S.filter.month === 'all' ? 'All months' : MONTH[S.filter.month],
    unvCount: String(S.tx.filter(t => t.prov).length),
  };
  $$('[data-bind]').forEach(e => { const k = e.dataset.bind; if (k in v) e.textContent = v[k]; });
  const show = { noneOpen: o.length === 0, hasDone: d.length > 0, hasOpen: o.length > 0, needAny: n > 0, needNone: n === 0, hasMore: o.length > 3 };
  $$('[data-show]').forEach(e => { e.hidden = !show[e.dataset.show]; });
  $$('[data-chip="need"]').forEach(e => e.setAttribute('aria-pressed', String(S.filter.need)));
  $$('[data-chip="acct"],[data-chip="month"]').forEach(e => e.classList.toggle('on', S.filter[e.dataset.chip === 'acct' ? 'acct' : 'month'] !== 'all'));
}
function renderAll() { renderTodos(); renderEvents(); renderGroceries(); renderAgenda(); renderLists(); renderTx(); bind(); }

/* ---------------- menu (one popover for every select) ---------------- */
let menuEl = null, menuAnchor = null;
function closeMenu(refocus) { if (menuEl) { menuEl.remove(); menuEl = null; if (refocus && menuAnchor) menuAnchor.focus(); } }
function openMenu(anchor, options, current, onPick) {
  closeMenu(); menuAnchor = anchor;
  const m = document.createElement('div'); m.className = 'menu'; m.setAttribute('role', 'listbox');
  options.forEach(o => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'menu-opt'; b.setAttribute('role', 'option');
    b.setAttribute('aria-selected', String(o === current));
    b.innerHTML = `<span>${esc(o)}</span><svg class="ic menu-tick" aria-hidden="true"><use href="#i-check"/></svg>`;
    b.addEventListener('click', ev => { ev.stopPropagation(); onPick(o); closeMenu(true); });
    m.appendChild(b);
  });
  m.addEventListener('keydown', e => {
    const bs = $$('.menu-opt', m), i = bs.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') { e.preventDefault(); bs[(i + 1) % bs.length].focus(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); bs[(i - 1 + bs.length) % bs.length].focus(); }
    if (e.key === 'Escape') { e.preventDefault(); closeMenu(true); }
  });
  document.body.appendChild(m);
  const r = anchor.getBoundingClientRect(), mh = m.offsetHeight, mw = m.offsetWidth;
  let top = r.bottom + 6; if (top + mh > innerHeight - 8) top = Math.max(8, r.top - mh - 6);
  m.style.top = top + 'px'; m.style.left = Math.max(8, Math.min(r.left, innerWidth - mw - 8)) + 'px';
  menuEl = m; ($('[aria-selected="true"]', m) || m.firstChild).focus();
}

/* ---------------- sheet ---------------- */
function hostOf(el) { return el.closest('.phone').querySelector('.sheet-host'); }
function sheetOpen(host, evId) {
  const sh = $('.sheet', host), ev = evId && S.events.find(e => e.id === evId);
  sh.dataset.editing = ev ? ev.id : '';
  $$('[data-sheet-title]', sh).forEach(e => { e.textContent = ev ? 'Edit event' : 'New event'; });
  $$('[data-sheet-save]', sh).forEach(e => { e.textContent = ev ? 'Save' : 'Add'; });
  $('[name=title]', sh).value = ev ? ev.title : '';
  $('[name=date]', sh).value = TODAY;
  $('[name=time]', sh).value = ev && ev.time24 ? ev.time24 : '09:00';
  setSwitch($('[data-switch="allday"]', sh), !!(ev && ev.allDay));
  setSeg($('[data-seg="repeat"]', sh), 'Never');
  setMenuVal($('[data-key="remind"]', sh), '30 minutes before');
  setMenuVal($('[data-key="repeat"]', sh), 'Never');
  setSeg($('[data-seg="share"]', sh), ev && ev.kind === 'mine' ? 'Only me' : 'Shared');
  $('[data-err]', sh).hidden = true;
  host.dataset.open = 'true';
  host.setAttribute('aria-hidden', 'false');
}
function sheetClose(host) { host.dataset.open = 'false'; host.setAttribute('aria-hidden', 'true'); }
function setSwitch(btn, on) { if (!btn) return; btn.setAttribute('aria-checked', String(on)); const sh = btn.closest('.sheet'); $$('[data-timerow]', sh).forEach(r => { r.hidden = on; }); }
function setSeg(group, val) { if (!group) return; $$('[data-val]', group).forEach(b => b.setAttribute('aria-checked', String(b.dataset.val === val))); group.dataset.value = val; }
function setMenuVal(btn, val) { if (!btn) return; const v = $('.menu-val', btn); if (v) v.textContent = val; btn.dataset.value = val; }
function toast(host, msg) {
  const t = $('.toast', host.closest('.phone')); if (!t) return;
  t.textContent = msg; t.dataset.on = 'true'; clearTimeout(t._h); t._h = setTimeout(() => { t.dataset.on = 'false'; }, 2600);
}
function sheetSave(sheet) {
  const host = sheet.closest('.sheet-host'), title = $('[name=title]', sheet).value.trim();
  if (!title) { const er = $('[data-err]', sheet); er.hidden = false; $('[name=title]', sheet).focus(); return; }
  const allDay = $('[data-switch="allday"]', sheet).getAttribute('aria-checked') === 'true';
  const kind = $('[data-seg="share"]', sheet).dataset.value === 'Only me' ? 'mine' : 'shared';
  const date = $('[name=date]', sheet).value, time24 = $('[name=time]', sheet).value || '09:00';
  const editing = sheet.dataset.editing;
  if (editing) {
    Object.assign(S.events.find(e => e.id === editing), { title, allDay, kind, time24 });
    toast(host, 'Event saved');
  } else if (date === TODAY) {
    S.events.push({ id: 'e' + Date.now(), title, time24, allDay, kind, meta: '' });
    toast(host, kind === 'shared' ? 'Added to today, shared with Kevin' : 'Added to today, only you can see it');
  } else {
    toast(host, 'Saved for ' + new Date(date + 'T12:00').toLocaleDateString('en-US', { weekday: 'short', day: 'numeric', month: 'short' }) + ', not on today’s list');
  }
  sheetClose(host); renderAll();
}

/* ---------------- ticks ---------------- */
function whoOf(el) { const w = el.closest('[data-who]'); return w ? w.dataset.who : 'Mia'; }
function tickTodo(btn) {
  const t = S.todos.find(x => x.id === btn.dataset.id); t.done = !t.done;
  $$(`[data-act="tick-todo"][data-id="${t.id}"]`).forEach(b => { b.setAttribute('aria-checked', String(t.done)); b.closest('[data-row]').classList.toggle('done', t.done); });
  bind();
}
function tickAgenda(btn) {
  let r; S.agenda.forEach(d => d.rows.forEach(x => { if (x.id === btn.dataset.id) r = x; })); r.done = !r.done;
  $$(`[data-act="tick-agenda"][data-id="${r.id}"]`).forEach(b => { b.setAttribute('aria-checked', String(r.done)); b.closest('[data-row]').classList.toggle('done', r.done); });
}
function tickGrocery(btn) {
  const g = S.groceries.find(x => x.id === btn.dataset.id), row = btn.closest('[data-row]');
  const next = !g.done; row.classList.add('ticking'); btn.setAttribute('aria-checked', String(next)); row.classList.toggle('done', next);
  const who = whoOf(btn);
  setTimeout(() => {
    g.done = next; if (next) { g.tickedBy = who; g.tickedAt = 'just now'; } S.moved = g.id; renderGroceries(); renderLists(); bind();
  }, 520);
}

/* ---------------- clicks ---------------- */
document.addEventListener('click', e => {
  if (menuEl && !e.target.closest('.menu')) closeMenu(false);
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act;
  if (a === 'theme') setTheme(eff() === 'dark' ? 'light' : 'dark');
  else if (a === 'tick-todo') tickTodo(t);
  else if (a === 'tick-agenda') tickAgenda(t);
  else if (a === 'tick-grocery') tickGrocery(t);
  else if (a === 'tab') { const g = t.closest('[data-tabs]'); $$('[data-act="tab"]', g).forEach(b => b.removeAttribute('aria-current')); t.setAttribute('aria-current', 'page'); if (t.dataset.goto) { const el = document.getElementById(t.dataset.goto); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } }
  else if (a === 'open-sheet') sheetOpen(hostOf(t));
  else if (a === 'edit-event') sheetOpen(hostOf(t), t.dataset.id);
  else if (a === 'close-sheet') sheetClose(t.closest('.sheet-host'));
  else if (a === 'save-sheet') sheetSave(t.closest('.sheet'));
  else if (a === 'seg') { setSeg(t.closest('[data-seg]'), t.dataset.val); }
  else if (a === 'switch') { setSwitch(t, t.getAttribute('aria-checked') !== 'true'); }
  else if (a === 'menu') { openMenu(t, t.dataset.options.split('|'), t.dataset.value, v => setMenuVal(t, v)); }
  else if (a === 'cat') {
    e.stopPropagation(); S.sel = t.dataset.id; const tx = S.tx.find(x => x.id === t.dataset.id);
    renderTx();
    const anchor = $(`[data-render="tx"] [data-act="cat"][data-id="${tx.id}"]`, t.closest('.desk') || document);
    openMenu(anchor || t, ['No category'].concat(CATS), tx.cat || 'No category', v => { tx.cat = v === 'No category' ? '' : v; renderTx(); bind(); });
  }
  else if (a === 'cat-panel') {
    const tx = S.tx.find(x => x.id === S.sel);
    openMenu(t, ['No category'].concat(CATS), tx.cat || 'No category', v => { tx.cat = v === 'No category' ? '' : v; renderTx(); bind(); });
  }
  else if (a === 'sel-tx') { if (e.target.closest('[data-act="cat"]')) return; S.sel = t.dataset.id; renderTx(); }
  else if (a === 'chip') {
    const k = t.dataset.chip;
    if (k === 'need') { S.filter.need = !S.filter.need; renderTx(); bind(); }
    else if (k === 'acct') openMenu(t, ['All accounts', 'BofA checking', 'BofA card'], bindLabel('acct'), v => { S.filter.acct = v === 'All accounts' ? 'all' : (v === 'BofA card' ? 'card' : 'checking'); renderTx(); bind(); });
    else if (k === 'month') openMenu(t, ['All months', 'October', 'September'], bindLabel('month'), v => { S.filter.month = v === 'All months' ? 'all' : (v === 'October' ? 'Oct' : 'Sep'); renderTx(); bind(); });
  }
  else if (a === 'review-uncat') { S.filter.need = true; S.filter.acct = 'all'; S.filter.month = 'all'; renderTx(); bind(); const el = document.getElementById('ab5'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  else if (a === 'clear-filters') { S.filter = { acct: 'all', month: 'all', need: false }; renderTx(); bind(); }
});
function bindLabel(k) { return k === 'acct' ? (S.filter.acct === 'all' ? 'All accounts' : ACCT[S.filter.acct]) : (S.filter.month === 'all' ? 'All months' : MONTH[S.filter.month]); }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (menuEl) { closeMenu(true); return; } $$('.sheet-host[data-open="true"]').forEach(h => { if (!h.closest('[data-pinned-open]')) sheetClose(h); }); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr[data-act="sel-tx"]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-add-item]'); if (!f) return; e.preventDefault();
  const inp = $('input', f), name = inp.value.trim(); if (!name) return;
  S.groceries.push({ id: 'g' + Date.now(), name, meta: '', by: whoOf(f), done: false });
  inp.value = ''; renderGroceries(); renderLists(); bind();
  const lastRow = $$('[data-render="gopen"] [data-row]', f.closest('.phone')).pop(); if (lastRow) { lastRow.classList.add('fresh'); lastRow.scrollIntoView({ block: 'nearest' }); }
  inp.focus();
});

/* ---------------- boot ---------------- */
function boot() {
  loadTemplates();
  $$('[data-clone-of]').forEach(p => { const src = document.getElementById(p.dataset.cloneOf); $('.screen', p).innerHTML = $('.screen', src).innerHTML; });
  $$('.sheet-host').forEach(h => { h.innerHTML = T.sheet; h.dataset.open = h.hasAttribute('data-start-open') ? 'true' : 'false'; h.setAttribute('aria-hidden', h.dataset.open === 'true' ? 'false' : 'true'); });
  $$('[data-rail]').forEach(r => { r.innerHTML = T.rail; $$('[data-key]', r).forEach(b => { if (b.dataset.key === r.dataset.rail) b.setAttribute('aria-current', 'page'); }); });
  renderAll();
  $$('.sheet-host[data-start-open]').forEach(h => sheetOpen(h, null));
  paintTheme();
}
document.addEventListener('DOMContentLoaded', boot);
window.__legion = { S, renderAll };
})();

</script>
</body>
