<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Direction C - Soft Material light</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
*{margin:0}
html{color-scheme:light dark}
html[data-theme=light]{color-scheme:light}
html[data-theme=dark]{color-scheme:dark}
body{background:var(--canvas);color:var(--ink);min-width:1500px;-webkit-font-smoothing:antialiased;line-height:1.35}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--focus,currentColor);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.num{font-variant-numeric:tabular-nums}

/* board */
.topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:10px 28px}
.board{padding:28px 28px 90px;max-width:1500px;margin:0 auto}
.grp{margin-bottom:60px}
.grp-h{display:flex;align-items:baseline;gap:12px;margin-bottom:18px}
.phones{display:flex;gap:44px;align-items:flex-start;padding-left:10px}
.ab figcaption{margin:0 0 14px 4px;display:flex;gap:10px;align-items:center}
.desks{display:flex;flex-direction:column;gap:56px}

/* phone frame */
.phone{position:relative;width:390px;height:844px;border-radius:46px;overflow:hidden;display:flex;flex-direction:column;isolation:isolate;
  box-shadow:0 0 0 9px var(--bezel),0 0 0 10px rgba(255,255,255,.08),0 34px 60px -22px rgba(0,0,0,.45)}
.phone::after{content:"";position:absolute;left:50%;bottom:8px;width:134px;height:5px;border-radius:3px;background:var(--ink);opacity:.85;transform:translateX(-50%);z-index:40;pointer-events:none}
.status{flex:none;height:44px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 34px;font-size:15px;font-weight:600;position:relative;z-index:2}
.status .si{display:flex;gap:6px;align-items:center}
.status .bat{width:25px;height:12px;border:1.5px solid currentColor;border-radius:4px;position:relative;opacity:.9}
.status .bat::before{content:"";position:absolute;inset:1.5px;right:5px;background:currentColor;border-radius:1.5px}
.status .sig{display:flex;gap:2px;align-items:flex-end;height:11px}.status .sig i{width:3px;background:currentColor;border-radius:1px}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

/* sheet plumbing */
.sheet-host{position:absolute;inset:0;pointer-events:none;z-index:30}
.sheet-host[data-open=true]{pointer-events:auto}
.scrim{position:absolute;inset:0;opacity:0;transition:opacity .28s ease;background:var(--scrim,rgba(0,0,0,.4))}
[data-open=true]>.scrim{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;transform:translateY(104%);transition:transform .36s cubic-bezier(.2,.85,.25,1);display:flex;flex-direction:column;max-height:92%}
[data-open=true]>.sheet{transform:none}
.toast{position:absolute;left:50%;bottom:104px;transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:.25s;z-index:45;max-width:330px;text-align:center;font-size:14px;padding:11px 16px}
.toast[data-on=true]{opacity:1;transform:translate(-50%,0)}
.sheet-body{overflow:auto}

/* desk frame */
.desk{position:relative;width:1440px;height:900px;display:flex;overflow:hidden}
.desk>main{flex:1;min-width:0;display:flex;flex-direction:column}

/* menu (the one popover) */
.menu{position:fixed;z-index:200;min-width:190px;max-height:340px;overflow:auto;padding:6px;display:flex;flex-direction:column}
.menu-opt{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:36px;padding:6px 10px;white-space:nowrap}
.menu-opt .menu-tick{width:16px;height:16px;opacity:0}
.menu-opt[aria-selected=true] .menu-tick{opacity:1}

@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}

:root{
  --bg:light-dark(oklch(0.98 0.004 285),oklch(0.17 0.006 285));
  --bg2:light-dark(oklch(0.965 0.009 285),oklch(0.215 0.007 285));
  --s1:light-dark(oklch(0.958 0.009 285),oklch(0.215 0.007 285));
  --s2:light-dark(oklch(0.938 0.012 285),oklch(0.25 0.008 285));
  --s3:light-dark(oklch(0.915 0.014 285),oklch(0.29 0.009 285));
  --ink:light-dark(oklch(0.22 0.012 285),oklch(0.93 0.006 285));
  --var:light-dark(oklch(0.48 0.016 285),oklch(0.75 0.012 285));
  --outline:light-dark(oklch(0.72 0.014 285),oklch(0.52 0.012 285));
  --outv:light-dark(oklch(0.88 0.01 285),oklch(0.34 0.01 285));
  --pri:light-dark(oklch(0.5 0.15 275),oklch(0.78 0.11 275));
  --on-pri:light-dark(oklch(1 0 0),oklch(0.25 0.1 275));
  --pri-c:light-dark(oklch(0.915 0.05 275),oklch(0.34 0.09 275));
  --on-pri-c:light-dark(oklch(0.3 0.12 275),oklch(0.92 0.04 275));
  --pk:light-dark(oklch(0.6 0.19 355),oklch(0.74 0.15 355));
  --pk-c:light-dark(oklch(0.925 0.055 355),oklch(0.34 0.09 355));
  --on-pk-c:light-dark(oklch(0.33 0.13 355),oklch(0.92 0.05 355));
  --unv-c:light-dark(oklch(0.93 0.07 75),oklch(0.36 0.07 70));
  --unv-on:light-dark(oklch(0.38 0.09 60),oklch(0.9 0.08 80));
  --ok:light-dark(oklch(0.5 0.12 160),oklch(0.78 0.12 160));
  --ok-c:light-dark(oklch(0.92 0.05 160),oklch(0.33 0.06 160));
  --canvas:light-dark(oklch(0.915 0.01 285),oklch(0.11 0.005 285));
  --bezel:light-dark(oklch(0.24 0.012 285),oklch(0.06 0.004 285));
  --focus:var(--pri);
  --scrim:light-dark(oklch(0.2 0.03 285 / .4),oklch(0 0 0 / .55));
  font-family:'Roboto Flex','Google Sans Text',Roboto,system-ui,sans-serif;
}
body{font-family:'Roboto Flex','Google Sans Text',Roboto,system-ui,sans-serif;font-size:15px}
h1,h2,h3{font-weight:500}
.muted{color:var(--var);font-size:13px}
.topbar{background:color-mix(in oklab,var(--canvas) 86%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--outv)}
.tb-l{display:flex;align-items:baseline;gap:12px}.tb-l b{font-size:13px;color:var(--var);font-weight:500}
.tb-name{font-size:19px;font-weight:500}.tb-note{font-size:13px;color:var(--var)}
.tt{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px 0 12px;border-radius:18px;background:var(--pri-c);color:var(--on-pri-c);font-size:13.5px;font-weight:500}
.tt .ic{width:17px;height:17px}.tt .moon{display:none}
html[data-eff=dark] .tt .sun{display:none}html[data-eff=dark] .tt .moon{display:inline}
.grp-h h2{font-size:28px}.grp-h span{color:var(--var);font-size:14px}
.ab figcaption{font-size:13px;color:var(--var)}
.ab figcaption b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:12px}
.phone{background:var(--bg)}.status{color:var(--ink)}

/* atoms */
.m{display:flex;flex-direction:column;min-width:0;flex:1}
.m b{font-weight:500;font-size:15px;display:block;width:fit-content;max-width:100%;
  background:linear-gradient(currentColor,currentColor) no-repeat 0 58%/0% 1.5px;transition:background-size .3s ease,color .25s}
.m small{font-size:12.5px;opacity:.72}.m small:empty{display:none}
.pkchip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 11px 0 8px;border-radius:13px;background:var(--pk-c);color:var(--on-pk-c);font-size:12.5px;font-weight:500;white-space:nowrap;flex:none}
.pkchip .ic{width:15px;height:15px}
.pkchip.big{height:32px;font-size:13.5px;padding:0 14px 0 10px;border-radius:16px}.pkchip.big .ic{width:17px;height:17px}
.pvchip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 4px;font-size:12.5px;color:var(--var);white-space:nowrap;flex:none}.pvchip .ic{width:14px;height:14px}
.unv{background:var(--unv-c);color:var(--unv-on);border-radius:999px;padding:.05em .62em .12em;font-weight:500;white-space:nowrap}
.fig{font-weight:600;font-variant-numeric:tabular-nums}
.figwrap{display:inline-flex;align-items:baseline;gap:8px}
.achip{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none}.achip .ic{width:17px;height:17px}
.achip.green{background:var(--ok-c);color:var(--ok)}.achip.amber{background:var(--unv-c);color:var(--unv-on)}
.filled{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 24px;border-radius:22px;background:var(--pri);color:var(--on-pri);font-weight:500;font-size:14.5px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.filled:hover{filter:brightness(1.08)}
.tonal{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 20px;border-radius:20px;background:var(--pri-c);color:var(--on-pri-c);font-weight:500;font-size:14px;white-space:nowrap}
.tonal.sm{height:36px;padding:0 15px;font-size:13.5px}.tonal:hover{filter:brightness(.97)}
.textbtn{color:var(--pri);height:40px;padding:0 14px;border-radius:20px;font-weight:500;font-size:14px;white-space:nowrap}.textbtn:hover{background:var(--pri-c)}
.chk{width:44px;height:44px;display:grid;place-items:center;flex:none;margin-left:-8px;border-radius:50%}
.chk .ic{width:24px;height:24px;padding:3px;border:2px solid var(--outline);border-radius:8px;stroke:transparent;stroke-width:3.4;transition:background .2s,border-color .2s,stroke .2s}
.chk[aria-checked=true] .ic{background:var(--pri);border-color:var(--pri);stroke:var(--on-pri);animation:pop .4s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{0%{transform:scale(.8)}55%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes arrive{0%{opacity:0;transform:scale(.96)}100%{opacity:1;transform:none}}
.done .m b{opacity:.62;background-size:100% 1.5px}

/* phone */
.hd{display:flex;justify-content:space-between;align-items:center;padding:6px 20px 4px 22px}
.hd h1{font-size:27px;line-height:1.15;letter-spacing:-.01em}
.date{font-size:13.5px;color:var(--var);margin-top:2px}
.fab{width:48px;height:48px;border-radius:16px;background:var(--pri-c);color:var(--on-pri-c);display:grid;place-items:center;flex:none;box-shadow:0 2px 8px -2px rgba(60,40,140,.35)}
.fab:hover{filter:brightness(.96)}.fab .ic{width:24px;height:24px;stroke-width:2.1}
.blk{padding:8px 16px 0}
.lab{font-size:13.5px;font-weight:500;color:var(--var);padding:0 6px 5px}
.evs{display:flex;flex-direction:column;gap:5px}
.ev{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:4px 10px 4px 16px;border-radius:18px}
.ev.pk{background:var(--pk-c);color:var(--on-pk-c)}
.ev.pn{background:var(--s2)}
.ev .t{width:62px;flex:none;font-size:13px;opacity:.8}
.ev.pk .pkchip{background:color-mix(in oklch,var(--pk) 22%,var(--pk-c))}
.card{margin:7px 16px 0;background:var(--s1);border-radius:24px;padding:4px 14px 6px}
.cardhd{display:flex;align-items:center;gap:10px;min-height:36px}
.cardhd h3{font-size:16px;margin-right:auto}
.td{display:flex;align-items:center;gap:2px;min-height:44px}
.td .m{padding-left:6px}
.td .pkchip,.td .pvchip{margin-left:6px}
.pkchip.sm{height:24px;font-size:12px}
.gprev{margin-top:0}
.gp{display:flex;align-items:center;gap:12px;height:24px;font-size:15px;padding-left:4px}
.gp i{width:14px;height:14px;border-radius:5px;border:2px solid var(--outline);flex:none}
.more{font-size:13.5px;color:var(--var);padding:2px 0 2px 30px}.more:empty{display:none}
.spend .acct{display:flex;justify-content:space-between;font-size:16px;min-height:34px;align-items:center}
.spend .acct>span:first-child{color:var(--var);font-size:15px}
.tabbar{flex:none;display:flex;height:78px;padding:8px 8px 22px;background:var(--s2)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--var);min-height:44px}
.pillic{width:60px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .2s}
.pillic .ic{width:23px;height:23px}
.tabbar button[aria-current=page]{color:var(--ink);font-weight:600}
.tabbar button[aria-current=page] .pillic{background:var(--pri-c);color:var(--on-pri-c)}
.lhd{padding:2px 20px 6px 14px}
.roundbtn{width:44px;height:44px;border-radius:50%;background:var(--s2);display:grid;place-items:center}
.lhd h1{font-size:30px;margin:6px 0 0 8px;letter-spacing:-.01em}
.shline{display:flex;align-items:center;gap:12px;margin:10px 0 0 8px}
.card.flush{padding:4px 8px 4px 14px;margin-top:6px}
.card.low{background:transparent;box-shadow:inset 0 0 0 1px var(--outv)}
.gr{display:flex;align-items:center;gap:2px;min-height:44px;border-radius:14px;padding-right:6px;transition:background .3s}
.gr .m{padding-left:6px}.gr .m b{font-size:16px;font-weight:400}.gr.done{min-height:54px}
.gr .side{font-size:13px;color:var(--var)}
.gr.ticking{background:var(--pri-c)}
.gr.fresh{animation:arrive .5s ease}
.pad{padding:14px 22px 6px}.pad .num{margin-left:4px}
.emptyline{padding:22px 24px;color:var(--var)}
.addbar{flex:none;display:flex;align-items:center;gap:10px;margin:6px 16px 8px;padding:0 6px 0 18px;height:54px;background:var(--s3);border-radius:27px}
.addbar .ic{color:var(--var)}
.addbar input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;outline:none;height:100%}
.addbar:focus-within{box-shadow:0 0 0 2px var(--pri)}
.addgo{height:42px;padding:0 20px;border-radius:21px;background:var(--pri);color:var(--on-pri);font-weight:500;font-size:14.5px}

/* sheet */
.sheet{background:var(--bg2);border-radius:28px 28px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25);padding:0 20px 30px}
.grab{width:32px;height:4px;border-radius:2px;background:var(--outline);margin:12px auto 4px;opacity:.7}
.sh-title{font-size:22px;margin:4px 0 12px 2px}
.sheet-body{display:flex;flex-direction:column;gap:12px}
.tf{display:flex;flex-direction:column;gap:0;background:var(--s2);border-radius:16px 16px 6px 6px;padding:8px 16px 4px;border-bottom:2px solid var(--outline);flex:1;min-width:0;min-height:58px;position:relative;text-align:left}
.tf>span:first-child{font-size:12px;color:var(--var)}
.tf input{border:0;background:transparent;font-size:16px;height:30px;outline:none;min-width:0;width:100%}
.tf:focus-within{border-bottom-color:var(--pri);background:var(--s3)}
.menutf .menu-val{font-size:16px;height:30px;display:flex;align-items:center}
.menutf>.ic{position:absolute;right:14px;top:20px;width:20px;height:20px;color:var(--var)}
.fldrow{display:flex;gap:10px}
.line{display:flex;align-items:center;justify-content:space-between;min-height:44px;font-size:16px;padding:0 4px 0 2px}
.switch{width:52px;height:32px;border-radius:16px;border:2px solid var(--outline);background:var(--s3);position:relative;transition:background .2s,border-color .2s;flex:none}
.switch::after{content:"";position:absolute;inset:-8px -4px}
.switch i{position:absolute;top:50%;left:6px;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:var(--outline);transition:all .22s cubic-bezier(.3,1.3,.5,1)}
.switch[aria-checked=true]{background:var(--pri);border-color:var(--pri)}
.switch[aria-checked=true] i{left:22px;width:24px;height:24px;margin-top:-12px;background:var(--on-pri)}
.lbl{font-size:12.5px;color:var(--var);display:block;margin:0 0 6px 4px}
.seg.chips{display:flex;gap:5px}
.seg.chips button{flex:1;display:flex;align-items:center;justify-content:center;gap:3px;min-width:0;height:44px;padding:0 4px;border-radius:22px;border:1px solid var(--outline);font-size:13px;font-weight:500;white-space:nowrap}
.seg .tk{display:none;width:15px;height:15px;stroke-width:2.4}
.seg.chips button[aria-checked=true]{background:var(--pri-c);color:var(--on-pri-c);border-color:transparent}
.seg button[aria-checked=true] .tk{display:inline}
.seg.two{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--outline);border-radius:22px;overflow:hidden}
.seg.two button{display:flex;align-items:center;justify-content:center;gap:8px;height:46px;font-size:15px;font-weight:500;color:var(--var)}
.seg.two button+button{border-left:1px solid var(--outline)}
.seg.two .ic{width:18px;height:18px}
.seg.two button[aria-checked=true] .ic:not(.tk){display:none}
.seg.two button[aria-checked=true]{background:var(--s3);color:var(--ink)}
.seg.two [data-val=Shared][aria-checked=true]{background:var(--pk-c);color:var(--on-pk-c)}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:2px}
.err{font-size:13px;color:var(--unv-on);margin:-6px 0 0 6px}
.toast{background:var(--ink);color:var(--bg);border-radius:14px}
.menu{background:var(--bg2);border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.25),0 0 0 1px var(--outv);padding:8px}
.menu-opt{border-radius:12px;font-size:14.5px;min-height:42px;padding:6px 14px}.menu-opt:hover,.menu-opt:focus-visible{background:var(--s3);outline:none}
.menu-opt[aria-selected=true]{background:var(--pri-c);color:var(--on-pri-c)}.menu-opt .menu-tick{color:var(--on-pri-c)}

/* desktop */
.desk{background:var(--bg);border-radius:28px;box-shadow:0 0 0 1px var(--outv),0 30px 60px -30px rgba(0,0,0,.4)}
.rail{width:96px;flex:none;background:var(--s1);padding:22px 0 18px;display:flex;flex-direction:column;align-items:center}
.railfab{width:56px;height:56px;border-radius:18px;background:var(--pri-c);color:var(--on-pri-c);display:grid;place-items:center;margin-bottom:18px;box-shadow:0 2px 8px -2px rgba(60,40,140,.35)}
.railfab .ic{width:26px;height:26px;stroke-width:2}
.rail nav{display:flex;flex-direction:column;align-items:center;gap:2px}
.ri{display:flex;flex-direction:column;align-items:center;gap:3px;width:84px;height:58px;font-size:12px;font-weight:500;color:var(--var);padding-top:4px}
.ri .pillic{width:56px;height:32px;border-radius:16px}.ri .pillic .ic{width:22px;height:22px}
.ri:hover .pillic{background:var(--s3)}
.ri[aria-current=page]{color:var(--ink);font-weight:600}.ri[aria-current=page] .pillic{background:var(--pri-c);color:var(--on-pri-c)}
.rail hr{border:0;border-top:1px solid var(--outv);width:44px;margin:8px 0}
.who{margin-top:auto;display:flex;flex-direction:column;align-items:center}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;border:2px solid var(--s1)}
.av.k{background:var(--pri-c);color:var(--on-pri-c)}.av.m{background:var(--pk-c);color:var(--on-pk-c);margin-top:-8px}
.dhd{display:flex;justify-content:space-between;align-items:flex-end;padding:26px 32px 12px 36px;gap:20px}
.dhd h1{font-size:32px;line-height:1.1;letter-spacing:-.012em}
.sub{font-size:14.5px;color:var(--var);margin-top:4px}
.legend{display:flex;gap:10px;align-items:center}
.hdr-actions{display:flex;gap:10px;align-items:center}
.dgrid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 420px;gap:16px;padding:4px 28px 24px 28px}
.panelc{background:var(--s1);border-radius:28px;padding:16px 22px}
.panelc .cardhd{min-height:40px;margin-bottom:4px}.panelc .cardhd h2{font-size:19px;margin-right:auto}
.agenda{display:flex;flex-direction:column;min-height:0;padding-bottom:10px}
.stateline{font-size:13px;color:var(--var);padding:9px 14px;background:var(--s3);border-radius:14px;margin-bottom:8px}.stateline b{color:var(--ink);font-weight:600}
.ag{flex:1;min-height:0;overflow:auto;padding-right:2px}
.agday{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:5px 0}
.dl{display:flex;flex-direction:column;align-items:center;padding-top:2px}
.dl small{font-size:12px;color:var(--var);font-weight:500}
.dl b{font-size:18px;font-weight:500;display:grid;place-items:center;width:34px;height:34px;border-radius:50%}
.agday.today .dl b{background:var(--pri);color:var(--on-pri)}
.agday.today .dl small{color:var(--pri);font-weight:700}
.ar{display:flex;align-items:center;gap:10px;min-height:36px;padding:2px 10px 2px 14px;border-radius:14px;margin-bottom:4px}
.ar.pk{background:var(--pk-c);color:var(--on-pk-c)}.ar.pn{background:var(--s2)}
.ar.pk .pkchip{background:color-mix(in oklch,var(--pk) 22%,var(--pk-c))}
.ar .t{width:68px;flex:none;font-size:13px;opacity:.8}
.ar .m{flex-direction:row;align-items:baseline;gap:10px}
.ar .pkchip,.ar .pvchip{margin-left:auto}
.chk.sm{width:32px;height:32px;margin:0 -4px 0 -6px}.chk.sm .ic{width:20px;height:20px;padding:2px;border-radius:6px}
.none{display:flex;align-items:center;min-height:36px;padding-left:14px;font-size:14px;color:var(--var);border-radius:14px;box-shadow:inset 0 0 0 1px var(--outv)}
.col{display:flex;flex-direction:column;gap:12px;min-height:0}
.dec{display:flex;align-items:center;gap:12px;padding:8px 0}.dec .m b{font-size:14.5px}.dec .m small{opacity:.7}
.money .fig,.money .figwrap{font-size:18px}
.mrow{display:grid;grid-template-columns:88px 60px 1fr;gap:12px;align-items:center;padding:8px 0}
.mrow>.fig,.mrow>.figwrap{justify-self:end}
.lab2{font-size:14px;color:var(--var)}
.bars{display:flex;gap:3px;align-items:flex-end;height:40px}
.bars i{flex:1;border-radius:4px 4px 2px 2px;background:var(--pri-c)}
.bars i.part{background:transparent;border:1.5px dashed var(--pri)}
.asof{font-size:12.5px;color:var(--var);margin-top:6px}
.ls{display:flex;align-items:center;gap:10px;padding:8px 0;min-height:52px}.ls .m b{font-size:14.5px}.cnt2{font-size:13.5px;color:var(--var)}
.mbody{flex:1;min-height:0;display:flex;gap:16px;padding:0 28px 24px 36px}
.tbl-wrap{flex:1;min-width:0;display:flex;flex-direction:column}
.strip{display:flex;gap:30px;align-items:baseline;padding:13px 20px;background:var(--s1);border-radius:20px;font-size:15px;margin-bottom:12px}
.strip>span:first-child{color:var(--var)}.strip b{font-weight:600}
.chips{display:flex;align-items:center;gap:8px;margin-bottom:12px}.chips .grow{flex:1}
.chip{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--outline);font-size:14px;display:inline-flex;gap:6px;align-items:center;font-weight:500}
.chip .ic{width:16px;height:16px;color:var(--var)}.chip .tk{display:none;color:inherit}
.chip.on,.chip[aria-pressed=true]{background:var(--pri-c);color:var(--on-pri-c);border-color:transparent}
.chip[aria-pressed=true] .tk{display:inline}.chip.on .ic{color:inherit}
.chip .cnt{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;background:var(--unv-c);color:var(--unv-on);font-size:12px;padding:0 5px}
.tscroll{flex:1;min-height:0;overflow:auto;background:var(--s1);border-radius:28px;padding:4px 10px 6px}
.tbl{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:14px}
.tbl th{position:sticky;top:0;z-index:1;background:var(--s1);text-align:left;font-size:12.5px;font-weight:500;color:var(--var);height:42px;padding:0 12px}
.tbl td{height:46px;padding:0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl td:first-child{border-radius:14px 0 0 14px}.tbl td:last-child{border-radius:0 14px 14px 0}
.tbl .r,.tbl th.r{text-align:right}.sec2{color:var(--var)}
.tbl tbody tr:hover td{background:var(--s2)}
.tbl tr.sel td{background:var(--pri-c);color:var(--on-pri-c)}
.tbl tr.sel td.sec2{color:color-mix(in oklch,var(--on-pri-c) 72%,transparent)}
.tbl td.pos{color:var(--ok);font-weight:500}
.catbtn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 8px 0 12px;border-radius:16px;border:1px solid var(--outline);font-size:13.5px;max-width:100%;background:var(--bg)}
.catbtn span{overflow:hidden;text-overflow:ellipsis}.catbtn .ic{width:16px;height:16px;color:var(--var)}
.catbtn:hover{background:var(--s2)}
.catbtn.uncat{border-style:dashed;border-color:var(--pri);color:var(--pri)}.catbtn.uncat .ic{color:var(--pri)}
.tbl tr.sel .catbtn{color:var(--ink)}.tbl tr.sel .catbtn.uncat{color:var(--pri)}
.panel{width:336px;flex:none;background:var(--s1);border-radius:28px;padding:26px 24px;overflow:auto}
.eyebrow{font-size:13px;font-weight:500;color:var(--var)}
.panel h3{font-size:23px;margin-top:6px;line-height:1.2}
.panel .big{font-size:32px;font-weight:600;margin:6px 0 16px;letter-spacing:-.01em}
.panel dl{display:grid;grid-template-columns:72px 1fr;gap:9px 8px;font-size:14px;padding:14px 0}
.panel dt{color:var(--var)}.panel dd{margin:0;word-break:break-word}
.panel .fld{margin-top:4px}
.menubtn{display:inline-flex;align-items:center;justify-content:space-between;gap:8px;width:100%;height:46px;padding:0 14px 0 16px;border-radius:14px;background:var(--s2);border-bottom:2px solid var(--outline);font-size:15px}
.menubtn .ic{width:18px;height:18px;color:var(--var)}
.panel .lbl{margin-left:2px}
.notice{margin-top:18px;padding:14px 16px;border-radius:20px;font-size:14px}.notice p{margin-top:6px}
.unvbox{background:var(--unv-c);color:var(--unv-on)}.unvbox p{color:var(--ink)}.unvw{font-size:15px}
.okbox{background:var(--ok-c)}.okw{color:var(--ok);font-weight:600}

.tbl tbody tr.sel:hover td{background:var(--pri-c)}

</style>
</head>

const ACCT = { checking: 'BofA checking', card: 'BofA card' };
const MONTH = { Oct: 'October', Sep: 'September' };

/* ---------------- templates ---------------- */
const T = {};
function loadTemplates() { $$('template[data-tpl]').forEach(t => { T[t.dataset.tpl] = t.innerHTML; }); }
function fill(name, o) {
  const html = (T[name] || '').replace(/\{\{(\w+)\}\}/g, (m, k) => (o[k] == null ? '' : esc(o[k])));
  const d = document.createElement(/^\s*<tr/i.test(html) ? 'tbody' : 'div'); d.innerHTML = html;

  $$('[data-ifnot]', d).forEach(e => { if (o[e.dataset.ifnot]) e.remove(); });
  return d;
}
const frag = d => { const f = document.createDocumentFragment(); while (d.firstChild) f.appendChild(d.firstChild); return f; };

const moneyPlain = n => '$' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

const done = () => S.groceries.filter(g => g.done);
const needCat = () => S.tx.filter(t => !t.cat);

  $$('[data-show]').forEach(e => { e.hidden = !show[e.dataset.show]; });
  $$('[data-chip="need"]').forEach(e => e.setAttribute('aria-pressed', String(S.filter.need)));
  $$('[data-chip="acct"],[data-chip="month"]').forEach(e => e.classList.toggle('on', S.filter[e.dataset.chip === 'acct' ? 'acct' : 'month'] !== 'all'));
}
function renderAll() { renderTodos(); renderEvents(); renderGroceries(); renderAgenda(); renderLists(); renderTx(); bind(); }

/* ---------------- menu (one popover for every select) ---------------- */
let menuEl = null, menuAnchor = null;
function closeMenu(refocus) { if (menuEl) { menuEl.remove(); menuEl = null; if (refocus && menuAnchor) menuAnchor.focus(); } }
function openMenu(anchor, options, current, onPick) {
  closeMenu(); menuAnchor = anchor;
  const m = document.createElement('div'); m.className = 'menu'; m.setAttribute('role', 'listbox');
  options.forEach(o => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'menu-opt'; b.setAttribute('role', 'option');
    b.setAttribute('aria-selected', String(o === current));
    b.innerHTML = `<span>${esc(o)}</span><svg class="ic menu-tick" aria-hidden="true"><use href="#i-check"/></svg>`;
    b.addEventListener('click', ev => { ev.stopPropagation(); onPick(o); closeMenu(true); });
    m.appendChild(b);
  });
  m.addEventListener('keydown', e => {
    const bs = $$('.menu-opt', m), i = bs.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') { e.preventDefault(); bs[(i + 1) % bs.length].focus(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); bs[(i - 1 + bs.length) % bs.length].focus(); }
    if (e.key === 'Escape') { e.preventDefault(); closeMenu(true); }
  });
  document.body.appendChild(m);
  const r = anchor.getBoundingClientRect(), mh = m.offsetHeight, mw = m.offsetWidth;
  let top = r.bottom + 6; if (top + mh > innerHeight - 8) top = Math.max(8, r.top - mh - 6);
  m.style.top = top + 'px'; m.style.left = Math.max(8, Math.min(r.left, innerWidth - mw - 8)) + 'px';
  menuEl = m; ($('[aria-selected="true"]', m) || m.firstChild).focus();
}

/* ---------------- sheet ---------------- */
function hostOf(el) { return el.closest('.phone').querySelector('.sheet-host'); }
function sheetOpen(host, evId) {
  const sh = $('.sheet', host), ev = evId && S.events.find(e => e.id === evId);
  sh.dataset.editing = ev ? ev.id : '';
  $$('[data-sheet-title]', sh).forEach(e => { e.textContent = ev ? 'Edit event' : 'New event'; });
  $$('[data-sheet-save]', sh).forEach(e => { e.textContent = ev ? 'Save' : 'Add'; });
  $('[name=title]', sh).value = ev ? ev.title : '';
  $('[name=date]', sh).value = TODAY;
  $('[name=time]', sh).value = ev && ev.time24 ? ev.time24 : '09:00';
  setSwitch($('[data-switch="allday"]', sh), !!(ev && ev.allDay));
  setSeg($('[data-seg="repeat"]', sh), 'Never');
  setMenuVal($('[data-key="remind"]', sh), '30 minutes before');
  setMenuVal($('[data-key="repeat"]', sh), 'Never');
  setSeg($('[data-seg="share"]', sh), ev && ev.kind === 'mine' ? 'Only me' : 'Shared');
  $('[data-err]', sh).hidden = true;
  host.dataset.open = 'true';
  host.setAttribute('aria-hidden', 'false');
}
function sheetClose(host) { host.dataset.open = 'false'; host.setAttribute('aria-hidden', 'true'); }
function setSwitch(btn, on) { if (!btn) return; btn.setAttribute('aria-checked', String(on)); const sh = btn.closest('.sheet'); $$('[data-timerow]', sh).forEach(r => { r.hidden = on; }); }
function setSeg(group, val) { if (!group) return; $$('[data-val]', group).forEach(b => b.setAttribute('aria-checked', String(b.dataset.val === val))); group.dataset.value = val; }
function setMenuVal(btn, val) { if (!btn) return; const v = $('.menu-val', btn); if (v) v.textContent = val; btn.dataset.value = val; }
function toast(host, msg) {
  const t = $('.toast', host.closest('.phone')); if (!t) return;
  t.textContent = msg; t.dataset.on = 'true'; clearTimeout(t._h); t._h = setTimeout(() => { t.dataset.on = 'false'; }, 2600);
}
function sheetSave(sheet) {
  const host = sheet.closest('.sheet-host'), title = $('[name=title]', sheet).value.trim();
  if (!title) { const er = $('[data-err]', sheet); er.hidden = false; $('[name=title]', sheet).focus(); return; }
  const allDay = $('[data-switch="allday"]', sheet).getAttribute('aria-checked') === 'true';
  const kind = $('[data-seg="share"]', sheet).dataset.value === 'Only me' ? 'mine' : 'shared';
  const date = $('[name=date]', sheet).value, time24 = $('[name=time]', sheet).value || '09:00';
  const editing = sheet.dataset.editing;
  if (editing) {
    Object.assign(S.events.find(e => e.id === editing), { title, allDay, kind, time24 });
    toast(host, 'Event saved');
  } else if (date === TODAY) {
    S.events.push({ id: 'e' + Date.now(), title, time24, allDay, kind, meta: '' });
    toast(host, kind === 'shared' ? 'Added to today, shared with Kevin' : 'Added to today, only you can see it');
  } else {
    toast(host, 'Saved for ' + new Date(date + 'T12:00').toLocaleDateString('en-US', { weekday: 'short', day: 'numeric', month: 'short' }) + ', not on today’s list');
  }
  sheetClose(host); renderAll();
}

/* ---------------- ticks ---------------- */
function whoOf(el) { const w = el.closest('[data-who]'); return w ? w.dataset.who : 'Mia'; }
function tickTodo(btn) {
  const t = S.todos.find(x => x.id === btn.dataset.id); t.done = !t.done;
  $$(`[data-act="tick-todo"][data-id="${t.id}"]`).forEach(b => { b.setAttribute('aria-checked', String(t.done)); b.closest('[data-row]').classList.toggle('done', t.done); });
  bind();
}
function tickAgenda(btn) {
  let r; S.agenda.forEach(d => d.rows.forEach(x => { if (x.id === btn.dataset.id) r = x; })); r.done = !r.done;
  $$(`[data-act="tick-agenda"][data-id="${r.id}"]`).forEach(b => { b.setAttribute('aria-checked', String(r.done)); b.closest('[data-row]').classList.toggle('done', r.done); });
}
function tickGrocery(btn) {
  const g = S.groceries.find(x => x.id === btn.dataset.id), row = btn.closest('[data-row]');
  const next = !g.done; row.classList.add('ticking'); btn.setAttribute('aria-checked', String(next)); row.classList.toggle('done', next);
  const who = whoOf(btn);
  setTimeout(() => {
    g.done = next; if (next) { g.tickedBy = who; g.tickedAt = 'just now'; } S.moved = g.id; renderGroceries(); renderLists(); bind();
  }, 520);
}

/* ---------------- clicks ---------------- */
document.addEventListener('click', e => {
  if (menuEl && !e.target.closest('.menu')) closeMenu(false);
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act;
  if (a === 'theme') setTheme(eff() === 'dark' ? 'light' : 'dark');
  else if (a === 'tick-todo') tickTodo(t);
  else if (a === 'tick-agenda') tickAgenda(t);
  else if (a === 'tick-grocery') tickGrocery(t);
  else if (a === 'tab') { const g = t.closest('[data-tabs]'); $$('[data-act="tab"]', g).forEach(b => b.removeAttribute('aria-current')); t.setAttribute('aria-current', 'page'); if (t.dataset.goto) { const el = document.getElementById(t.dataset.goto); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } }
  else if (a === 'open-sheet') sheetOpen(hostOf(t));
  else if (a === 'edit-event') sheetOpen(hostOf(t), t.dataset.id);
  else if (a === 'close-sheet') sheetClose(t.closest('.sheet-host'));
  else if (a === 'save-sheet') sheetSave(t.closest('.sheet'));
  else if (a === 'seg') { setSeg(t.closest('[data-seg]'), t.dataset.val); }
  else if (a === 'switch') { setSwitch(t, t.getAttribute('aria-checked') !== 'true'); }
  else if (a === 'menu') { openMenu(t, t.dataset.options.split('|'), t.dataset.value, v => setMenuVal(t, v)); }
  else if (a === 'cat') {
    e.stopPropagation(); S.sel = t.dataset.id; const tx = S.tx.find(x => x.id === t.dataset.id);
    renderTx();
    const anchor = $(`[data-render="tx"] [data-act="cat"][data-id="${tx.id}"]`, t.closest('.desk') || document);
    openMenu(anchor || t, ['No category'].concat(CATS), tx.cat || 'No category', v => { tx.cat = v === 'No category' ? '' : v; renderTx(); bind(); });
  }
  else if (a === 'cat-panel') {
    const tx = S.tx.find(x => x.id === S.sel);
    openMenu(t, ['No category'].concat(CATS), tx.cat || 'No category', v => { tx.cat = v === 'No category' ? '' : v; renderTx(); bind(); });
  }
  else if (a === 'sel-tx') { if (e.target.closest('[data-act="cat"]')) return; S.sel = t.dataset.id; renderTx(); }
  else if (a === 'chip') {
    const k = t.dataset.chip;
    if (k === 'need') { S.filter.need = !S.filter.need; renderTx(); bind(); }
    else if (k === 'acct') openMenu(t, ['All accounts', 'BofA checking', 'BofA card'], bindLabel('acct'), v => { S.filter.acct = v === 'All accounts' ? 'all' : (v === 'BofA card' ? 'card' : 'checking'); renderTx(); bind(); });
    else if (k === 'month') openMenu(t, ['All months', 'October', 'September'], bindLabel('month'), v => { S.filter.month = v === 'All months' ? 'all' : (v === 'October' ? 'Oct' : 'Sep'); renderTx(); bind(); });
  }
  else if (a === 'review-uncat') { S.filter.need = true; S.filter.acct = 'all'; S.filter.month = 'all'; renderTx(); bind(); const el = document.getElementById('ab5'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  else if (a === 'clear-filters') { S.filter = { acct: 'all', month: 'all', need: false }; renderTx(); bind(); }
});
function bindLabel(k) { return k === 'acct' ? (S.filter.acct === 'all' ? 'All accounts' : ACCT[S.filter.acct]) : (S.filter.month === 'all' ? 'All months' : MONTH[S.filter.month]); }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (menuEl) { closeMenu(true); return; } $$('.sheet-host[data-open="true"]').forEach(h => { if (!h.closest('[data-pinned-open]')) sheetClose(h); }); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr[data-act="sel-tx"]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-add-item]'); if (!f) return; e.preventDefault();
  const inp = $('input', f), name = inp.value.trim(); if (!name) return;
  S.groceries.push({ id: 'g' + Date.now(), name, meta: '', by: whoOf(f), done: false });
  inp.value = ''; renderGroceries(); renderLists(); bind();
  const lastRow = $$('[data-render="gopen"] [data-row]', f.closest('.phone')).pop(); if (lastRow) { lastRow.classList.add('fresh'); lastRow.scrollIntoView({ block: 'nearest' }); }
  inp.focus();
});

/* ---------------- boot ---------------- */
function boot() {
  loadTemplates();
  $$('[data-clone-of]').forEach(p => { const src = document.getElementById(p.dataset.cloneOf); $('.screen', p).innerHTML = $('.screen', src).innerHTML; });
  $$('.sheet-host').forEach(h => { h.innerHTML = T.sheet; h.dataset.open = h.hasAttribute('data-start-open') ? 'true' : 'false'; h.setAttribute('aria-hidden', h.dataset.open === 'true' ? 'false' : 'true'); });
  $$('[data-rail]').forEach(r => { r.innerHTML = T.rail; $$('[data-key]', r).forEach(b => { if (b.dataset.key === r.dataset.rail) b.setAttribute('aria-current', 'page'); }); });
  renderAll();
  $$('.sheet-host[data-start-open]').forEach(h => sheetOpen(h, null));
  paintTheme();
}
document.addEventListener('DOMContentLoaded', boot);
window.__legion = { S, renderAll };
})();

</script>
