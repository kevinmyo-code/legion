<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nav A: bottom sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0c0f}
a{color:#FFB4A1}a:hover{color:#FFDBD1}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 384px; height: 832px; position: relative; overflow: hidden; background: #121317; font-family: Figtree, system-ui, sans-serif; color: #E6E7EC">

<sc-if value="{{ isNoSetup }}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: 32px; box-sizing: border-box">
<div style="width: 56px; height: 56px; border-radius: 16px; background: #0F3B40; display: flex; align-items: center; justify-content: center">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#77DCE5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-8-8 18-2-8-8-2z"></path></svg>
</div>
<div style="font-size: 24px; font-weight: 700; line-height: 1.25">Navigation isn't set up</div>
<div style="font-size: 16px; color: #A9ADB8; line-height: 1.5">LEGION needs a Mapbox token to draw maps and give directions. Nothing is navigating.</div>
<button style="align-self: flex-start; height: 48px; padding: 0 24px; border: none; border-radius: 24px; background: #FFB4A1; color: #3B0A00; font-size: 16px; font-weight: 600" onClick="{{ toPreview }}">Add a token in Setup</button>
</div>
</sc-if>

<sc-if value="{{ hasMap }}" hint-placeholder-val="{{ true }}">
<svg width="384" height="832" viewBox="0 0 384 832" style="position: absolute; inset: 0" aria-hidden="true">
<rect width="384" height="832" fill="#17191E"></rect>
<rect x="20" y="150" width="120" height="90" rx="6" fill="#1D2026"></rect>
<rect x="190" y="130" width="160" height="110" rx="6" fill="#1D2026"></rect>
<rect x="30" y="300" width="110" height="140" rx="6" fill="#1B2A22"></rect>
<rect x="200" y="300" width="150" height="150" rx="6" fill="#1D2026"></rect>
<rect x="20" y="500" width="130" height="120" rx="6" fill="#1D2026"></rect>
<rect x="210" y="510" width="150" height="100" rx="6" fill="#1D2026"></rect>
<path d="M0 270 H384" stroke="#2C3038" stroke-width="16"></path>
<path d="M0 470 H384" stroke="#2C3038" stroke-width="12"></path>
<path d="M170 0 V832" stroke="#2C3038" stroke-width="16"></path>
<path d="M60 0 L120 832" stroke="#25282F" stroke-width="10"></path>
<path d="M300 0 V832" stroke="#25282F" stroke-width="10"></path>
<sc-if value="{{ isPreview }}" hint-placeholder-val="{{ false }}">
<path d="M170 700 V470 H300 V120" fill="none" stroke="#3A3E47" stroke-width="7" stroke-dasharray="2 10" stroke-linecap="round"></path>
</sc-if>
<path d="{{ routePath }}" fill="none" stroke="#0F3B40" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="{{ routePath }}" fill="none" stroke="#77DCE5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></path>
<sc-if value="{{ hasStop }}" hint-placeholder-val="{{ false }}">
<circle cx="170" cy="380" r="11" fill="#FFC857" stroke="#121317" stroke-width="3"></circle>
</sc-if>
<circle cx="230" cy="120" r="12" fill="#FFB4A1" stroke="#121317" stroke-width="3"></circle>
<circle cx="170" cy="640" r="18" fill="#FFB4A1" fill-opacity="0.2"></circle>
<path d="M170 626 L180 652 L170 646 L160 652 Z" fill="#FFB4A1" stroke="#121317" stroke-width="2" stroke-linejoin="round"></path>
</svg>
</sc-if>

<sc-if value="{{ isGuiding }}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; top: 12px; left: 12px; right: 12px; background: #0F3B40; border-radius: 20px; padding: 16px; display: flex; gap: 14px; align-items: center">
<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#E6F9FB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 20V10a3 3 0 0 0-3-3H6"></path><path d="M10 3L6 7l4 4"></path></svg>
<div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<div style="font-size: 30px; font-weight: 700; color: #E6F9FB; line-height: 1">0.3 mi</div>
<div style="font-size: 18px; font-weight: 600; color: #BDEFF4">Turn left onto Kirby Dr</div>
</div>
</div>
<div style="position: absolute; top: 112px; left: 12px; background: #1C1E24; border-radius: 0 0 14px 14px; padding: 8px 14px; font-size: 14px; color: #A9ADB8">Then: merge onto I-69 S</div>
<sc-if value="{{ muted }}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; top: 112px; right: 12px; background: #4A1F24; border-radius: 0 0 14px 14px; padding: 8px 14px; font-size: 14px; color: #FFB4AB">Turn cues muted</div>
</sc-if>
</sc-if>

<sc-if value="{{ hasMap }}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; left: 12px; right: 12px; bottom: {{ pillBottom }}; display: flex; justify-content: center">
<div style="display: flex; align-items: center; gap: 10px; background: #24272E; border: 1px solid #3A3E47; border-radius: 24px; padding: 8px 16px 8px 10px; font-size: 14px; color: #A9ADB8">
<span style="width: 28px; height: 28px; border-radius: 14px; background: #733423; display: flex; align-items: center; justify-content: center">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFDBD1" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
</span>
<span>{{ assistantLine }}</span>
</div>
</div>
</sc-if>

<sc-if value="{{ isPreview }}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; right: 0; bottom: 0; background: #1C1E24; border-radius: 28px 28px 0 0; padding: 12px 16px 20px; display: flex; flex-direction: column; gap: 10px">
<div style="width: 36px; height: 4px; border-radius: 2px; background: #3A3E47; align-self: center"></div>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 13px; color: #8A8F9B; text-transform: uppercase; letter-spacing: 0.08em">To</div>
<div style="font-size: 22px; font-weight: 700">Home</div>
<div style="font-size: 14px; color: #A9ADB8">Saved place · 9.4 mi</div>
</div>
<sc-for list="{{ routes }}" as="r" hint-placeholder-count="3">
<button style="{{ r.style }}" onClick="{{ r.pick }}" aria-pressed="{{ r.selected }}">
<span style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px">
<span style="font-size: 16px; font-weight: 600">{{ r.name }}</span>
<span style="font-size: 13px; color: #A9ADB8">{{ r.via }}</span>
</span>
<span style="font-size: 18px; font-weight: 700">{{ r.time }}</span>
</button>
</sc-for>
<button style="height: 52px; border: none; border-radius: 26px; background: #FFB4A1; color: #3B0A00; font-size: 17px; font-weight: 700" onClick="{{ start }}">Start</button>
</div>
</sc-if>

<sc-if value="{{ isGuiding }}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; left: 0; right: 0; bottom: 0; background: #1C1E24; border-radius: 28px 28px 0 0; padding: 12px 16px 20px; display: flex; flex-direction: column; gap: 14px">
<div style="width: 36px; height: 4px; border-radius: 2px; background: #3A3E47; align-self: center"></div>
<div style="display: flex; align-items: flex-end; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 28px; font-weight: 700; color: #7EDBA5">{{ timeLeft }}</div>
<div style="font-size: 14px; color: #A9ADB8">{{ etaLine }}</div>
</div>
<button style="height: 44px; padding: 0 20px; border: none; border-radius: 22px; background: #4A1F24; color: #FFB4AB; font-size: 15px; font-weight: 600" onClick="{{ arrive }}">End</button>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<button style="{{ stopBtn }}" onClick="{{ toggleStop }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg><span>{{ stopLabel }}</span></button>
<button style="{{ tollBtn }}" onClick="{{ toggleTolls }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M6.5 6.5l11 11"></path></svg><span>No tolls</span></button>
<button style="{{ btn }}" onClick="{{ toPreview }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M4 12h16M4 18h7"></path></svg><span>Routes</span></button>
<button style="{{ muteBtn }}" onClick="{{ toggleMute }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4z"></path><path d="M16 9l5 6M21 9l-5 6"></path></svg><span>{{ muteLabel }}</span></button>
</div>
</div>
</sc-if>

<sc-if value="{{ isArrived }}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; right: 0; bottom: 0; background: #1C1E24; border-radius: 28px 28px 0 0; padding: 24px 16px 24px; display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 13px; color: #7EDBA5; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600">{{ endTitle }}</div>
<div style="font-size: 24px; font-weight: 700">Home</div>
<div style="font-size: 15px; color: #A9ADB8">{{ endLine }}</div>
<button style="height: 48px; border: 1px solid #3A3E47; border-radius: 24px; background: transparent; color: #E6E7EC; font-size: 15px; font-weight: 600" onClick="{{ toPreview }}">Done</button>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"screen":{"editor":"enum","options":["preview","guiding","arrived","nosetup"],"default":"guiding"},"$preview":{"width":384,"height":832}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const screen = s.screen || this.props.screen || 'guiding';
    const muted = !!s.muted, tolls = !!s.tolls, stop = !!s.stop, route = s.route ?? 0;
    const set = (patch) => () => this.setState(Object.assign({}, s, patch));
    const routesRaw = [
      { name: 'Fastest', via: 'via I-69 S · has tolls', time: '18 min' },
      { name: 'No tolls', via: 'via Kirby Dr', time: '21 min' },
      { name: 'Shortest', via: 'via Westheimer Rd', time: '23 min' }
    ];
    const pill = 'display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:16px;font-size:12px;font-weight:600;border:none;';
    const off = pill + 'background:#24272E;color:#E6E7EC;';
    const on = pill + 'background:#733423;color:#FFDBD1;';
    const mins = 18 + (tolls ? 3 : 0) + (stop ? 5 : 0);
    return {
      isNoSetup: screen === 'nosetup',
      hasMap: screen !== 'nosetup',
      isPreview: screen === 'preview',
      isGuiding: screen === 'guiding',
      isArrived: screen === 'arrived',
      muted, hasStop: stop,
      routePath: tolls ? 'M170 640 V270 H230 V120' : 'M170 640 V470 H60 L45 270 H230 V120',
      pillBottom: screen === 'preview' ? '384px' : (screen === 'arrived' ? '204px' : '196px'),
      assistantLine: screen === 'guiding' ? '"How long left?"  Ask, or use the buttons' : 'Say "take me home", or tap Start',
      routes: routesRaw.map((r, i) => Object.assign({}, r, {
        selected: route === i ? 'true' : 'false',
        pick: set({ route: i }),
        style: 'display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:16px;color:#E6E7EC;text-align:left;' + (route === i ? 'background:#0F3B40;border:2px solid #77DCE5;' : 'background:#24272E;border:2px solid transparent;')
      })),
      timeLeft: mins + ' min',
      etaLine: (stop ? '11.1 mi · via Shell, Westheimer · ' : '9.4 mi · ') + 'arrive 6:' + (24 + mins),
      btn: off, stopBtn: stop ? on : off, tollBtn: tolls ? on : off, muteBtn: muted ? on : off,
      stopLabel: stop ? 'Drop stop' : 'Add stop',
      muteLabel: muted ? 'Unmute' : 'Mute',
      start: set({ screen: 'guiding' }),
      endTitle: s.ended ? 'Trip ended' : 'Arrived',
      endLine: s.ended ? 'Ended 2.1 mi short. Nothing is navigating.' : 'You are here. Nothing is navigating.',
      arrive: set({ screen: 'arrived', ended: true }),
      toPreview: set({ screen: 'preview', ended: false }),
      toggleMute: set({ muted: !muted }),
      toggleTolls: set({ tolls: !tolls }),
      toggleStop: set({ stop: !stop })
    };
  }
}
</script>
</body>
</html>
